name: Build signed v418 test APK

on:
  pull_request:
    paths:
      - ".github/workflows/v418-signed.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Download and apply verified v418 patch
        run: |
          curl -fL "https://github.com/66bardiaMbm/mbm-life/releases/download/v418-codex-live-location/MBM-Life-v418-debug.zip" -o /tmp/v418.zip
          unzip -j /tmp/v418.zip "0001-Fix-live-family-location-telemetry.patch" -d /tmp
          git apply --check /tmp/0001-Fix-live-family-location-telemetry.patch
          git apply /tmp/0001-Fix-live-family-location-telemetry.patch

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Restore stable signing key
        env:
          MBM_ANDROID_KEYSTORE_B64: ${{ secrets.MBM_ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$MBM_ANDROID_KEYSTORE_B64"
          printf '%s' "$MBM_ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mbm-life-ci.p12"

      - name: Build signed APK
        working-directory: android-app
        env:
          MBM_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mbm-life-ci.p12
          MBM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MBM_ANDROID_KEYSTORE_PASSWORD }}
          MBM_ANDROID_KEY_ALIAS: ${{ secrets.MBM_ANDROID_KEY_ALIAS }}
          MBM_ANDROID_KEY_PASSWORD: ${{ secrets.MBM_ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify certificate and package ZIP
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs android-app/app/build/outputs/apk/debug/app-debug.apk
          cp android-app/app/build/outputs/apk/debug/app-debug.apk MBM-Life-v418-signed.apk
          zip -9 MBM-Life-v418-signed.zip MBM-Life-v418-signed.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MBM-Life-v418-signed
          path: MBM-Life-v418-signed.zip
          if-no-files-found: error
          retention-days: 14
