name: Publish v418 to main

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified v418 patch
        run: |
          curl -L --fail -o /tmp/v418.zip "https://github.com/66bardiaMbm/mbm-life/releases/download/v418-codex-live-location/MBM-Life-v418-debug.zip"
          unzip -o /tmp/v418.zip 0001-Fix-live-family-location-telemetry.patch -d /tmp/v418

      - name: Apply v418
        run: |
          git apply --check /tmp/v418/0001-Fix-live-family-location-telemetry.patch
          git apply /tmp/v418/0001-Fix-live-family-location-telemetry.patch
          git checkout HEAD -- .github/workflows/android-apk.yml

      - name: Verify web tests
        run: |
          node tests/v418-live-location.test.mjs
          node tests/v418-presence-behaviour.test.mjs

      - name: Publish to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish v418 live location fixes"
          git push origin HEAD:main
