name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        working-directory: android-app
        run: chmod +x gradlew

      - name: Run unit tests
        working-directory: android-app
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Restore stable APK signing key
        env:
          MBM_ANDROID_KEYSTORE_B64: ${{ secrets.MBM_ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$MBM_ANDROID_KEYSTORE_B64"
          printf '%s' "$MBM_ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mbm-life-ci.p12"

      - name: Assemble auth-fixed debug APK
        working-directory: android-app
        env:
          MBM_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mbm-life-ci.p12
          MBM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MBM_ANDROID_KEYSTORE_PASSWORD }}
          MBM_ANDROID_KEY_ALIAS: ${{ secrets.MBM_ANDROID_KEY_ALIAS }}
          MBM_ANDROID_KEY_PASSWORD: ${{ secrets.MBM_ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK signing certificate
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Name sync-diagnostics APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk android-app/app/build/outputs/apk/debug/MBM-Life-v427-sync-diagnostics.apk

      - name: Upload sync-diagnostics APK
        uses: actions/upload-artifact@v4
        with:
          name: MBM-Life-v427-sync-diagnostics
          path: android-app/app/build/outputs/apk/debug/MBM-Life-v427-sync-diagnostics.apk
          if-no-files-found: error
          retention-days: 14
