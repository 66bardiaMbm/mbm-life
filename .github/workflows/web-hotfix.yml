name: Test Web Hotfix

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "index.html"
      - "tests/**"
      - ".github/workflows/web-hotfix.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test stale-driving regression
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check regression tests
        run: |
          for test_file in tests/*.test.mjs tests/v401.test.js; do
            node "$test_file"
          done
