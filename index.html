}

/* ══════════════════════════════════════════
   LOCATION AUTOCOMPLETE (Nominatim + GPS bias)
   ══════════════════════════════════════════ */
let _userGeo=null,_userGeoTried=false;
function ensureUserGeo(cb){
  if(_userGeo){cb(_userGeo);return;}
  if(_userGeoTried){cb(null);return;}
  if(!navigator.geolocation){_userGeoTried=true;cb(null);return;}
  navigator.geolocation.getCurrentPosition(
    p=>{
      _userGeo={lat:p.coords.latitude,lon:p.coords.longitude};
      _userGeoTried=true;
      cb(_userGeo);
    },
    err=>{
      _userGeoTried=true;
      // Fallback: use Hobart if permission denied
      _userGeo={lat:-42.8821,lon:147.3272};
      cb(_userGeo);
    },
    {enableHighAccuracy:false,timeout:8000,maximumAge:300000});
}

function attachLocationAutocomplete(inputEl,onSelect){
  let _timer=null,_drop=null;
  const dropStyle=`position:absolute;z-index:999;left:0;right:0;
    background:#1c1c24;border:1px solid rgba(255,255,255,.12);border-radius:12px;
    margin-top:4px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.5)`;
  function removeDrop(){if(_drop){_drop.remove();_drop=null;}}
  function showLoading(){
    removeDrop();
    _drop=document.createElement('div');
    _drop.style.cssText=dropStyle;
    _drop.innerHTML=`<div style="padding:12px 14px;font-size:13px;color:var(--ink3)">🔍 ${L==='fa'?'در حال جستجو...':'Searching...'}</div>`;
    const wrap=inputEl.closest('.fld')||inputEl.parentElement;
    wrap.style.position='relative';wrap.appendChild(_drop);
  }
  function showError(){
    removeDrop();
    _drop=document.createElement('div');
    _drop.style.cssText=dropStyle;
    _drop.innerHTML=`<div style="padding:12px 14px;font-size:13px;color:var(--danger)">⚠ ${L==='fa'?'خطا در جستجو':'Search failed'}</div>`;
    const wrap=inputEl.closest('.fld')||inputEl.parentElement;
    wrap.style.position='relative';wrap.appendChild(_drop);
    setTimeout(removeDrop,2000);
  }
  function showDrop(results){
    removeDrop();
    if(!results||!results.length){
      _drop=document.createElement('div');
      _drop.style.cssText=dropStyle;
      _drop.innerHTML=`<div style="padding:12px 14px;font-size:13px;color:var(--ink3)">${L==='fa'?'نتیجه‌ای یافت نشد':'No results found'}</div>`;
      const wrap=inputEl.closest('.fld')||inputEl.parentElement;
      wrap.style.position='relative';wrap.appendChild(_drop);
      setTimeout(removeDrop,2000);
      return;
    }
    _drop=document.createElement('div');
    _drop.style.cssText=dropStyle;
    results.slice(0,5).forEach(r=>{
      const row=document.createElement('div');
      row.style.cssText='padding:13px 14px;font-size:14px;color:#f0f0f8;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.06)';
      row.textContent=r.display_name;
      row.onclick=()=>{
        inputEl.value=r.display_name;
        onSelect({name:r.display_name,lat:parseFloat(r.lat),lon:parseFloat(r.lon)});
        removeDrop();};
      _drop.appendChild(row);
    });
    // Position relative to input
    const wrap=inputEl.closest('.fld')||inputEl.parentElement;
    wrap.style.position='relative';
    wrap.appendChild(_drop);
  }
  inputEl.oninput=()=>{
    clearTimeout(_timer);
    const q=inputEl.value.trim();
    if(q.length<2){removeDrop();return;}
    _timer=setTimeout(()=>{
      showLoading();
      function doSearch(geo){
        let url=`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=7`;
        if(geo)url+=`&lat=${geo.lat}&lon=${geo.lon}`;
        fetch(url)
          .then(r=>r.json())
          .then(data=>{
            const results=(data.features||[]).map(f=>{
              const p=f.properties;
              const parts=[p.name,p.street&&p.housenumber?p.street+' '+p.housenumber:p.street,p.city||p.town||p.village,p.state,p.country].filter(Boolean);
              return {display_name:parts.join(', '),lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0]};
            });
            if(results.length){showDrop(results);}
            else{
              // Fallback to Nominatim
              let url2=`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=5`;
              if(geo)url2+=`&viewbox=${geo.lon-.5},${geo.lat-.5},${geo.lon+.5},${geo.lat+.5}&bounded=0`;
              fetch(url2,{headers:{'User-Agent':'MBMLife/1.0'}})
                .then(r=>r.json()).then(r=>showDrop(r)).catch(()=>showError());
            }
          }).catch(()=>{
            // Fallback to Nominatim
            let url2=`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=5`;
            fetch(url2,{headers:{'User-Agent':'MBMLife/1.0'}})
              .then(r=>r.json()).then(r=>showDrop(r)).catch(()=>showError());
          });
      }
      if(_userGeo){doSearch(_userGeo);}
      else{
        doSearch(null);
        ensureUserGeo(geo=>{if(geo&&q===inputEl.value.trim())doSearch(geo);});
      }
    },300);
  };
  inputEl.addEventListener('blur',()=>setTimeout(removeDrop,200));
}

/* ── Auto update check ── */
const UPD_DISMISS_KEY='mbmlife_update_dismissed';
let _latestRemoteVer=null;

async function fetchRemoteVersion(){
  const base=location.href.split('?')[0].split('#')[0];
  // Guard against a hung network call freezing the app: abort after 8s.
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),8000);
  try{
    const res=await fetch(base+'?_='+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache'},signal:ctrl.signal});
    if(!res.ok)return null;
    const text=await res.text();
    const match=text.match(/APP_VERSION='([^']+)'/);
    return match&&match[1]?match[1]:null;
  }finally{
    clearTimeout(timer);
  }
}

function showUpdateBanner(ver){
  _latestRemoteVer=ver;
  const banner=document.getElementById('update-banner');
  if(!banner)return;
  const title=document.getElementById('ub-title');
  const sub=document.getElementById('ub-sub');
  const later=document.getElementById('ub-later');
  const update=document.getElementById('ub-update');
  if(title)title.textContent=(L==='fa'?'نسخه جدید موجود است':'New version available');
  if(sub)sub.textContent=(L==='fa'?('نسخه '+ver+' آماده نصب است.'):('Version '+ver+' is ready to install.'));
  if(later)later.textContent=(L==='fa'?'بعداً':'Later');
  if(update)update.textContent=(L==='fa'?'به‌روزرسانی':'Update now');
  banner.classList.remove('out');
  banner.style.display='block';
}

function hideUpdateBanner(){
  const banner=document.getElementById('update-banner');
  if(!banner)return;
  banner.classList.add('out');
  setTimeout(()=>{banner.style.display='none';banner.classList.remove('out');},300);
}

function dismissUpdate(){
  if(_latestRemoteVer){
    try{localStorage.setItem(UPD_DISMISS_KEY,_latestRemoteVer);}catch(e){}
  }
  hideUpdateBanner();
}

function applyUpdate(){
  const update=document.getElementById('ub-update');
  if(update){update.textContent=(L==='fa'?'در حال نصب...':'Updating...');update.disabled=true;}
  const later=document.getElementById('ub-later');
  if(later)later.style.display='none';
  // Treat the new version as current after reload
  try{localStorage.removeItem(UPD_DISMISS_KEY);}catch(e){}
  // Remember where the user was, so the update doesn't dump them on the home screen.
  try{
    localStorage.setItem('mbmlife_restore_v1',JSON.stringify({
      screen:screen,tasksView:tasksView,activeListId:activeListId,
      activeSmartView:activeSmartView,plannedFilter:plannedFilter,t:Date.now()
    }));
  }catch(e){}

  const reload=()=>{
    // In an installed PWA (standalone), changing the query string can kick the
    // user out to an external browser tab. Detect standalone and reload in place.
    const standalone = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone===true;
    if(standalone){
      location.reload();
    } else {
      const base=location.href.split('?')[0].split('#')[0];
      location.replace(base+'?v='+Date.now());
    }
  };

  // Run cleanup steps best-effort, then reload no matter what.
  const tasks=[];
  // 1) Clear Cache Storage (old PWA caches)
  if('caches' in window){
    tasks.push(caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))).catch(()=>{}));
  }
  // 2) Unregister any stale service workers that could serve old HTML
  if('serviceWorker' in navigator){
    tasks.push(navigator.serviceWorker.getRegistrations()
      .then(regs=>Promise.all(regs.map(r=>r.unregister()))).catch(()=>{}));
  }
  // Safety: never let cleanup hang the update — reload after 1.5s regardless
  let done=false;
  const go=()=>{if(done)return;done=true;reload();};
  Promise.all(tasks).then(go).catch(go);
  setTimeout(go,1500);
}

// Automatic background check
async function checkForUpdate(){
  try{
    const ver=await fetchRemoteVersion();
    if(!ver||ver===APP_VERSION)return;
    let dismissed=null;
    try{dismissed=localStorage.getItem(UPD_DISMISS_KEY);}catch(e){}
    // Only show if this exact newer version hasn't been dismissed
    if(dismissed===ver)return;
    showUpdateBanner(ver);
  }catch(e){}
}

// Manual check from More > About
async function manualCheckForUpdate(){
  toast(L==='fa'?'در حال بررسی...':'Checking…',1500);
  try{
    const ver=await fetchRemoteVersion();
    if(ver&&ver!==APP_VERSION){
      // Manual check overrides a prior dismissal for this version
      try{localStorage.removeItem(UPD_DISMISS_KEY);}catch(e){}
      showUpdateBanner(ver);
    }else if(ver){
      toast(L==='fa'?'برنامه به‌روز است ✓':'You’re up to date ✓');
    }else{
      // Couldn't read a version (offline / blocked) — say so instead of freezing.
      toast(L==='fa'?'اتصال برقرار نشد':'Couldn’t reach server');
    }
  }catch(e){
    const aborted=e&&e.name==='AbortError';
    toast(aborted?(L==='fa'?'زمان بررسی تمام شد':'Check timed out')
                 :(L==='fa'?'بررسی ناموفق بود':'Check failed'));
  }
}

function restoreAfterUpdate(){
  let raw;
  try{raw=localStorage.getItem('mbmlife_restore_v1');}catch(e){return;}
  if(!raw)return;
  try{localStorage.removeItem('mbmlife_restore_v1');}catch(e){}
  let st;
  try{st=JSON.parse(raw);}catch(e){return;}
  if(!st||!st.t||(Date.now()-st.t>60000))return; // only honor a fresh (<60s) restore
  try{
    screen=st.screen||'lists';
    tasksView=st.tasksView||'browser';
    activeListId=st.activeListId||null;
    activeSmartView=st.activeSmartView||null;
    plannedFilter=st.plannedFilter||'all';
    // Guard: if the saved list no longer exists, fall back to home.
    if(activeListId && !DB.lists.some(l=>l.id===activeListId)){
      activeListId=null;tasksView='browser';screen='lists';
    }
    render();
    if(screen==='lists'&&tasksView==='detail'){window.scrollTo(0,0);}
  }catch(e){}
}
