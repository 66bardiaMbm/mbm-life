<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>MBM Life</title>
<meta name="theme-color" content="#0f0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* ═══════════════════════════════════
   MBM LIFE — Design System v64
   ═══════════════════════════════════ */
:root{
  --s0:#0f0f14; --s1:#16161e; --s2:#1e1e2a; --s3:#26263a;
  --ink:#f0f0f8; --ink2:#a0a0c0; --ink3:#606080;
  --brand:#6e56f8; --brand2:#9d7bff;
  --brandg:linear-gradient(135deg,#6e56f8,#9d7bff);
  --ok:#22d3a0; --warn:#f59e0b; --danger:#f43f5e; --info:#38bdf8;
  --b1:rgba(255,255,255,.07); --b2:rgba(255,255,255,.12);
  --sh:0 8px 32px rgba(0,0,0,.5);
  --r:16px; --r2:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--s0);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body.rtl{direction:rtl;font-family:Vazirmatn,Tahoma,system-ui,sans-serif}

/* ── App shell ── */
#app{display:flex;flex-direction:column;height:100vh;max-width:480px;
  margin:0 auto;position:relative;overflow:hidden}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;padding:0 0 82px}
#screen::-webkit-scrollbar{display:none}

/* ── Nav bar ── */
#nav{position:absolute;bottom:0;left:0;right:0;height:82px;
  background:var(--s1);border-top:1px solid var(--b1);
  display:flex;align-items:stretch;padding:0 4px;
  padding-bottom:env(safe-area-inset-bottom,0)}
.nv{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;border:none;background:none;
  cursor:pointer;color:var(--ink3);font-size:10px;font-weight:600;
  letter-spacing:.3px;padding:8px 4px;transition:color .15s}
.nv.on{color:var(--brand)}
.nv-ic{font-size:22px;line-height:1;transition:transform .15s}
.nv-lb{font-size:10px;font-weight:600;letter-spacing:.2px;line-height:1}
.nv.on .nv-ic{transform:scale(1.1)}

/* ── FAB ── */
#fab{position:fixed;bottom:calc(82px + 16px + env(safe-area-inset-bottom,0));
  right:20px;width:56px;height:56px;border-radius:18px;
  background:var(--brandg);border:none;color:#fff;font-size:26px;
  cursor:pointer;box-shadow:0 8px 24px rgba(110,86,248,.45);
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s,box-shadow .15s;z-index:40}
#fab:active{transform:scale(.93)}

/* ── Typography helpers ── */
.sec-label{font-size:12px;font-weight:600;color:var(--ink3);
  padding:14px 20px 6px;letter-spacing:.1px}
.empty{text-align:center;padding:48px 24px;color:var(--ink3)}
.empty-ic{font-size:36px;margin-bottom:12px;opacity:.4}
.empty-tx{font-size:14px;line-height:1.6}

/* ── Checkbox ── */
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink3);
  flex:none;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .18s}
.chk.on{background:var(--brand);border-color:var(--brand)}
.chk.on::after{content:'';width:6px;height:10px;border:2.5px solid #fff;
  border-top:none;border-left:none;transform:rotate(42deg) translateY(-1px);display:block}

/* ── Star ── */
.star{width:36px;height:36px;flex:none;background:none;border:none;
  cursor:pointer;color:var(--ink3);font-size:18px;
  display:flex;align-items:center;justify-content:center;
  opacity:.45;transition:all .15s}
.star.on{color:#f59e0b;opacity:1}

/* ── Chips / pills ── */
.chip{display:inline-flex;align-items:center;gap:3px;background:var(--s2);
  border:1px solid var(--b1);border-radius:6px;padding:2px 7px;
  font-size:11px;font-weight:600;color:var(--ink2)}
.chip.over{color:var(--danger);border-color:rgba(244,63,94,.3);
  background:rgba(244,63,94,.08)}
.pill{font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;flex:none}
.pill.p1{background:rgba(244,63,94,.15);color:var(--danger)}
.pill.p2{background:rgba(245,158,11,.15);color:var(--warn)}

/* ── Form elements ── */
.fld{margin-bottom:14px}
.fld label{display:block;font-size:11px;font-weight:700;letter-spacing:.4px;
  text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.finput{width:100%;background:var(--s2);border:1px solid var(--b1);
  border-radius:var(--r2);padding:13px 14px;color:var(--ink);
  font-size:15px;outline:none;transition:border-color .15s;font-family:inherit}
.finput:focus{border-color:var(--brand)}
.finput::placeholder{color:var(--ink3)}
textarea.finput{resize:vertical;min-height:80px}

/* ── Chipsel ── */
.chipsel{display:flex;gap:6px;flex-wrap:wrap}
.chipsel button{background:var(--s2);border:1px solid var(--b1);border-radius:8px;
  padding:7px 13px;color:var(--ink2);font-size:13px;font-weight:600;cursor:pointer}
.chipsel button.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* ── Buttons ── */
.btn{border:none;border-radius:var(--r2);padding:14px;font-size:15px;
  font-weight:700;cursor:pointer;width:100%;transition:opacity .15s;font-family:inherit}
.btn:active{opacity:.8}
.btn-primary{background:var(--brandg);color:#fff}
.btn-ghost{background:var(--s2);color:var(--ink);border:1px solid var(--b1)}
.btn-danger{background:rgba(244,63,94,.15);color:var(--danger);
  border:1px solid rgba(244,63,94,.2)}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn-row .btn{flex:1}
.btn-cancel{background:none;border:none;color:var(--ink2);font-size:15px;
  font-weight:600;cursor:pointer;padding:14px;width:100%;
  text-align:center;margin-top:4px;font-family:inherit}

/* ════════════════════════════
   TODAY SCREEN
   ════════════════════════════ */
.today-head{padding:20px 20px 8px}
.today-date{font-size:13px;color:var(--ink3);font-weight:500;margin-bottom:6px}
.today-title{font-size:30px;font-weight:800;letter-spacing:-.5px}
.today-overdue-pill{display:inline-flex;align-items:center;gap:5px;
  background:rgba(244,63,94,.12);border-radius:6px;padding:3px 9px;
  font-size:12px;font-weight:700;color:var(--danger);margin-top:8px}
.ts-label{font-size:12px;font-weight:600;color:var(--ink3);
  padding:14px 20px 6px}

/* ── Inline add bar ── */
.inline-add{display:flex;align-items:center;padding:0 8px;
  background:var(--s1);border-top:1px solid var(--b1)}
.inline-add-chk{width:52px;height:54px;display:flex;align-items:center;
  justify-content:center;flex:none}
.inline-add-dot{width:22px;height:22px;border-radius:50%;
  border:2px solid var(--ink3);flex:none}
.inline-add input{flex:1;background:none;border:none;outline:none;
  font-size:16px;color:var(--ink);font-family:inherit;padding:16px 0}
.inline-add input::placeholder{color:var(--ink3)}

/* ════════════════════════════
   FLAT TASK ROW (Lists + Today)
   ════════════════════════════ */
.trow-flat{display:flex;align-items:flex-start;padding:0 8px;
  border-bottom:1px solid var(--b1);cursor:pointer;
  transition:background .1s;background:var(--s1)}
.trow-flat:active{background:var(--s2)}
.trow-flat:last-child{border-bottom:none}
.trow-chk-wrap{width:52px;height:56px;display:flex;align-items:center;
  justify-content:center;flex:none}
.trow-content{flex:1;padding:15px 0 14px;min-width:0}
.trow-title{font-size:16px;font-weight:400;line-height:1.35;letter-spacing:-.1px}
.trow-meta-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.trow-star-wrap{width:48px;height:56px;display:flex;align-items:center;
  justify-content:center;flex:none}
.trow-flat.done .trow-title{text-decoration:line-through;opacity:.35}

/* Completed section toggle */
.done-toggle{display:flex;align-items:center;gap:10px;padding:12px 16px;
  cursor:pointer;color:var(--ink2);font-size:14px;font-weight:600;
  user-select:none;background:var(--s1)}
.done-toggle-arrow{font-size:11px;transition:transform .2s;
  display:inline-block;opacity:.6}
.done-toggle-arrow.open{transform:rotate(90deg)}

/* ════════════════════════════
   LISTS HUB
   ════════════════════════════ */
.lists-hub-header{display:flex;align-items:center;gap:14px;padding:20px 20px 8px}
.lists-hub-avatar{width:44px;height:44px;border-radius:50%;background:var(--brandg);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:800;color:#fff;flex:none}
.lists-hub-name{font-size:17px;font-weight:700;flex:1}

/* Smart view rows */
.sv-row{display:flex;align-items:center;padding:0 16px;
  cursor:pointer;transition:background .1s}
.sv-row:active{background:var(--s2)}
.sv-icon{width:52px;height:52px;display:flex;align-items:center;
  justify-content:center;flex:none}
.sv-icon-inner{width:36px;height:36px;border-radius:10px;display:flex;
  align-items:center;justify-content:center;font-size:19px}
.sv-name{flex:1;font-size:16px;font-weight:400;padding:16px 0;letter-spacing:-.1px}
.sv-count{font-size:14px;font-weight:600;color:var(--ink2);padding-right:4px}

/* Hub dividers */
.hub-sep{height:1px;background:var(--b1);margin:6px 0}
.hub-sec-label{font-size:12px;font-weight:600;color:var(--ink3);padding:10px 20px 4px}

/* User list rows */
.ul-row{display:flex;align-items:center;padding:0 16px;
  cursor:pointer;transition:background .1s}
.ul-row:active{background:var(--s2)}
.ul-icon{width:52px;height:52px;display:flex;align-items:center;
  justify-content:center;flex:none}
.ul-icon-inner{width:34px;height:34px;border-radius:9px;display:flex;
  align-items:center;justify-content:center;font-size:16px;color:#fff;font-weight:700}
.ul-name{flex:1;font-size:16px;font-weight:400;padding:15px 0;
  border-bottom:1px solid var(--b1);letter-spacing:-.1px}
.ul-row:last-child .ul-name{border-bottom:none}
.ul-count{font-size:13px;font-weight:600;color:var(--ink3);padding-right:6px}

/* New list footer */
.lists-footer{display:flex;align-items:center;padding:0 16px;
  margin-top:6px;cursor:pointer}
.lists-footer:active{opacity:.7}
.lf-icon{width:52px;height:52px;display:flex;align-items:center;
  justify-content:center;flex:none}
.lf-plus{width:34px;height:34px;border-radius:9px;border:2px solid var(--brand);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;color:var(--brand);font-weight:300}
.lf-label{font-size:16px;font-weight:400;color:var(--brand);letter-spacing:-.1px}

/* ════════════════════════════
   LIST DETAIL
   ════════════════════════════ */
.ld-bg{position:relative;overflow:hidden;min-height:152px}
.ld-bg-layer{position:absolute;inset:0;z-index:0}
.ld-topbar{display:flex;align-items:center;gap:4px;padding:12px 8px 0;
  position:relative;z-index:2}
.ld-back{width:44px;height:44px;border-radius:50%;background:none;border:none;
  color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;flex:none}
.ld-actions{display:flex;align-items:center;gap:2px;margin-left:auto}
.ld-action-btn{width:44px;height:44px;border-radius:50%;background:none;border:none;
  color:rgba(255,255,255,.8);font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.ld-title-area{padding:2px 20px 18px;position:relative;z-index:2}
.ld-title{font-size:32px;font-weight:800;letter-spacing:-.6px;
  line-height:1.15;color:#fff}
.ld-subtitle{font-size:13px;color:rgba(255,255,255,.7);margin-top:5px;font-weight:500}





/* ════════════════════════════
   PREMIUM SHEET
   ════════════════════════════ */
#sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:50;
  pointer-events:none;
  transition:background .25s,backdrop-filter .25s,-webkit-backdrop-filter .25s;
  backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px)}
#sheet-bg.on{background:rgba(0,0,0,.55);pointer-events:all;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#sheet{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;
  background:#1c1c24;border-radius:28px 28px 0 0;
  border-top:1px solid rgba(255,255,255,.1);z-index:51;
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(0.22,1,0.36,1);
  max-height:90vh;overflow-y:auto;overflow-x:hidden;
  padding-bottom:env(safe-area-inset-bottom,0);will-change:transform}
#sheet.on{transform:translateY(0)}
.sheet-handle{width:40px;height:5px;border-radius:3px;background:var(--b2);
  margin:14px auto 0;flex-shrink:0}
.sheet-body{padding:0 0 4px}
.sheet-body h3{font-size:20px;font-weight:800;margin:0 22px 16px;padding-top:16px}

/* Sheet action rows (list menu) */
.sac{display:flex;align-items:center;width:100%;background:none;border:none;
  border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer;
  text-align:left;padding:0;color:var(--ink);
  position:relative;overflow:hidden;transition:background .1s}
.sac:last-child{border-bottom:none}
.sac:active{background:rgba(255,255,255,.06)}
.sac-icon-wrap{width:58px;height:58px;display:flex;align-items:center;
  justify-content:center;flex:none}
.sac-icon{width:26px;height:26px;display:flex;align-items:center;
  justify-content:center;flex:none;opacity:.85}
.sac-icon svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.6;
  fill:none;stroke-linecap:round;stroke-linejoin:round}
.sac-label{flex:1;font-size:17px;font-weight:400;letter-spacing:-.1px;padding:18px 0}
.sac-right{display:flex;align-items:center;gap:6px;
  padding-right:18px;color:var(--ink3);font-size:13px;font-weight:500}
.sac-arr{font-size:16px;opacity:.35}
.sac.sac-danger .sac-label{color:var(--danger)}
.sac.sac-danger .sac-icon{color:var(--danger)}

/* Sub-sheet: radio check */
.sac-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--b2);
  flex:none;display:flex;align-items:center;justify-content:center;
  transition:all .15s}
.sac-check.on{background:var(--brand);border-color:var(--brand)}
.sac-check.on::after{content:'';width:5px;height:9px;border:2.5px solid #fff;
  border-top:none;border-left:none;
  transform:rotate(42deg) translateY(-1px);display:block}

/* Sheet action groups */
.sheet-group{margin:14px 14px 0;background:var(--s2);border-radius:18px;
  overflow:hidden;border:1px solid var(--b1)}
.sheet-group+.sheet-group{margin-top:10px}

/* Cancel */
.sheet-cancel{display:block;width:calc(100% - 28px);margin:8px 14px 16px;
  background:var(--s2);border:1px solid var(--b1);border-radius:16px;padding:16px;
  font-size:16px;font-weight:600;color:var(--ink2);cursor:pointer;
  text-align:center;transition:background .12s;font-family:inherit}
.sheet-cancel:active{background:var(--s3);color:var(--ink)}

/* Color picker */
.cpick{width:40px;height:40px;border-radius:50%;cursor:pointer;
  position:relative;transition:transform .15s;border:none;flex:none}
.cpick:active{transform:scale(.9)}
.cpick.on::after{content:'✓';position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:16px;font-weight:800}
.cpick.on{box-shadow:0 0 0 3px var(--s1),0 0 0 5px currentColor}

/* ════════════════════════════
   TASK DETAIL PANEL
   ════════════════════════════ */
#task-detail{position:fixed;inset:0;max-width:480px;margin:0 auto;
  background:var(--s0);z-index:45;
  transform:translateX(100%);
  transition:transform .3s cubic-bezier(0.22,1,0.36,1);
  display:flex;flex-direction:column;overflow:hidden}
#task-detail.on{transform:translateX(0)}
.td-topbar{display:flex;align-items:center;gap:4px;padding:14px 8px 0;
  flex:none;border-bottom:1px solid var(--b1)}
.td-back{width:44px;height:44px;border-radius:50%;background:none;border:none;
  color:var(--ink);font-size:24px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex:none}
.td-save{margin-left:auto;background:none;border:none;color:var(--brand);
  font-size:15px;font-weight:700;cursor:pointer;padding:10px 14px;font-family:inherit}
.td-body{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:24px}
.td-body::-webkit-scrollbar{display:none}
.td-title-wrap{padding:16px 20px 0;display:flex;align-items:flex-start;gap:12px}
.td-chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink3);
  flex:none;margin-top:4px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .18s}
.td-chk.on{background:var(--brand);border-color:var(--brand)}
.td-chk.on::after{content:'';width:7px;height:11px;border:2.5px solid #fff;
  border-top:none;border-left:none;
  transform:rotate(42deg) translateY(-1px);display:block}
.td-title-input{flex:1;background:none;border:none;outline:none;
  font-size:22px;font-weight:600;color:var(--ink);font-family:inherit;
  line-height:1.3;padding:0;resize:none;min-height:36px}
.td-title-input.done{text-decoration:line-through;opacity:.4}
.td-section{border-top:1px solid var(--b1);margin-top:6px}
.td-row{display:flex;align-items:center;padding:0 8px;
  cursor:pointer;transition:background .1s;min-height:52px}
.td-row:active{background:var(--s1)}
.td-row-ic{width:44px;height:52px;display:flex;align-items:center;
  justify-content:center;flex:none;font-size:18px;color:var(--ink2)}
.td-row-body{flex:1;padding:14px 0;min-width:0}
.td-row-label{font-size:15px;color:var(--ink3)}
.td-row-value{font-size:15px;color:var(--ink);font-weight:500}
.td-row-arr{color:var(--ink3);font-size:14px;opacity:.5;padding-right:8px}
.td-row-active .td-row-label,.td-row-active .td-row-ic{color:var(--brand)}
.td-row-over{color:var(--danger)!important}
.td-step{display:flex;align-items:center;padding:0 8px;
  border-bottom:1px solid var(--b1);min-height:48px}
.td-step-chk{width:44px;height:48px;display:flex;align-items:center;
  justify-content:center;flex:none}
.td-step-chk-box{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink3);
  cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;
  transition:all .15s}
.td-step-chk-box.on{background:var(--ok);border-color:var(--ok)}
.td-step-chk-box.on::after{content:'';width:5px;height:8px;border:2px solid #fff;
  border-top:none;border-left:none;
  transform:rotate(42deg) translateY(-1px);display:block}
.td-step-text{flex:1;font-size:15px;color:var(--ink);padding:13px 0}
.td-step.done .td-step-text{text-decoration:line-through;opacity:.38}
.td-step-del{width:36px;height:48px;display:flex;align-items:center;
  justify-content:center;background:none;border:none;
  color:var(--ink3);font-size:18px;cursor:pointer;opacity:.5}
.td-notes{width:100%;background:none;border:none;outline:none;resize:none;
  font-family:inherit;font-size:15px;color:var(--ink);
  padding:14px 0;min-height:60px;line-height:1.5}
.td-notes::placeholder{color:var(--ink3)}
.td-delete{display:flex;align-items:center;padding:0 8px;
  cursor:pointer;min-height:52px;border-top:1px solid var(--b1);margin-top:8px}
.td-delete-ic{width:44px;height:52px;display:flex;align-items:center;
  justify-content:center;flex:none;font-size:18px;color:var(--danger);opacity:.7}
.td-delete-tx{font-size:15px;color:var(--danger);opacity:.7}

/* ════════════════════════════
   SEARCH SCREEN
   ════════════════════════════ */
#search-screen{position:fixed;inset:0;max-width:480px;margin:0 auto;
  background:var(--s0);z-index:44;
  transform:translateY(-8px);opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s}
#search-screen.on{transform:translateY(0);opacity:1;pointer-events:all}
.srch-top{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.srch-input-wrap{flex:1;display:flex;align-items:center;gap:8px;
  background:var(--s2);border:1px solid var(--b1);border-radius:14px;
  padding:11px 14px}
.srch-input-wrap input{flex:1;background:none;border:none;outline:none;
  font-size:16px;color:var(--ink);font-family:inherit}
.srch-input-wrap input::placeholder{color:var(--ink3)}
.srch-cancel{background:none;border:none;color:var(--brand);font-size:15px;
  font-weight:600;cursor:pointer;white-space:nowrap;flex:none;
  padding:0 4px;font-family:inherit}
.srch-results{padding:0 0 80px}
.srch-hint{text-align:center;padding:40px 24px;color:var(--ink3);
  font-size:14px;line-height:1.6}
.srch-empty{text-align:center;padding:60px 24px;color:var(--ink3);font-size:15px}

/* ════════════════════════════
   SYNC / TOAST / AUTH
   ════════════════════════════ */
#sync-badge{position:fixed;top:env(safe-area-inset-top,0);right:0;left:0;
  max-width:480px;margin:0 auto;z-index:60;pointer-events:none}
.sync-bar{font-size:12px;font-weight:700;padding:6px 16px;
  text-align:center;transition:opacity .3s}
.sync-bar.synced{background:rgba(34,211,160,.15);color:var(--ok)}
.sync-bar.syncing{background:rgba(110,86,248,.15);color:var(--brand2)}
.sync-bar.error{background:rgba(244,63,94,.15);color:var(--danger)}

#toast{position:fixed;bottom:calc(90px + 12px);left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--s2);border:1px solid var(--b2);border-radius:12px;
  padding:10px 18px;font-size:13px;font-weight:600;color:var(--ink);
  box-shadow:var(--sh);opacity:0;transition:all .25s;z-index:70;
  white-space:nowrap;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

#auth-screen{position:fixed;inset:0;background:var(--s0);z-index:100;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:40px 32px}
.auth-logo{width:72px;height:72px;border-radius:22px;background:var(--brandg);
  display:flex;align-items:center;justify-content:center;
  font-size:32px;font-weight:900;color:#fff;margin-bottom:24px;
  box-shadow:0 12px 40px rgba(110,86,248,.4)}
.auth-title{font-size:28px;font-weight:800;text-align:center;margin-bottom:8px}
.auth-sub{font-size:15px;color:var(--ink2);text-align:center;
  margin-bottom:40px;line-height:1.5}
.auth-btn{display:flex;align-items:center;justify-content:center;gap:12px;
  background:var(--s2);border:1px solid var(--b2);border-radius:var(--r);
  padding:16px;width:100%;cursor:pointer;font-size:16px;font-weight:600;
  color:var(--ink);margin-bottom:12px;transition:background .15s;font-family:inherit}
.auth-btn:active{background:var(--s3)}
.auth-skip{color:var(--ink2);font-size:14px;cursor:pointer;margin-top:8px;
  background:none;border:none;text-decoration:underline;font-family:inherit}
</style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-logo">M</div>
  <div class="auth-title">MBM Life</div>
  <div class="auth-sub">Your world, connected.<br>Tasks, people, time — all in one place.</div>

    <span>G</span> Continue with Google
  </button>

</div>

<div id="sync-badge"><div id="sync-bar" style="display:none" class="sync-bar"></div></div>

<div id="app" style="display:none">
  <div id="screen"></div>
  <nav id="nav">
    <button class="nv on" data-s="today"><span class="nv-ic">☀</span><span class="nv-lb">Today</span></button>
    <button class="nv" data-s="lists"><span class="nv-ic">≡</span><span class="nv-lb">Lists</span></button>

<!-- Task Detail Panel -->

  <div class="td-topbar">

  </div>
  <div class="td-body" id="td-body"></div>
</div>

<!-- Search Screen -->
<div id="search-screen">
  <div class="srch-top">
    <div class="srch-input-wrap">
      <span class="srch-ic">🔍</span>
      <input id="srch-input" placeholder="Search tasks and lists" autocomplete="off">
    </div>
    <button class="srch-cancel" id="srch-cancel">Cancel</button>
  </div>
  <div class="srch-results" id="srch-results">
    <div class="srch-hint">Search tasks, lists, and notes</div>
  </div>

<div id="sheet-bg"></div>
<div id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-body" id="sheet-body"></div>
</div>
<div id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════
   MBM LIFE v60 — Platform Edition
   Entity-graph architecture. Firebase-ready schema.
   ═══════════════════════════════════════════════════════════ */

const APP_VERSION='v68';
const SCHEMA=1;
const KEY='mbmlife_platform_v1';

/* ── Entity Schema ──────────────────────────────────────────
   All entities share: id, createdAt, updatedAt, archivedAt(null)
   Relationships stored as id references.
   ─────────────────────────────────────────────────────────── */
function blankDB(){
  return {
    schema:SCHEMA,
    meta:{theme:'dark',lang:'en',userId:null,displayName:null,email:null},
    entities:{
      tasks:{},     // {id,text,listId,dueDate,dueTime,priority,repeat,
                    //  assigneeId,creatorId,status,pinned,done,doneAt,
                    //  placeId,expenseId,noteIds[],tags[],
                    //  createdAt,updatedAt,archivedAt}
      lists:{},     // {id,name,icon,color,sortBy,shared,memberIds[],
                    //  createdAt,updatedAt,archivedAt}
      people:{},    // {id,name,avatar,email,phone,role,
                    //  taskIds[],noteIds[],
                    //  createdAt,updatedAt,archivedAt}
      events:{},    // {id,title,date,time,duration,placeId,personIds[],taskIds[],
                    //  createdAt,updatedAt,archivedAt}
      expenses:{},  // {id,amount,currency,label,taskId,personId,eventId,
                    //  createdAt,updatedAt,archivedAt}
      notes:{},     // {id,text,taskId,personId,eventId,
                    //  createdAt,updatedAt,archivedAt}
      places:{},    // {id,name,address,lat,lng,taskIds[],
                    //  createdAt,updatedAt,archivedAt}
    }
  };
}

/* ── Seed: default inbox list ── */
function seedDB(db){
  const now=new Date().toISOString();
  db.entities.lists['inbox']={
    id:'inbox',name:{en:'Tasks',fa:'کارها'},icon:'✓',color:'#6e56f8',
    sortBy:'smart',shared:false,memberIds:[],
    createdAt:now,updatedAt:now,archivedAt:null
  };
  return db;
}

/* ── Persistence ── */
function loadDB(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw)return seedDB(blankDB());
    const d=JSON.parse(raw);
    if(!d||!d.entities)return seedDB(blankDB());
    // ensure all entity collections exist
    ['tasks','lists','people','events','expenses','notes','places']
      .forEach(e=>{if(!d.entities[e])d.entities[e]={};});
    if(!Object.keys(d.entities.lists).length)seedDB(d);
    return d;
  }catch(e){return seedDB(blankDB());}
}
function saveDB(){
  DB.meta._savedAt=new Date().toISOString();
  try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}
  if(typeof syncPush==='function')syncPush();
}

let DB=loadDB();

/* ── Helpers ── */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function now(){return new Date().toISOString();}
function todayStr(){return new Date().toISOString().slice(0,10);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function shortDate(d){
  if(!d)return '';
  const t=todayStr();
  if(d===t)return L==='fa'?'امروز':'Today';
  const dt=new Date(d),now2=new Date();
  const diff=Math.round((dt-now2)/86400000);
  if(diff===-1)return L==='fa'?'دیروز':'Yesterday';
  if(diff===1)return L==='fa'?'فردا':'Tomorrow';
  return dt.toLocaleDateString(L==='fa'?'fa-IR':'en-US',{month:'short',day:'numeric'});
}
function priClass(p){return p==='p1'?'p1':p==='p2'?'p2':'p3';}

/* ── Active entity queries ── */
function active(type){
  return Object.values(DB.entities[type]||{}).filter(e=>!e.archivedAt);
}
function activeTasks(){return active('tasks');}
function activeTasksForList(listId){return activeTasks().filter(t=>t.listId===listId);}
function smartSortTasks(tasks){
  return [...tasks].sort((a,b)=>{
    // pinned first
    if(a.pinned!==b.pinned)return a.pinned?-1:1;
    // overdue before future
    const ts=todayStr();
    const ao=a.dueDate&&a.dueDate<ts&&!a.done;
    const bo=b.dueDate&&b.dueDate<ts&&!b.done;
    if(ao!==bo)return ao?-1:1;
    // by due date
    if(a.dueDate&&b.dueDate)return a.dueDate<b.dueDate?-1:1;
    if(a.dueDate)return -1;if(b.dueDate)return 1;
    // priority
    const po={p1:0,p2:1,p3:2};
    return (po[a.priority]||1)-(po[b.priority]||1);
  });
}

/* ── Language ── */
let L=DB.meta.lang||'en';
const I18N={
  en:{today:'Today',lists:'Lists',calendar:'Calendar',people:'People',more:'More',
    noTasks:'Nothing here yet.',addTask:'Add a task',tasks:'Tasks',important:'Important',
    planned:'Planned',allTasks:'All Tasks',myday:'My Day',
    done:'Completed',overdue:'Overdue',
    newList:'New List',listName:'List name',cancel:'Cancel',save:'Save',
    rename:'Rename list',delete:'Delete list',sortBy:'Sort by',
    changeTheme:'Change theme',share:'Share / Send a copy',duplicate:'Duplicate list',
    print:'Print list',suggestions:'Suggestions',reorder:'Reorder tasks',
    high:'High',medium:'Medium',low:'Low',
    search:'Search',noResults:'No results.',
    signOut:'Sign out',settings:'Settings',about:'About',
    version:'Version',language:'Language',theme:'Theme',
    offline:'Offline',synced:'Synced',syncing:'Syncing…'},
  fa:{today:'امروز',lists:'لیست‌ها',calendar:'تقویم',people:'افراد',more:'بیشتر',
    noTasks:'هنوز چیزی نیست.',addTask:'کار جدید',tasks:'کارها',important:'مهم',
    planned:'برنامه‌ریزی شده',allTasks:'همه کارها',myday:'روز من',
    done:'انجام شده',overdue:'عقب‌افتاده',
    newList:'لیست جدید',listName:'نام لیست',cancel:'انصراف',save:'ذخیره',
    rename:'تغییر نام',delete:'حذف لیست',sortBy:'مرتب‌سازی',
    changeTheme:'تغییر رنگ',share:'اشتراک‌گذاری',duplicate:'کپی لیست',
    print:'چاپ لیست',suggestions:'پیشنهادات',reorder:'مرتب کردن',
    high:'بالا',medium:'متوسط',low:'پایین',
    search:'جستجو',noResults:'نتیجه‌ای نیست.',
    signOut:'خروج',settings:'تنظیمات',about:'درباره',
    version:'نسخه',language:'زبان',theme:'رنگ‌بندی',
    offline:'آفلاین',synced:'همگام‌سازی شد',syncing:'در حال همگام‌سازی…'},
};
function tr(k){return (I18N[L]||I18N.en)[k]||k;}

/* ── State ── */
let screen='today';
let tasksView='browser'; // 'browser'|'detail'
let activeListId=null;
let activeSmartView=null; // 'myday'|'important'|'planned'|'all'
let searchQuery='';

/* ── Render engine ── */
function render(){
  applyTheme();
  applyLang();
  document.querySelectorAll('.nv').forEach(b=>b.classList.toggle('on',b.dataset.s===screen));
  const el=document.getElementById('screen');
  if(screen==='today')el.innerHTML=renderToday();
  else if(screen==='lists')el.innerHTML=renderLists();
  else if(screen==='search'){openSearch();screen='today';el.innerHTML=renderToday();}
  else if(screen==='more')el.innerHTML=renderMore();
  bindScreen();
}

function applyTheme(){
  document.body.classList.toggle('dark',DB.meta.theme!=='light');
}
function applyLang(){
  L=DB.meta.lang||'en';
  document.body.classList.toggle('rtl',L==='fa');
  document.documentElement.lang=L;
  document.querySelectorAll('.nv').forEach(b=>{
    const k=b.dataset.s;
    const lb=b.querySelector('.nv-lb');
    if(!lb)return;
    if(k==='search')lb.textContent=tr('search');
    else lb.textContent=tr(k)||k;
  });
}

/* ══════════════════════════════════════════
   TODAY SCREEN
   ══════════════════════════════════════════ */
function renderToday(){
  const ts=todayStr();
  const allT=activeTasks();
  const overdue=allT.filter(t=>!t.done&&t.dueDate&&t.dueDate<ts);
  const todayT=allT.filter(t=>!t.done&&(t.dueDate===ts||!t.dueDate));
  const doneToday=allT.filter(t=>t.done&&t.doneAt&&t.doneAt.slice(0,10)===ts);
  const upcoming=allT.filter(t=>!t.done&&t.dueDate&&t.dueDate>ts).slice(0,3);

  const dayName=new Date().toLocaleDateString(L==='fa'?'fa-IR':'en-US',{weekday:'long'});
  const dateStr=new Date().toLocaleDateString(L==='fa'?'fa-IR':'en-US',{month:'long',day:'numeric'});

  let html=`<div class="today-head">
    <div class="today-date">${dayName}, ${dateStr}</div>
    <div class="today-title">${tr('today')}</div>
    ${overdue.length?`<div class="today-overdue-pill">⚠ ${overdue.length} ${tr('overdue')}</div>`:''}
  </div>`;

  // Overdue — first, no label, red checkbox tint
  if(overdue.length){
    html+=`<div style="background:var(--s1);border-top:1px solid var(--b1)">
      ${smartSortTasks(overdue).map(t=>taskRowFlat(t,true)).join('')}
    </div>`;
  }

  // Today's tasks — main focus
  const focusTasks=todayT.filter(t=>!overdue.includes(t));
  if(focusTasks.length){
    if(overdue.length)html+=`<div class="ts-label">${L==='fa'?'امروز':'Today'}</div>`;
    html+=`<div style="background:var(--s1);border-top:1px solid var(--b1)">
      ${smartSortTasks(focusTasks).map(t=>taskRowFlat(t)).join('')}
    </div>`;
  }

  // Done today — collapsed by default
  if(doneToday.length){
    html+=`<div class="done-toggle" id="done-toggle" style="padding-left:20px">
      <span class="done-toggle-arrow${doneCollapsed?'':' open'}">›</span>
      ${tr('done')} (${doneToday.length})
    </div>
    ${doneCollapsed?'':
      `<div style="background:var(--s1);border-top:1px solid var(--b1)">
        ${doneToday.map(t=>taskRowFlat(t)).join('')}
      </div>`}`;
  }

  // Upcoming — minimal, just 3
  if(upcoming.length){
    html+=`<div class="ts-label">${L==='fa'?'آینده نزدیک':'Coming up'}</div>
    <div style="background:var(--s1);border-top:1px solid var(--b1);opacity:.75">
      ${smartSortTasks(upcoming).map(t=>taskRowFlat(t)).join('')}
    </div>`;
  }

  if(!overdue.length&&!focusTasks.length&&!doneToday.length){
    html+=`<div class="empty" style="padding-top:60px">
      <div class="empty-ic" style="font-size:32px">✓</div>
      <div class="empty-tx">${L==='fa'?'همه چیز انجام شده!':'All clear for today!'}</div>
    </div>`;
  }

  // Inline add at bottom of today
  html+=`<div class="inline-add" style="margin-top:12px;border-radius:14px;margin:12px 16px 0;border:1px solid var(--b1)">
    <div class="inline-add-chk"><div class="inline-add-dot"></div></div>
    <input id="today-add-input" placeholder="${tr('addTask')}" autocomplete="off">
  </div>`;

  return html;
}
/* ══════════════════════════════════════════
   LISTS SCREEN
   ══════════════════════════════════════════ */
function renderLists(){
  if(tasksView==='detail')return renderListDetail();

  const ts=todayStr();
  const allT=activeTasks();
  const lists=active('lists');
  const user=DB.meta;

  const svCounts={
    myday:allT.filter(t=>!t.done&&t.dueDate===ts).length,
    important:allT.filter(t=>!t.done&&t.pinned).length,
    planned:allT.filter(t=>!t.done&&t.dueDate&&t.dueDate>ts).length,
    all:allT.filter(t=>!t.done).length,
  };

  const svDef=[
    {sv:'myday',icon:'☀',color:'#f59e0b',name:tr('myday')},
    {sv:'important',icon:'★',color:'#f43f5e',name:tr('important')},
    {sv:'planned',icon:'◫',color:'#38bdf8',name:tr('planned')},
    {sv:'all',icon:'≡',color:'#6e56f8',name:tr('allTasks')},
  ];

  let html=`
    <div class="lists-hub-header">
      <div class="lists-hub-avatar">${(user.displayName||'?').slice(0,1).toUpperCase()}</div>
      <div style="flex:1">
        <div class="lists-hub-name">${esc(user.displayName||'My Lists')}</div>
        <div style="font-size:12px;color:var(--ink3);margin-top:1px">${esc(user.email||'')}</div>
      </div>
      <button class="lists-hub-search" id="btn-hub-search">🔍</button>
    </div>

    <div style="margin-bottom:4px">
      ${svDef.map(s=>`
        <div class="sv-row" data-sv="${s.sv}">
          <div class="sv-icon">
            <div class="sv-icon-inner" style="background:${s.color}18;color:${s.color}">${s.icon}</div>
          </div>
          <span class="sv-name">${esc(s.name)}</span>
          ${svCounts[s.sv]?`<span class="sv-count">${svCounts[s.sv]}</span>`:''}
        </div>`).join('')}
    </div>

    <div class="hub-sep"></div>
    <div class="hub-sec-label">${L==='fa'?'لیست‌های من':'My Lists'}</div>`;

  if(lists.length){
    html+=`<div style="margin-bottom:4px">
      ${lists.map(l=>{
        const count=allT.filter(t=>t.listId===l.id&&!t.done).length;
        return `<div class="ul-row" data-listid="${l.id}">
          <div class="ul-icon">
            <div class="ul-icon-inner" style="background:${l.color||'#6e56f8'}">${l.icon||'✓'}</div>
          </div>
          <span class="ul-name">${esc(l.name&&(l.name[L]||l.name.en)||l.id)}</span>
          ${count?`<span class="ul-count">${count}</span>`:''}
        </div>`;
      }).join('')}
    </div>`;
  }

  html+=`
    <div class="hub-sep"></div>
    <div class="lists-footer" id="btn-new-list">
      <div class="lf-icon"><div class="lf-plus">＋</div></div>
      <span class="lf-label">${tr('newList')}</span>
    </div>`;

  return html;
}

/* collapsed state for done section in list detail */
let doneCollapsed=true;

/* gradient bg per list */
function listBgGradient(color){
  return `linear-gradient(160deg,${color}ee 0%,${color}88 55%,${color}33 100%)`;
}

function renderListDetail(){
  const ts=todayStr();
  let title='',accentColor='#6e56f8',tasks=activeTasks(),bgGradient=null;

  if(activeSmartView){
    const svMap={myday:tr('myday'),important:tr('important'),planned:tr('planned'),all:tr('allTasks')};
    const svColors={myday:'#f59e0b',important:'#f43f5e',planned:'#38bdf8',all:'#6e56f8'};
    title=svMap[activeSmartView]||'';
    accentColor=svColors[activeSmartView]||'#6e56f8';
    bgGradient=listBgGradient(accentColor);
    if(activeSmartView==='myday')tasks=tasks.filter(t=>t.dueDate===ts);
    else if(activeSmartView==='important')tasks=tasks.filter(t=>t.pinned);
    else if(activeSmartView==='planned')tasks=tasks.filter(t=>t.dueDate&&t.dueDate>ts);
  } else if(activeListId){
    const l=(DB.entities.lists||{})[activeListId];
    title=l?(l.name&&(l.name[L]||l.name.en)||'List'):'List';
    accentColor=l&&l.color||'#6e56f8';
    bgGradient=listBgGradient(accentColor);
    tasks=tasks.filter(t=>t.listId===activeListId);
  }

  tasks=smartSortTasks(tasks);
  const openT=tasks.filter(t=>!t.done),doneT=tasks.filter(t=>t.done);
  const openCount=openT.length,doneCount=doneT.length;

  return `
    <div class="ld-bg">
      <div class="ld-bg-layer" style="background:${bgGradient||'var(--s2)'}"></div>
      <div class="ld-topbar">
        <button class="ld-back" id="list-back">&#8249;</button>
        <div class="ld-actions">
          ${activeListId?'<button class="ld-action-btn" id="list-menu-btn" aria-label="List options">&#8943;</button>':''}
        </div>
      </div>
      <div class="ld-title-area">
        <div class="ld-title">${esc(title)}</div>
        <div class="ld-subtitle">${openCount} ${L==='fa'?'باقی‌مانده':'remaining'}</div>
      </div>
    </div>
    <div style="background:var(--s1);overflow:hidden;border-top:1px solid var(--b1)" id="task-list-body">
      ${openT.length
        ? openT.map(t=>taskRowFlat(t)).join('')
        : '<div class="done-toggle" style="color:var(--ink3);cursor:default;font-weight:400;background:var(--s1)">'+tr('noTasks')+'</div>'}
      ${doneCount?`
        <div class="done-toggle" id="done-toggle">
          <span class="done-toggle-arrow${doneCollapsed?'':' open'}">&#8250;</span>
          ${tr('done')} (${doneCount})
        </div>
        ${doneCollapsed?'':doneT.map(t=>taskRowFlat(t)).join('')}
      `:''}
    </div>
    ${activeListId?`
    <div class="inline-add">
      <div class="inline-add-chk"><div class="inline-add-dot"></div></div>
      <input id="inline-add-input" placeholder="${tr('addTask')}" autocomplete="off">
    </div>`:''}`;
}
function taskRowFlat(t,isOverdue){
  const ts=todayStr();
  const over=t.dueDate&&t.dueDate<ts&&!t.done;
  const pr=t.priority==='p1'?`<span class="pill p1">${tr('high')}</span>`:'';
  let meta='';
  // In smart views or Today, show list name for context
  if(activeSmartView||screen==='today'){
    const l=(DB.entities.lists||{})[t.listId];
    if(l)meta+=`<span class="chip">${esc(l.name&&(l.name[L]||l.name.en)||'')}</span>`;
  }
  if(t.dueDate&&!over)meta+=`<span class="chip">${shortDate(t.dueDate)}${t.dueTime?' · '+t.dueTime:''}</span>`;
  if(over)meta+=`<span class="chip over">⚠ ${shortDate(t.dueDate)}</span>`;
  // overdue row: subtle left border
  const overStyle=isOverdue?'border-left:2px solid var(--danger);':'';
  return `<div class="trow-flat ${t.done?'done':''}" data-tid="${t.id}" style="${overStyle}">
    <div class="trow-chk-wrap">
      <div class="chk ${t.done?'on':''}" data-chk="${t.id}"></div>
    </div>
    <div class="trow-content">
      <div class="trow-title">${esc(t.text)}</div>
      ${meta||pr?`<div class="trow-meta-row">${meta}${pr}</div>`:''}
    </div>
    <div class="trow-star-wrap">
      <button class="star ${t.pinned?'on':''}" data-pin="${t.id}">★</button>
    </div>
  </div>`;
}

function _sacRow(svgKey,label,action,opts={}){
  const icon=_SVG[svgKey]||_SVG.suggest;
  const right=opts.value?`<span style="font-size:13px;color:var(--ink3)">${opts.value}</span><span class="sac-arr"> ›</span>`:'';
  return `<button class="sac${opts.danger?' sac-danger':''}" data-lma="${action}">
    <div class="sac-icon-wrap"><div class="sac-icon">${icon}</div></div>
    <span class="sac-label">${label}</span>
    ${right?`<div class="sac-right">${right}</div>`:''}
  </button>`;
}

function openListMenu(listId){
  const l=(DB.entities.lists||{})[listId];if(!l)return;
  const name=l.name&&(l.name[L]||l.name.en)||listId;
  const curSort=l.sortBy||'smart';
  const sortLabels={smart:L==='fa'?'هوشمند':'Smart',alpha:'A–Z',date:L==='fa'?'تاریخ':'Due date',priority:L==='fa'?'اولویت':'Priority'};
  const sugOn=l.suggestions!==false;
  openSheet(`<div style="padding:8px 0 0">
    ${_sacRow('rename',L==='fa'?'تغییر نام':'Rename list','rename')}
    ${_sacRow('sort',L==='fa'?'مرتب‌سازی':'Sort by','sort',{value:sortLabels[curSort]||curSort})}
    ${_sacRow('reorder',L==='fa'?'مرتب کردن':'Reorder','reorder')}
    ${_sacRow('theme',L==='fa'?'تغییر رنگ':'Change theme','theme')}
    ${_sacRow('share',L==='fa'?'اشتراک‌گذاری':'Share','share')}
    ${_sacRow('duplicate',L==='fa'?'کپی لیست':'Duplicate','duplicate')}
    ${_sacRow('print',L==='fa'?'چاپ':'Print','print')}
    ${_sacRow('suggest',L==='fa'?'پیشنهادات':'Suggestions','suggestions',{value:sugOn?(L==='fa'?'روشن':'On'):(L==='fa'?'خاموش':'Off')})}
    ${_sacRow('delete',L==='fa'?'حذف لیست':'Delete list','delete',{danger:true})}
  </div>
  <button class="sheet-cancel">${L==='fa'?'انصراف':'Cancel'}</button>`);
  document.querySelector('.sheet-cancel').onclick=closeSheet;
  document.querySelectorAll('[data-lma]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.lma;
    if(a==='sort'){closeSheet();_openSortSheet(listId,curSort,sortLabels);}
    else if(a==='reorder'){l.sortBy='alpha';l.updatedAt=now();saveDB();closeSheet();render();}
    else if(a==='theme'){closeSheet();_openThemeSheet(listId);}
    else if(a==='share'){closeSheet();_shareList(listId);}
    else if(a==='duplicate'){closeSheet();_duplicateList(listId);}
    else if(a==='print'){closeSheet();_printList(listId);}
    else if(a==='suggestions'){l.suggestions=!sugOn;l.updatedAt=now();saveDB();closeSheet();toast(name+': '+(l.suggestions?'On':'Off'));}
    else if(a==='rename'){closeSheet();_openRenameSheet(listId);}
    else if(a==='delete'){closeSheet();_deleteList(listId);}
  });
}

function _openSortSheet(listId,cur,labels){
  const opts=Object.keys(labels);
  openSheet(`<h3>${L==='fa'?'مرتب‌سازی':'Sort by'}</h3>
    <div class="sheet-group">
      ${opts.map(o=>`<button class="sac" data-so="${o}">
        <div class="sac-icon-wrap"><div class="sac-check${o===cur?' on':''}"></div></div>
        <span class="sac-label">${labels[o]}</span>
      </button>`).join('')}
    </div>
    <button class="sheet-cancel">${L==='fa'?'انصراف':'Cancel'}</button>`);
  document.querySelector('.sheet-cancel').onclick=closeSheet;
  document.querySelectorAll('[data-so]').forEach(b=>b.onclick=()=>{
    const l=DB.entities.lists[listId];if(!l)return;
    l.sortBy=b.dataset.so;l.updatedAt=now();saveDB();closeSheet();render();});
}

function _openThemeSheet(listId){
  const l=DB.entities.lists[listId];if(!l)return;
  let selColor=l.color||LIST_COLORS[0];
  openSheet(`<h3>${L==='fa'?'تغییر رنگ':'Change theme'}</h3>
    <div style="display:flex;gap:10px;flex-wrap:wrap;padding:0 0 16px">
      ${LIST_COLORS.map(c=>`<button class="cpick${c===selColor?' on':''}" data-tc="${c}" style="background:${c};color:${c}"></button>`).join('')}
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="th-cancel">${L==='fa'?'انصراف':'Cancel'}</button>
      <button class="btn btn-primary" id="th-save">${L==='fa'?'ذخیره':'Save'}</button>
    </div>`);
  document.getElementById('th-cancel').onclick=closeSheet;
  document.querySelectorAll('[data-tc]').forEach(el=>el.onclick=()=>{
    selColor=el.dataset.tc;document.querySelectorAll('[data-tc]').forEach(e=>e.classList.toggle('on',e.dataset.tc===selColor));});
  document.getElementById('th-save').onclick=()=>{l.color=selColor;l.updatedAt=now();saveDB();closeSheet();render();};
}

function _openRenameSheet(listId){
  const l=DB.entities.lists[listId];if(!l)return;
  const name=l.name&&(l.name[L]||l.name.en)||'';
  openSheet(`<h3>${L==='fa'?'تغییر نام':'Rename'}</h3>
    <div class="fld"><input class="finput" id="rn-name" value="${esc(name)}"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="rn-cancel">${L==='fa'?'انصراف':'Cancel'}</button>
      <button class="btn btn-primary" id="rn-save">${L==='fa'?'ذخیره':'Save'}</button>
    </div>`);
  document.getElementById('rn-cancel').onclick=closeSheet;
  document.getElementById('rn-save').onclick=()=>{
    const v=document.getElementById('rn-name').value.trim();if(!v)return;
    l.name={en:v,fa:v};l.updatedAt=now();saveDB();closeSheet();render();};
  setTimeout(()=>{const n=document.getElementById('rn-name');if(n){n.focus();n.select();}},100);
}

function _shareList(listId){
  const l=DB.entities.lists[listId];if(!l)return;
  const name=l.name&&(l.name[L]||l.name.en)||'';
  const tasks=activeTasks().filter(t=>t.listId===listId);
  const text=name+'\n\n'+tasks.map(t=>(t.done?'☑ ':'☐ ')+t.text+(t.dueDate?' ('+t.dueDate+')':'')).join('\n');
  if(navigator.share)navigator.share({title:name,text}).catch(()=>{});
  else navigator.clipboard&&navigator.clipboard.writeText(text).then(()=>toast(L==='fa'?'کپی شد':'Copied')).catch(()=>{});
}

function _duplicateList(listId){
  const l=DB.entities.lists[listId];if(!l)return;
  const name=l.name&&(l.name[L]||l.name.en)||'';
  const newId=uid();
  DB.entities.lists[newId]=Object.assign({},l,{id:newId,name:{en:name+' (copy)',fa:name+' (کپی)'},createdAt:now(),updatedAt:now()});
  activeTasks().filter(t=>t.listId===listId).forEach(t=>{
    const nid=uid();DB.entities.tasks[nid]=Object.assign({},t,{id:nid,listId:newId,done:false,doneAt:null,createdAt:now(),updatedAt:now()});});
  saveDB();render();toast(L==='fa'?'لیست کپی شد':'Duplicated');
}

function _printList(listId){
  const l=DB.entities.lists[listId];if(!l)return;
  const name=l.name&&(l.name[L]||l.name.en)||'';
  const tasks=activeTasks().filter(t=>t.listId===listId);
  const open=tasks.filter(t=>!t.done),done=tasks.filter(t=>t.done);
  const w=window.open('','_blank');if(!w)return;
  w.document.write(`<!DOCTYPE html><html><head><title>${name}</title>
    <style>body{font-family:sans-serif;max-width:600px;margin:48px auto;font-size:15px}
    h1{font-size:22px;margin-bottom:16px}ul{list-style:none;padding:0}
    li{padding:8px 0;border-bottom:1px solid #eee}
    li.done{text-decoration:line-through;color:#999}</style></head><body>
    <h1>${name}</h1><ul>${open.map(t=>`<li>${t.text}</li>`).join('')}</ul>
    ${done.length?`<h3>Completed</h3><ul>${done.map(t=>`<li class="done">${t.text}</li>`).join('')}</ul>`:''}</body></html>`);
  w.document.close();w.print();
}

function _deleteList(listId){
  const l=DB.entities.lists[listId];if(!l)return;
  const name=l.name&&(l.name[L]||l.name.en)||'';
  openSheet(`<h3 style="color:var(--danger)">${L==='fa'?'حذف لیست':'Delete List'}</h3>
    <p style="color:var(--ink2);font-size:14px;padding-bottom:16px">${L==='fa'?`لیست «${esc(name)}» حذف شود؟`:`Delete "${esc(name)}"?`}</p>
    <div class="btn-row">
      <button class="btn btn-ghost" id="del-cancel">${L==='fa'?'انصراف':'Cancel'}</button>
      <button class="btn btn-danger" id="del-confirm">${L==='fa'?'حذف':'Delete'}</button>
    </div>`);
  document.getElementById('del-cancel').onclick=closeSheet;
  document.getElementById('del-confirm').onclick=()=>{
    for(const id in DB.entities.tasks){if(DB.entities.tasks[id].listId===listId)DB.entities.tasks[id].archivedAt=now();}
    l.archivedAt=now();l.updatedAt=now();
    saveDB();closeSheet();tasksView='browser';activeListId=null;render();
    toast(L==='fa'?'لیست حذف شد':'Deleted');};
}

/* ══════════════════════════════════════════
   TASK DETAIL PANEL
   ══════════════════════════════════════════ */
let _tdId=null;

function openTaskDetail(id){
  const t=DB.entities.tasks[id];if(!t)return;
  _tdId=id;_renderTaskDetail();
  document.getElementById('task-detail').classList.add('on');
}

function closeTaskDetail(){
  document.getElementById('task-detail').classList.remove('on');
  _tdId=null;
}

function _renderTaskDetail(){
  const t=DB.entities.tasks[_tdId];if(!t)return;
  const lists=active('lists');
  const ts=todayStr();
  const inMyDay=t.dueDate===ts;
  const listObj=lists.find(l=>l.id===t.listId);
  const listName=listObj?(listObj.name&&(listObj.name[L]||listObj.name.en)||''):'';
  const steps=t.steps||[];
  const repeatLabels={none:L==='fa'?'هرگز':'Never',daily:L==='fa'?'روزانه':'Daily',
    weekly:L==='fa'?'هفتگی':'Weekly',monthly:L==='fa'?'ماهانه':'Monthly',yearly:L==='fa'?'سالانه':'Yearly'};

  const body=document.getElementById('td-body');
  body.innerHTML=`
    <div class="td-title-wrap">
      <div class="td-chk${t.done?' on':''}" id="td-chk"></div>
      <textarea class="td-title-input${t.done?' done':''}" id="td-title" rows="2">${esc(t.text)}</textarea>
    </div>
    <div class="td-section">
      ${steps.map((s,i)=>`<div class="td-step${s.done?' done':''}">
        <div class="td-step-chk"><div class="td-step-chk-box${s.done?' on':''}" data-si="${i}"></div></div>
        <span class="td-step-text" contenteditable="true" data-step-text="${i}">${esc(s.text)}</span>
        <button class="td-step-del" data-step-del="${i}">×</button>
      </div>`).join('')}
      <div class="td-row" id="td-add-step">
        <div class="td-row-ic">＋</div>
        <div class="td-row-body"><div class="td-row-label">${L==='fa'?'افزودن قدم':'Add step'}</div></div>
      </div>
    </div>
    <div class="td-section">
      <div class="td-row${inMyDay?' td-row-active':''}" id="td-myday">
        <div class="td-row-ic">☀</div>
        <div class="td-row-body"><div class="${inMyDay?'td-row-value':'td-row-label'}">${inMyDay?(L==='fa'?'در روز من':'In My Day'):(L==='fa'?'افزودن به روز من':'Add to My Day')}</div></div>
      </div>
      <div class="td-row" id="td-duedate">
        <div class="td-row-ic">📅</div>
        <div class="td-row-body">${t.dueDate?`<div class="td-row-value${t.dueDate<ts&&!t.done?' td-row-over':''}">${shortDate(t.dueDate)}${t.dueTime?' · '+t.dueTime:''}</div>`:`<div class="td-row-label">${L==='fa'?'سررسید':'Due date'}</div>`}</div>
        ${t.dueDate?`<button style="background:none;border:none;color:var(--ink3);font-size:18px;cursor:pointer;padding:8px" id="td-clear-date">×</button>`:''}
      </div>
      <div class="td-row" id="td-repeat">
        <div class="td-row-ic">🔁</div>
        <div class="td-row-body">${t.repeat&&t.repeat!=='none'?`<div class="td-row-value">${repeatLabels[t.repeat]||t.repeat}</div>`:`<div class="td-row-label">${L==='fa'?'تکرار':'Repeat'}</div>`}</div>
        <span class="td-row-arr">›</span>
      </div>
    </div>
    <div class="td-section">
      <div class="td-row" id="td-list">
        <div class="td-row-ic">≡</div>
        <div class="td-row-body"><div class="td-row-value">${esc(listName)||'Tasks'}</div></div>
        <span class="td-row-arr">›</span>
      </div>
    </div>
    <div class="td-section" style="padding:0 8px">
      <div style="display:flex;align-items:flex-start;padding:0 4px;min-height:52px">
        <div class="td-row-ic" style="padding-top:14px">📝</div>
        <textarea class="td-notes" id="td-notes" placeholder="${L==='fa'?'یادداشت':'Note'}">${esc(t.notes||'')}</textarea>
      </div>
    </div>
    <div class="td-delete" id="td-delete">
      <div class="td-delete-ic">🗑</div>
      <div class="td-delete-tx">${L==='fa'?'حذف کار':'Delete task'}</div>
    </div>`;

  document.getElementById('td-chk').onclick=()=>{t.done=!t.done;t.doneAt=t.done?now():null;t.updatedAt=now();saveDB();_renderTaskDetail();render();};
  const titleEl=document.getElementById('td-title');
  titleEl.oninput=()=>{const v=titleEl.value.trim();if(!v)return;t.text=v;t.updatedAt=now();saveDB();};
  titleEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();titleEl.blur();}});
  document.querySelectorAll('[data-si]').forEach(el=>el.onclick=()=>{
    if(!t.steps)t.steps=[];t.steps[+el.dataset.si].done=!t.steps[+el.dataset.si].done;t.updatedAt=now();saveDB();_renderTaskDetail();});
  document.querySelectorAll('[data-step-del]').forEach(el=>el.onclick=()=>{
    if(!t.steps)return;t.steps.splice(+el.dataset.stepDel,1);t.updatedAt=now();saveDB();_renderTaskDetail();});
  document.querySelectorAll('[data-step-text]').forEach(el=>{
    el.addEventListener('blur',()=>{const v=el.textContent.trim();if(!v||!t.steps)return;t.steps[+el.dataset.stepText].text=v;t.updatedAt=now();saveDB();});});
  document.getElementById('td-add-step').onclick=()=>{
    openSheet(`<h3>${L==='fa'?'قدم جدید':'New Step'}</h3>
      <div class="fld"><input class="finput" id="step-input" placeholder="${L==='fa'?'عنوان':'Title'}"></div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="step-cancel">${L==='fa'?'انصراف':'Cancel'}</button>
        <button class="btn btn-primary" id="step-save">${L==='fa'?'ذخیره':'Save'}</button>
      </div>`);
    setTimeout(()=>document.getElementById('step-input')?.focus(),100);
    document.getElementById('step-cancel').onclick=closeSheet;
    document.getElementById('step-save').onclick=()=>{
      const v=document.getElementById('step-input').value.trim();if(!v)return;
      if(!t.steps)t.steps=[];t.steps.push({text:v,done:false});t.updatedAt=now();saveDB();closeSheet();_renderTaskDetail();};
  };
  document.getElementById('td-myday').onclick=()=>{t.dueDate=inMyDay?null:ts;t.updatedAt=now();saveDB();_renderTaskDetail();render();};
  document.getElementById('td-duedate').onclick=()=>{
    openSheet(`<h3>${L==='fa'?'سررسید':'Due date'}</h3>
      <div class="fld"><input class="finput" id="dd-date" type="date" value="${t.dueDate||''}"></div>
      <div class="fld"><input class="finput" id="dd-time" type="time" value="${t.dueTime||''}"></div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="dd-cancel">${L==='fa'?'انصراف':'Cancel'}</button>
        <button class="btn btn-primary" id="dd-save">${L==='fa'?'ذخیره':'Save'}</button>
      </div>`);
    document.getElementById('dd-cancel').onclick=closeSheet;
    document.getElementById('dd-save').onclick=()=>{
      t.dueDate=document.getElementById('dd-date').value||null;t.dueTime=document.getElementById('dd-time').value||null;
      t.updatedAt=now();saveDB();closeSheet();_renderTaskDetail();render();};
  };
  const cdb=document.getElementById('td-clear-date');
  if(cdb)cdb.onclick=e=>{e.stopPropagation();t.dueDate=null;t.dueTime=null;t.updatedAt=now();saveDB();_renderTaskDetail();render();};
  document.getElementById('td-repeat').onclick=()=>{
    const opts=['none','daily','weekly','monthly','yearly'];
    const labels={none:L==='fa'?'هرگز':'Never',daily:L==='fa'?'روزانه':'Daily',weekly:L==='fa'?'هفتگی':'Weekly',monthly:L==='fa'?'ماهانه':'Monthly',yearly:L==='fa'?'سالانه':'Yearly'};
    const cur=t.repeat||'none';
    openSheet(`<h3>${L==='fa'?'تکرار':'Repeat'}</h3>
      <div class="sheet-group">
        ${opts.map(o=>`<button class="sac" data-rp="${o}">
          <div class="sac-icon-wrap"><div class="sac-check${o===cur?' on':''}"></div></div>
          <span class="sac-label">${labels[o]}</span>
        </button>`).join('')}
      </div>
      <button class="sheet-cancel">${L==='fa'?'انصراف':'Cancel'}</button>`);
    document.querySelector('.sheet-cancel').onclick=closeSheet;
    document.querySelectorAll('[data-rp]').forEach(b=>b.onclick=()=>{t.repeat=b.dataset.rp;t.updatedAt=now();saveDB();closeSheet();_renderTaskDetail();});
  };
  document.getElementById('td-list').onclick=()=>{
    openSheet(`<h3>${L==='fa'?'انتقال به لیست':'Move to list'}</h3>
      <div class="sheet-group">
        ${lists.map(l=>`<button class="sac" data-mv="${l.id}">
          <div class="sac-icon-wrap"><div class="sac-icon" style="background:${l.color||'#6e56f8'}22;color:${l.color||'#6e56f8'}">${l.icon||'✓'}</div></div>
          <span class="sac-label">${esc(l.name&&(l.name[L]||l.name.en)||l.id)}</span>
          ${l.id===t.listId?'<div class="sac-right">✓</div>':''}
        </button>`).join('')}
      </div>
      <button class="sheet-cancel">${L==='fa'?'انصراف':'Cancel'}</button>`);
    document.querySelector('.sheet-cancel').onclick=closeSheet;
    document.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{t.listId=b.dataset.mv;t.updatedAt=now();saveDB();closeSheet();_renderTaskDetail();render();});
  };
  const notesEl=document.getElementById('td-notes');
  notesEl.oninput=()=>{t.notes=notesEl.value;t.updatedAt=now();saveDB();};
  document.getElementById('td-delete').onclick=()=>{t.archivedAt=now();t.updatedAt=now();saveDB();closeTaskDetail();render();toast(L==='fa'?'حذف شد':'Deleted');};
}

function openTaskEdit(id){openTaskDetail(id);}

function openSearch(){
  const s=document.getElementById('search-screen');
  s.classList.add('on');
  setTimeout(()=>{const i=document.getElementById('srch-input');if(i){i.focus();i.value='';}},80);
  _renderSearch('');
}
function closeSearch(){
  document.getElementById('search-screen').classList.remove('on');
}
function _renderSearch(q){
  const el=document.getElementById('srch-results');if(!el)return;
  if(!q.trim()){
    el.innerHTML='<div class="srch-hint">Search tasks, lists, and notes</div>';return;}
  const ql=q.toLowerCase();
  const tasks=activeTasks().filter(t=>t.text.toLowerCase().includes(ql)||(t.notes||'').toLowerCase().includes(ql));
  const lists=active('lists').filter(l=>{const n=l.name&&(l.name[L]||l.name.en)||'';return n.toLowerCase().includes(ql);});
  if(!tasks.length&&!lists.length){
    el.innerHTML=`<div class="srch-empty">${tr('noResults')}</div>`;return;}
  const ts=todayStr();
  let html='';
  if(lists.length){
    html+=`<div class="hub-sec-label">${tr('lists')}</div>
    <div style="background:var(--s1);border-radius:var(--r);margin:0 0 8px;overflow:hidden;border:1px solid var(--b1)">
      ${lists.map(l=>`<div class="ul-row" data-srch-list="${l.id}">
        <div class="ul-icon"><div class="ul-icon-inner" style="background:${l.color||'#6e56f8'}">${l.icon||'✓'}</div></div>
        <span class="ul-name">${esc(l.name&&(l.name[L]||l.name.en)||l.id)}</span>
      </div>`).join('')}
    </div>`;}
  if(tasks.length){
    html+=`<div class="hub-sec-label">${tr('tasks')}</div>
    <div style="background:var(--s1);border-radius:var(--r);margin:0 0 8px;overflow:hidden;border:1px solid var(--b1)">
      ${tasks.map(t=>{
        const over=t.dueDate&&t.dueDate<ts&&!t.done;
        const l=active('lists').find(l=>l.id===t.listId);
        return `<div class="trow-flat${t.done?' done':''}" data-srch-tid="${t.id}">
          <div class="trow-chk-wrap">
            <div class="chk${t.done?' on':''}" data-chk="${t.id}"></div>
          </div>
          <div class="trow-content">
            <div class="trow-title">${esc(t.text)}</div>
            <div class="trow-meta-row">
              ${l?`<span class="chip">${l.icon||'✓'} ${esc(l.name&&(l.name[L]||l.name.en)||'')}</span>`:''}
              ${t.dueDate?`<span class="chip${over?' over':''}">${shortDate(t.dueDate)}</span>`:''}
            </div>
          </div>
          <div class="trow-star-wrap">
            <button class="star${t.pinned?' on':''}" data-pin="${t.id}">★</button>
          </div>
        </div>`;}).join('')}
    </div>`;}
  el.innerHTML=html;

  // Bind search results
  el.querySelectorAll('[data-chk]').forEach(e=>e.onclick=ev=>{
    ev.stopPropagation();completeTask(e.dataset.chk);_renderSearch(q);});
  el.querySelectorAll('[data-pin]').forEach(e=>e.onclick=ev=>{
    ev.stopPropagation();const t=DB.entities.tasks[e.dataset.pin];if(!t)return;
    t.pinned=!t.pinned;t.updatedAt=now();saveDB();_renderSearch(q);});
  el.querySelectorAll('[data-srch-tid]').forEach(e=>e.onclick=()=>openTaskDetail(e.dataset.srchTid));
  el.querySelectorAll('[data-srch-list]').forEach(e=>e.onclick=()=>{
    closeSearch();screen='lists';activeListId=e.dataset.srchList;
    activeSmartView=null;tasksView='detail';render();});
}

/* ══════════════════════════════════════════
   SHEET ENGINE
   ══════════════════════════════════════════ */
let _sheetStack=[];

function openSheet(html,opts={}){
  const body=document.getElementById('sheet-body');
  const sheet=document.getElementById('sheet');
  const bg=document.getElementById('sheet-bg');
  // Push current content if stacking
  if(opts.stack&&body.innerHTML){_sheetStack.push(body.innerHTML);}
  body.innerHTML=html;
  // Scroll to top on new content
  sheet.scrollTop=0;
  if(!sheet.classList.contains('on')){
    sheet.classList.add('on');
    bg.classList.add('on');
  }
}

function closeSheet(opts={}){
  if(opts.back&&_sheetStack.length){
    const prev=_sheetStack.pop();
    document.getElementById('sheet-body').innerHTML=prev;
    document.getElementById('sheet').scrollTop=0;
    return;
  }
  _sheetStack=[];
  const sheet=document.getElementById('sheet');
  const bg=document.getElementById('sheet-bg');
  sheet.classList.remove('on');
  bg.classList.remove('on');
  // Clear after animation
  setTimeout(()=>{
    if(!sheet.classList.contains('on'))
      document.getElementById('sheet-body').innerHTML='';
  },350);
}

/* ── Chipsel helpers ── */
function bindChipsel(id,defVal){
  const el=document.getElementById(id);if(!el)return;
  el.querySelectorAll('button').forEach(b=>{
    b.classList.toggle('on',b.dataset.v===defVal);
    b.onclick=()=>{el.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');};
  });
}
function chipVal(id){
  const el=document.getElementById(id);if(!el)return null;
  const on=el.querySelector('button.on');return on?on.dataset.v:null;
}

/* ── Toast ── */
function toast(msg,ms=2200){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('on');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),ms);
}

/* ══════════════════════════════════════════
   CORE TASK ACTIONS
   ══════════════════════════════════════════ */
function createTask(text,listId){
  const id=uid();
  DB.entities.tasks[id]={
    id,text,listId:listId||'inbox',
    dueDate:null,dueTime:null,priority:'p3',repeat:null,
    assigneeId:null,creatorId:DB.meta.userId,
    status:'open',pinned:false,done:false,doneAt:null,
    placeId:null,expenseId:null,noteIds:[],tags:[],steps:[],notes:'',
    createdAt:now(),updatedAt:now(),archivedAt:null
  };
  saveDB();
}

function completeTask(id){
  const t=DB.entities.tasks[id];if(!t)return;
  t.done=!t.done;
  t.doneAt=t.done?now():null;
  t.updatedAt=now();
  saveDB();render();
}

      <input class="finput" id="qa-date" type="date"></div>
    <div class="fld"><label>${L==='fa'?'اولویت':'Priority'}</label>
      <div class="chipsel" id="qa-pri">
        <button data-v="p1">${tr('high')}</button>
        <button data-v="p2">${tr('medium')}</button>
        <button data-v="p3" class="on">${tr('low')}</button>
      </div></div>
    <div class="fld"><label>${L==='fa'?'لیست':'List'}</label>
      <div class="chipsel" id="qa-list">
        ${lists.map(l=>`<button data-v="${l.id}" ${l.id===defList?'class="on"':''}>${esc(l.name&&(l.name[L]||l.name.en)||l.id)}</button>`).join('')}
      </div></div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="qa-cancel">${tr('cancel')}</button>
      <button class="btn btn-primary" id="qa-save">${tr('save')}</button>
    </div>`);

  bindChipsel('qa-pri','p3');

  setTimeout(()=>document.getElementById('qa-text')?.focus(),100);
  document.getElementById('qa-cancel').onclick=closeSheet;
  document.getElementById('qa-save').onclick=()=>{
    const text=document.getElementById('qa-text').value.trim();if(!text)return;
    const id=uid();
    DB.entities.tasks[id]={
      id,text,
      listId:chipVal('qa-list')||'inbox',
      dueDate:document.getElementById('qa-date').value||null,
      dueTime:null,priority:chipVal('qa-pri')||'p3',repeat:null,
      assigneeId:null,creatorId:DB.meta.userId,
      status:'open',pinned:false,done:false,doneAt:null,
      placeId:null,expenseId:null,noteIds:[],tags:[],steps:[],notes:'',
      createdAt:now(),updatedAt:now(),archivedAt:null
    };
    saveDB();closeSheet();render();toast(L==='fa'?'کار اضافه شد':'Task added');
  };
}

/* ══════════════════════════════════════════
   BIND SCREEN EVENTS
   ══════════════════════════════════════════ */
function bindScreen(){
  // Checkboxes
  document.querySelectorAll('[data-chk]').forEach(el=>el.onclick=e=>{
    e.stopPropagation();completeTask(el.dataset.chk);});
  // Star/pin
  document.querySelectorAll('[data-pin]').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const t=DB.entities.tasks[el.dataset.pin];if(!t)return;
    t.pinned=!t.pinned;t.updatedAt=now();saveDB();render();});
  // Task row → detail panel
  document.querySelectorAll('.trow-flat').forEach(el=>el.onclick=()=>{
    if(el.dataset.tid)openTaskDetail(el.dataset.tid);});
  // List rows (hub)
  document.querySelectorAll('[data-listid]').forEach(el=>el.onclick=()=>{
    activeListId=el.dataset.listid;activeSmartView=null;tasksView='detail';render();});
  // Smart view rows
  document.querySelectorAll('[data-sv]').forEach(el=>el.onclick=()=>{
    activeSmartView=el.dataset.sv;activeListId=null;tasksView='detail';render();});
  // Counter nav
  document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>{
    const[sc,sv]=el.dataset.go.split(':');
    if(sc==='lists'){screen='lists';activeSmartView=sv;activeListId=null;tasksView='detail';}
    render();});
  // Back button (list detail)
  const back=document.getElementById('list-back');
  if(back)back.onclick=()=>{tasksView='browser';activeListId=null;activeSmartView=null;doneCollapsed=true;render();};
  // List menu
  const lmb=document.getElementById('list-menu-btn');
  if(lmb)lmb.onclick=()=>openListMenu(activeListId);
  // New list
  const nlb=document.getElementById('btn-new-list');
  if(nlb)nlb.onclick=()=>openNewListSheet();
  // Hub search
  const hsb=document.getElementById('btn-hub-search');
  if(hsb)hsb.onclick=()=>openSearch();
  // Done toggle
  const dt=document.getElementById('done-toggle');
  if(dt)dt.onclick=()=>{doneCollapsed=!doneCollapsed;render();};
  // Inline add (list detail)
  const ia=document.getElementById('inline-add-input');
  if(ia)ia.onkeydown=e=>{
    if(e.key==='Enter'&&ia.value.trim()){
      createTask(ia.value.trim(),activeListId);ia.value='';render();}};
  // Inline add (Today)
  const ta=document.getElementById('today-add-input');
  if(ta)ta.onkeydown=e=>{
    if(e.key==='Enter'&&ta.value.trim()){
      createTask(ta.value.trim(),'inbox');ta.value='';render();}};
  // More screen actions
  document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>{
    const a=el.dataset.action;
    if(a==='toggle-lang'){DB.meta.lang=L==='en'?'fa':'en';saveDB();render();}
    else if(a==='toggle-theme'){DB.meta.theme=DB.meta.theme==='dark'?'light':'dark';saveDB();render();}
    else if(a==='sign-out'){DB.meta.userId=null;DB.meta.displayName=null;DB.meta.email=null;saveDB();location.reload();}
  });
}
