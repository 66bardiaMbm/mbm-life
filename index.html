<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MBM Life</title>
<meta name="theme-color" content="#0f0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* ═══════════════════════════════════════════
   MBM LIFE v60 — Platform Edition
   Design System: Obsidian Dark + Indigo
   ═══════════════════════════════════════════ */
:root{
  /* Surface */
  --s0:#0f0f14;      /* page bg */
  --s1:#16161e;      /* card */
  --s2:#1e1e2a;      /* card raised */
  --s3:#26263a;      /* hover/active */
  /* Ink */
  --ink:#f0f0f8;
  --ink2:#a0a0c0;
  --ink3:#606080;
  /* Brand */
  --brand:#6e56f8;
  --brand2:#9d7bff;
  --brandg:linear-gradient(135deg,#6e56f8,#9d7bff);
  /* Semantic */
  --ok:#22d3a0;
  --warn:#f59e0b;
  --danger:#f43f5e;
  --info:#38bdf8;
  /* Border */
  --b1:rgba(255,255,255,.07);
  --b2:rgba(255,255,255,.12);
  /* Shadow */
  --sh:0 8px 32px rgba(0,0,0,.5);
  /* Radius */
  --r:16px;--r2:12px;--r3:8px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--s0);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body.rtl{direction:rtl;font-family:Vazirmatn,Tahoma,system-ui,sans-serif}

/* ── Layout ── */
#app{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto;
  position:relative;overflow:hidden}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:0 0 90px}
#screen::-webkit-scrollbar{display:none}

/* ── Nav Bar ── */
#nav{position:absolute;bottom:0;left:0;right:0;height:82px;
  background:var(--s1);border-top:1px solid var(--b1);
  display:flex;align-items:stretch;padding:0 4px;padding-bottom:env(safe-area-inset-bottom,0)}
.nv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;border:none;background:none;cursor:pointer;color:var(--ink3);
  font-size:10px;font-weight:600;letter-spacing:.3px;padding:8px 4px;
  transition:color .15s}
.nv.on{color:var(--brand)}
.nv-ic{font-size:22px;line-height:1;transition:transform .15s}
.nv.on .nv-ic{transform:scale(1.1)}

/* ── Page Header ── */
.pg-head{padding:20px 20px 8px;display:flex;align-items:center;gap:12px}
.pg-title{font-size:28px;font-weight:800;letter-spacing:-.5px;flex:1}
.pg-sub{font-size:13px;color:var(--ink2);margin-top:2px}
.hbtn{width:40px;height:40px;border-radius:var(--r2);background:var(--s2);
  border:1px solid var(--b1);color:var(--ink);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex:none}

/* ── Cards ── */
.card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);
  padding:16px;margin:0 16px 10px}
.card-flat{background:var(--s1);border-radius:var(--r);margin:0 16px 10px;
  overflow:hidden;border:1px solid var(--b1)}

/* ── Section Label ── */
.sec-label{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
  color:var(--ink3);padding:16px 20px 8px;display:flex;align-items:center;gap:8px}
.sec-label::after{content:'';flex:1;height:1px;background:var(--b1)}

/* ── Row Item ── */
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;
  cursor:pointer;transition:background .1s;border-bottom:1px solid var(--b1)}
.row:last-child{border-bottom:none}
.row:active{background:var(--s3)}
.row-ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-size:18px;flex:none}
.row-body{flex:1;min-width:0}
.row-title{font-size:15px;font-weight:600;line-height:1.3}
.row-sub{font-size:12px;color:var(--ink2);margin-top:2px}
.row-right{color:var(--ink3);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.row-arr{color:var(--ink3);font-size:16px;opacity:.5}

/* ── Checkbox (scoped) ── */
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink3);
  flex:none;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .18s}
.chk.on{background:var(--brand);border-color:var(--brand)}
.chk.on::after{content:'';width:6px;height:10px;border:2.5px solid #fff;
  border-top:none;border-left:none;transform:rotate(42deg) translateY(-1px);display:block}

/* ── Star / Pin ── */
.star{width:36px;height:36px;flex:none;background:none;border:none;
  cursor:pointer;color:var(--ink3);font-size:18px;display:flex;
  align-items:center;justify-content:center;opacity:.5;transition:all .15s}
.star.on{color:#f59e0b;opacity:1}
.star:hover{opacity:1}

/* ── Chips ── */
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--s2);
  border:1px solid var(--b1);border-radius:6px;padding:2px 8px;
  font-size:11px;font-weight:600;color:var(--ink2)}
.chip.over{color:var(--danger);border-color:rgba(244,63,94,.3);background:rgba(244,63,94,.08)}
.chip.ok{color:var(--ok);border-color:rgba(34,211,160,.3);background:rgba(34,211,160,.08)}

/* ── Pill ── */
.pill{font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;flex:none}
.pill.p1{background:rgba(244,63,94,.15);color:var(--danger)}
.pill.p2{background:rgba(245,158,11,.15);color:var(--warn)}
.pill.p3{background:rgba(56,189,248,.15);color:var(--info)}

/* ── Completed section ── */
.done-sec{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  color:var(--ink3);padding:14px 16px 8px;display:flex;align-items:center;gap:8px}
.done-sec::after{content:'';flex:1;height:1px;background:var(--b1)}

/* ── Empty state ── */
.empty{text-align:center;padding:48px 24px;color:var(--ink3)}
.empty-ic{font-size:40px;margin-bottom:12px;opacity:.4}
.empty-tx{font-size:14px;line-height:1.6}

/* ── FAB ── */
#fab{position:fixed;bottom:calc(82px + 16px + env(safe-area-inset-bottom,0));
  right:20px;width:56px;height:56px;border-radius:18px;
  background:var(--brandg);border:none;color:#fff;font-size:26px;
  cursor:pointer;box-shadow:0 8px 24px rgba(110,86,248,.45);
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s,box-shadow .15s;z-index:40}
#fab:active{transform:scale(.93);box-shadow:0 4px 12px rgba(110,86,248,.3)}

/* ── Sheet (bottom drawer) ── */
/* ══════════════════════════════════════════
   PREMIUM SHEET COMPONENT
   ══════════════════════════════════════════ */
#sheet-bg{
  position:fixed;inset:0;background:rgba(0,0,0,0);z-index:50;
  pointer-events:none;transition:background .25s;
  backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px);
  transition:background .25s,backdrop-filter .25s,-webkit-backdrop-filter .25s}
#sheet-bg.on{background:rgba(0,0,0,.55);pointer-events:all;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

#sheet{
  position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;
  background:var(--s1);
  border-radius:28px 28px 0 0;
  border-top:1px solid var(--b2);
  z-index:51;
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(0.22,1,0.36,1);
  max-height:90vh;overflow-y:auto;overflow-x:hidden;
  padding-bottom:env(safe-area-inset-bottom,0);
  will-change:transform}
#sheet.on{transform:translateY(0)}

/* Drag handle */
.sheet-handle{
  width:40px;height:5px;border-radius:3px;
  background:var(--b2);margin:14px auto 0;
  flex-shrink:0}

/* Sheet header */
.sheet-header{
  padding:16px 22px 0;
  position:relative}
.sheet-list-identity{
  display:flex;align-items:center;gap:13px;margin-bottom:4px}
.sheet-list-icon{
  width:42px;height:42px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex:none;transition:transform .2s}
.sheet-list-name{
  font-size:19px;font-weight:800;letter-spacing:-.2px;line-height:1.2}
.sheet-list-meta{
  font-size:12px;color:var(--ink3);font-weight:500;margin-top:1px}

/* Action groups */
.sheet-group{
  margin:14px 14px 0;
  background:var(--s2);
  border-radius:18px;
  overflow:hidden;
  border:1px solid var(--b1)}
.sheet-group+.sheet-group{margin-top:10px}

/* Individual action row */
.sac{
  display:flex;align-items:center;gap:0;
  width:100%;background:none;border:none;
  border-bottom:1px solid var(--b1);
  cursor:pointer;text-align:left;
  padding:0;
  color:var(--ink);
  position:relative;
  overflow:hidden;
  transition:background .12s}
.sac:last-child{border-bottom:none}
.sac:active{background:var(--s3)}

/* Ripple on tap */
.sac::after{
  content:'';position:absolute;inset:0;
  background:rgba(255,255,255,.06);
  opacity:0;transition:opacity .15s}
.sac:active::after{opacity:1}

.sac-icon-wrap{
  width:56px;height:54px;display:flex;
  align-items:center;justify-content:center;flex:none}
.sac-icon{
  width:34px;height:34px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;transition:transform .15s}
.sac:active .sac-icon{transform:scale(.92)}
.sac-label{
  flex:1;font-size:15.5px;font-weight:500;
  letter-spacing:-.1px;padding:16px 0}
.sac-right{
  display:flex;align-items:center;gap:6px;
  padding-right:16px;color:var(--ink3);
  font-size:13px;font-weight:600}
.sac-arr{font-size:16px;opacity:.4}

/* Danger row */
.sac.sac-danger .sac-label{color:var(--danger)}
.sac.sac-danger .sac-icon{background:rgba(244,63,94,.12)}

/* Cancel button */
.sheet-cancel{
  display:block;width:calc(100% - 28px);
  margin:10px 14px 16px;
  background:var(--s2);border:1px solid var(--b1);
  border-radius:16px;padding:16px;
  font-size:16px;font-weight:600;color:var(--ink2);
  cursor:pointer;text-align:center;
  transition:background .12s,color .12s}
.sheet-cancel:active{background:var(--s3);color:var(--ink)}

/* Sub-sheet: sort options */
.sac-check{
  width:22px;height:22px;border-radius:50%;
  border:2px solid var(--b2);flex:none;
  display:flex;align-items:center;justify-content:center;
  margin-right:16px;transition:all .15s}
.sac-check.on{background:var(--brand);border-color:var(--brand)}
.sac-check.on::after{
  content:'';width:5px;height:9px;
  border:2.5px solid #fff;border-top:none;border-left:none;
  transform:rotate(42deg) translateY(-1px);display:block}

/* Sub-sheet: color picker */
.color-picker-grid{
  display:flex;gap:12px;flex-wrap:wrap;
  padding:4px 0 8px}
.cpick{
  width:40px;height:40px;border-radius:50%;
  cursor:pointer;position:relative;
  transition:transform .15s;border:none;flex:none}
.cpick:active{transform:scale(.9)}
.cpick.on::after{
  content:'✓';position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:16px;font-weight:800}
.cpick.on{box-shadow:0 0 0 3px var(--s1),0 0 0 5px currentColor}

/* Sheet body padding */
.sheet-body{padding:0 0 4px}

/* ── Form fields ── */
.fld{margin-bottom:14px}
.fld label{display:block;font-size:11px;font-weight:700;letter-spacing:.4px;
  text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.finput{width:100%;background:var(--s2);border:1px solid var(--b1);
  border-radius:var(--r2);padding:13px 14px;color:var(--ink);font-size:15px;
  outline:none;transition:border-color .15s}
.finput:focus{border-color:var(--brand)}
.finput::placeholder{color:var(--ink3)}
textarea.finput{resize:vertical;min-height:80px;font-family:inherit}

/* ── Chipsel ── */
.chipsel{display:flex;gap:6px;flex-wrap:wrap}
.chipsel button{background:var(--s2);border:1px solid var(--b1);border-radius:8px;
  padding:7px 13px;color:var(--ink2);font-size:13px;font-weight:600;cursor:pointer}
.chipsel button.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* ── Action buttons ── */
.btn{border:none;border-radius:var(--r2);padding:14px;font-size:15px;
  font-weight:700;cursor:pointer;width:100%;transition:opacity .15s}
.btn:active{opacity:.8}
.btn-primary{background:var(--brandg);color:#fff}
.btn-ghost{background:var(--s2);color:var(--ink);border:1px solid var(--b1)}
.btn-danger{background:rgba(244,63,94,.15);color:var(--danger);border:1px solid rgba(244,63,94,.2)}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn-row .btn{flex:1}
.btn-cancel{background:none;border:none;color:var(--ink2);font-size:15px;
  font-weight:600;cursor:pointer;padding:14px;width:100%;text-align:center;margin-top:4px}

/* ── Today screen ── */
.today-date{font-size:13px;color:var(--ink2);font-weight:500;
  padding:0 20px;margin-bottom:4px}
.today-hero{padding:4px 20px 16px}
.today-hero-title{font-size:32px;font-weight:800;letter-spacing:-.5px}
.today-hero-sub{font-size:14px;color:var(--ink2);margin-top:4px}
.counter-row{display:flex;gap:10px;padding:0 16px;margin-bottom:10px}
.counter{flex:1;background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);
  padding:14px;cursor:pointer;transition:background .1s}
.counter:active{background:var(--s2)}
.counter-n{font-size:26px;font-weight:800}
.counter-l{font-size:11px;color:var(--ink2);font-weight:600;margin-top:2px}
.counter.over .counter-n{color:var(--danger)}
.counter.ok .counter-n{color:var(--ok)}

/* ── Task row (Today / Lists) ── */
.trow{display:flex;align-items:flex-start;gap:12px;padding:13px 16px;
  border-bottom:1px solid var(--b1);cursor:pointer;transition:background .1s}
.trow:last-child{border-bottom:none}
.trow:active{background:var(--s2)}
.trow-body{flex:1;min-width:0;padding-top:1px}
.trow-text{font-size:15px;font-weight:500;line-height:1.4}
.trow-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}
.trow.done .trow-text{text-decoration:line-through;opacity:.4}

/* ── Lists screen ── */
/* ── Lists Hub ── */
.lists-hub-header{display:flex;align-items:center;gap:14px;padding:20px 20px 8px}
.lists-hub-avatar{width:44px;height:44px;border-radius:50%;background:var(--brandg);
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex:none}
.lists-hub-name{font-size:17px;font-weight:700;flex:1}
.lists-hub-search{width:38px;height:38px;border-radius:12px;background:var(--s2);
  border:1px solid var(--b1);display:flex;align-items:center;justify-content:center;
  color:var(--ink2);font-size:16px;cursor:pointer;flex:none;border:none;background:none}

/* Smart view rows */
.sv-row{display:flex;align-items:center;padding:0 16px;cursor:pointer;
  transition:background .1s;border-radius:0}
.sv-row:active{background:var(--s2)}
.sv-icon{width:52px;height:52px;display:flex;align-items:center;justify-content:center;flex:none}
.sv-icon-inner{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:19px}
.sv-name{flex:1;font-size:16px;font-weight:400;padding:16px 0;letter-spacing:-.1px}
.sv-count{font-size:14px;font-weight:600;color:var(--ink2);padding-right:4px}

/* Divider between sections */
.hub-sep{height:1px;background:var(--b1);margin:10px 16px}
.hub-sec-label{font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;
  color:var(--ink3);padding:12px 20px 4px}

/* User list rows */
.ul-row{display:flex;align-items:center;padding:0 16px;cursor:pointer;transition:background .1s}
.ul-row:active{background:var(--s2)}
.ul-icon{width:52px;height:52px;display:flex;align-items:center;justify-content:center;flex:none}
.ul-icon-inner{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-size:16px;color:#fff;font-weight:700}
.ul-name{flex:1;font-size:16px;font-weight:400;padding:15px 0;border-bottom:1px solid var(--b1);
  letter-spacing:-.1px}
.ul-row:last-child .ul-name{border-bottom:none}
.ul-count{font-size:13px;font-weight:600;color:var(--ink3);padding-right:6px}

/* New list footer row */
.lists-footer{display:flex;align-items:center;padding:0 16px;margin-top:6px;cursor:pointer}
.lists-footer:active{opacity:.7}
.lf-icon{width:52px;height:52px;display:flex;align-items:center;justify-content:center;flex:none}
.lf-plus{width:34px;height:34px;border-radius:9px;border:2px solid var(--brand);
  display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--brand);
  font-weight:300}
.lf-label{font-size:16px;font-weight:400;color:var(--brand);letter-spacing:-.1px}

/* ── List Detail ── */
.ld-topbar{display:flex;align-items:center;gap:4px;padding:12px 8px 0;position:relative;z-index:2}
.ld-back{width:44px;height:44px;border-radius:50%;background:none;border:none;
  color:var(--ink);font-size:24px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;flex:none}
.ld-actions{display:flex;align-items:center;gap:2px;margin-left:auto}
.ld-action-btn{width:44px;height:44px;border-radius:50%;background:none;border:none;
  color:var(--ink2);font-size:20px;cursor:pointer;display:flex;align-items:center;
  justify-content:center}
.ld-title-area{padding:2px 20px 18px;position:relative;z-index:2}
.ld-title{font-size:32px;font-weight:800;letter-spacing:-.6px;line-height:1.15}
.ld-subtitle{font-size:13px;color:var(--ink2);margin-top:5px;font-weight:500}

/* Task rows in detail — flat, borderless background */
.trow-flat{display:flex;align-items:flex-start;padding:0 8px;
  border-bottom:1px solid var(--b1);cursor:pointer;transition:background .1s;background:var(--s1)}
.trow-flat:active{background:var(--s2)}
.trow-flat:last-child{border-bottom:none}
.trow-chk-wrap{width:52px;height:56px;display:flex;align-items:center;
  justify-content:center;flex:none}
.trow-content{flex:1;padding:15px 0 14px;min-width:0}
.trow-title{font-size:16px;font-weight:400;line-height:1.35;letter-spacing:-.1px}
.trow-meta-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.trow-star-wrap{width:48px;height:56px;display:flex;align-items:center;
  justify-content:center;flex:none}
.trow-flat.done .trow-title{text-decoration:line-through;opacity:.35}

/* Completed toggle */
.done-toggle{display:flex;align-items:center;gap:10px;padding:12px 16px;
  cursor:pointer;color:var(--ink2);font-size:14px;font-weight:600;user-select:none;
  background:var(--s1)}
.done-toggle-arrow{font-size:11px;transition:transform .2s;display:inline-block;
  opacity:.6}
.done-toggle-arrow.open{transform:rotate(90deg)}

/* Inline add — sticky bottom bar */
.inline-add{display:flex;align-items:center;padding:0 8px;background:var(--s1);
  border-top:1px solid var(--b1)}
.inline-add-chk{width:52px;height:54px;display:flex;align-items:center;
  justify-content:center;flex:none}
.inline-add-dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink3);flex:none}
.inline-add input{flex:1;background:none;border:none;outline:none;
  font-size:16px;color:var(--ink);font-family:inherit;padding:16px 0}
.inline-add input::placeholder{color:var(--ink3)}

/* ── People screen ── */
.person-avatar{width:44px;height:44px;border-radius:50%;background:var(--brand);
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;
  color:#fff;flex:none}

/* ── Search ── */
.search-bar{display:flex;align-items:center;gap:10px;margin:8px 16px 0;
  background:var(--s2);border:1px solid var(--b1);border-radius:var(--r2);
  padding:11px 14px}
.search-bar input{flex:1;background:none;border:none;outline:none;
  color:var(--ink);font-size:15px;font-family:inherit}
.search-bar input::placeholder{color:var(--ink3)}
.search-ic{color:var(--ink3);font-size:16px}

/* ── More / Settings ── */
.more-profile{display:flex;align-items:center;gap:14px;padding:20px}
.more-avatar{width:54px;height:54px;border-radius:50%;background:var(--brandg);
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff}
.more-name{font-size:18px;font-weight:700}
.more-email{font-size:13px;color:var(--ink2);margin-top:2px}

/* ── Sync badge ── */
#sync-badge{position:fixed;top:env(safe-area-inset-top,0);right:0;left:0;
  max-width:480px;margin:0 auto;z-index:60;pointer-events:none}
.sync-bar{font-size:12px;font-weight:700;padding:6px 16px;text-align:center;
  transition:opacity .3s}
.sync-bar.synced{background:rgba(34,211,160,.15);color:var(--ok)}
.sync-bar.syncing{background:rgba(110,86,248,.15);color:var(--brand2)}

/* ── Color picker dots ── */

/* ── Toast ── */

  background:var(--s2);border:1px solid var(--b2);border-radius:12px;
  padding:10px 18px;font-size:13px;font-weight:600;color:var(--ink);
  box-shadow:var(--sh);opacity:0;transition:all .25s;z-index:70;white-space:nowrap;
  pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Auth screen ── */
#auth-screen{position:fixed;inset:0;background:var(--s0);z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 32px}
.auth-logo{width:72px;height:72px;border-radius:22px;background:var(--brandg);
  display:flex;align-items:center;justify-content:center;font-size:32px;
  font-weight:900;color:#fff;margin-bottom:24px;box-shadow:0 12px 40px rgba(110,86,248,.4)}
.auth-title{font-size:28px;font-weight:800;text-align:center;margin-bottom:8px}
.auth-sub{font-size:15px;color:var(--ink2);text-align:center;margin-bottom:40px;line-height:1.5}
.auth-btn{display:flex;align-items:center;justify-content:center;gap:12px;
  background:var(--s2);border:1px solid var(--b2);border-radius:var(--r);
  padding:16px;width:100%;cursor:pointer;font-size:16px;font-weight:600;color:var(--ink);
  margin-bottom:12px;transition:background .15s}
.auth-btn:active{background:var(--s3)}
.auth-skip{color:var(--ink2);font-size:14px;cursor:pointer;margin-top:8px;
  background:none;border:none;text-decoration:underline}
</style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-logo">M</div>
  <div class="auth-title">MBM Life</div>
  <div class="auth-sub">Your world, connected.<br>Tasks, people, time — all in one place.</div>
  <button class="auth-btn" id="auth-google">
    <span>G</span> Continue with Google
  </button>
  <button class="auth-skip" id="auth-skip">Continue without account</button>
</div>

<div id="sync-badge"><div id="sync-bar" style="display:none" class="sync-bar"></div></div>

<div id="app" style="display:none">
  <div id="screen"></div>
  <nav id="nav">
    <button class="nv on" data-s="today"><span class="nv-ic">☀</span>Today</button>
    <button class="nv" data-s="lists"><span class="nv-ic">≡</span>Lists</button>
    <button class="nv" data-s="calendar"><span class="nv-ic">◫</span>Calendar</button>
    <button class="nv" data-s="people"><span class="nv-ic">◎</span>People</button>
    <button class="nv" data-s="more"><span class="nv-ic">⋯</span>More</button>
  </nav>
  <button id="fab">＋</button>
</div>

<div id="sheet-bg"></div>
<div id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-body" id="sheet-body"></div>
</div>
<div id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════
   MBM LIFE v60 — Platform Edition
   Entity-graph architecture. Firebase-ready schema.
   ═══════════════════════════════════════════════════════════ */

const APP_VERSION='v62';
const SCHEMA=1;
const KEY='mbmlife_platform_v1';

/* ── Entity Schema ──────────────────────────────────────────
   All entities share: id, createdAt, updatedAt, archivedAt(null)
   Relationships stored as id references.
   ─────────────────────────────────────────────────────────── */
function blankDB(){
  return {
    schema:SCHEMA,
    meta:{theme:'dark',lang:'en',userId:null,displayName:null,email:null},
    entities:{
      tasks:{},     // {id,text,listId,dueDate,dueTime,priority,repeat,
                    //  assigneeId,creatorId,status,pinned,done,doneAt,
                    //  placeId,expenseId,noteIds[],tags[],
                    //  createdAt,updatedAt,archivedAt}
      lists:{},     // {id,name,icon,color,sortBy,shared,memberIds[],
                    //  createdAt,updatedAt,archivedAt}
      people:{},    // {id,name,avatar,email,phone,role,
                    //  taskIds[],noteIds[],
                    //  createdAt,updatedAt,archivedAt}
      events:{},    // {id,title,date,time,duration,placeId,personIds[],taskIds[],
                    //  createdAt,updatedAt,archivedAt}
      expenses:{},  // {id,amount,currency,label,taskId,personId,eventId,
                    //  createdAt,updatedAt,archivedAt}
      notes:{},     // {id,text,taskId,personId,eventId,
                    //  createdAt,updatedAt,archivedAt}
      places:{},    // {id,name,address,lat,lng,taskIds[],
                    //  createdAt,updatedAt,archivedAt}
    }
  };
}

/* ── Seed: default inbox list ── */
function seedDB(db){
  const now=new Date().toISOString();
  db.entities.lists['inbox']={
    id:'inbox',name:{en:'Tasks',fa:'کارها'},icon:'✓',color:'#6e56f8',
    sortBy:'smart',shared:false,memberIds:[],
    createdAt:now,updatedAt:now,archivedAt:null
  };
  return db;
}

/* ── Persistence ── */
function loadDB(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw)return seedDB(blankDB());
    const d=JSON.parse(raw);
    if(!d||!d.entities)return seedDB(blankDB());
    // ensure all entity collections exist
    ['tasks','lists','people','events','expenses','notes','places']
      .forEach(e=>{if(!d.entities[e])d.entities[e]={};});
    if(!Object.keys(d.entities.lists).length)seedDB(d);
    return d;
  }catch(e){return seedDB(blankDB());}
}
function saveDB(){
  DB.meta._savedAt=new Date().toISOString();
  try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}
  if(typeof syncPush==='function')syncPush();
}

let DB=loadDB();

/* ── Helpers ── */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function now(){return new Date().toISOString();}
function todayStr(){return new Date().toISOString().slice(0,10);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function shortDate(d){
  if(!d)return '';
  const t=todayStr();
  if(d===t)return L==='fa'?'امروز':'Today';
  const dt=new Date(d),now2=new Date();
  const diff=Math.round((dt-now2)/86400000);
  if(diff===-1)return L==='fa'?'دیروز':'Yesterday';
  if(diff===1)return L==='fa'?'فردا':'Tomorrow';
  return dt.toLocaleDateString(L==='fa'?'fa-IR':'en-US',{month:'short',day:'numeric'});
}
function priClass(p){return p==='p1'?'p1':p==='p2'?'p2':'p3';}

/* ── Active entity queries ── */
function active(type){
  return Object.values(DB.entities[type]||{}).filter(e=>!e.archivedAt);
}
function activeTasks(){return active('tasks');}
function activeTasksForList(listId){return activeTasks().filter(t=>t.listId===listId);}
function smartSortTasks(tasks){
  return [...tasks].sort((a,b)=>{
    // pinned first
    if(a.pinned!==b.pinned)return a.pinned?-1:1;
    // overdue before future
    const ts=todayStr();
    const ao=a.dueDate&&a.dueDate<ts&&!a.done;
    const bo=b.dueDate&&b.dueDate<ts&&!b.done;
    if(ao!==bo)return ao?-1:1;
    // by due date
    if(a.dueDate&&b.dueDate)return a.dueDate<b.dueDate?-1:1;
    if(a.dueDate)return -1;if(b.dueDate)return 1;
    // priority
    const po={p1:0,p2:1,p3:2};
    return (po[a.priority]||1)-(po[b.priority]||1);
  });
}

/* ── Language ── */
let L=DB.meta.lang||'en';
const I18N={
  en:{today:'Today',lists:'Lists',calendar:'Calendar',people:'People',more:'More',
    noTasks:'Nothing here yet.',addTask:'Add a task',tasks:'Tasks',important:'Important',
    planned:'Planned',allTasks:'All Tasks',myday:'My Day',
    done:'Completed',overdue:'Overdue',
    newList:'New List',listName:'List name',cancel:'Cancel',save:'Save',
    rename:'Rename list',delete:'Delete list',sortBy:'Sort by',
    changeTheme:'Change theme',share:'Share / Send a copy',duplicate:'Duplicate list',
    print:'Print list',suggestions:'Suggestions',reorder:'Reorder tasks',
    high:'High',medium:'Medium',low:'Low',
    search:'Search',noResults:'No results.',
    people_empty:'No people added yet.',
    signOut:'Sign out',settings:'Settings',about:'About',
    version:'Version',language:'Language',theme:'Theme',
    offline:'Offline',synced:'Synced',syncing:'Syncing…'},
  fa:{today:'امروز',lists:'لیست‌ها',calendar:'تقویم',people:'افراد',more:'بیشتر',
    noTasks:'هنوز چیزی نیست.',addTask:'کار جدید',tasks:'کارها',important:'مهم',
    planned:'برنامه‌ریزی شده',allTasks:'همه کارها',myday:'روز من',
    done:'انجام شده',overdue:'عقب‌افتاده',
    newList:'لیست جدید',listName:'نام لیست',cancel:'انصراف',save:'ذخیره',
    rename:'تغییر نام',delete:'حذف لیست',sortBy:'مرتب‌سازی',
    changeTheme:'تغییر رنگ',share:'اشتراک‌گذاری',duplicate:'کپی لیست',
    print:'چاپ لیست',suggestions:'پیشنهادات',reorder:'مرتب کردن',
    high:'بالا',medium:'متوسط',low:'پایین',
    search:'جستجو',noResults:'نتیجه‌ای نیست.',
    people_empty:'هنوز کسی اضافه نشده.',
    signOut:'خروج',settings:'تنظیمات',about:'درباره',
    version:'نسخه',language:'زبان',theme:'رنگ‌بندی',
    offline:'آفلاین',synced:'همگام‌سازی شد',syncing:'در حال همگام‌سازی…'},
};
function tr(k){return (I18N[L]||I18N.en)[k]||k;}

/* ── State ── */
let screen='today';
let tasksView='browser'; // 'browser'|'detail'
let activeListId=null;
let activeSmartView=null; // 'myday'|'important'|'planned'|'all'
let searchQuery='';

/* ── Render engine ── */
function render(){
  applyTheme();
  applyLang();
  document.querySelectorAll('.nv').forEach(b=>b.classList.toggle('on',b.dataset.s===screen));
  const el=document.getElementById('screen');
  if(screen==='today')el.innerHTML=renderToday();
  else if(screen==='lists')el.innerHTML=renderLists();
  else if(screen==='calendar')el.innerHTML=renderCalendar();
  else if(screen==='people')el.innerHTML=renderPeople();
  else if(screen==='more')el.innerHTML=renderMore();
  bindScreen();
}

function applyTheme(){
  document.body.classList.toggle('dark',DB.meta.theme!=='light');
}
function applyLang(){
  L=DB.meta.lang||'en';
  document.body.classList.toggle('rtl',L==='fa');
  document.documentElement.lang=L;
  document.querySelectorAll('.nv').forEach(b=>{
    const k=b.dataset.s;
    b.querySelector('span:last-child').textContent=tr(k)||k;
  });
}

/* ══════════════════════════════════════════
   TODAY SCREEN
   ══════════════════════════════════════════ */
function renderToday(){
  const ts=todayStr();
  const allT=activeTasks();
  const overdue=allT.filter(t=>!t.done&&t.dueDate&&t.dueDate<ts);
  const todayT=allT.filter(t=>!t.done&&(t.dueDate===ts||(!t.dueDate&&!t.done)));
  const doneToday=allT.filter(t=>t.done&&t.doneAt&&t.doneAt.slice(0,10)===ts);
  const upcoming=allT.filter(t=>!t.done&&t.dueDate&&t.dueDate>ts).slice(0,5);

  const dayName=new Date().toLocaleDateString(L==='fa'?'fa-IR':'en-US',{weekday:'long'});
  const dateStr=new Date().toLocaleDateString(L==='fa'?'fa-IR':'en-US',{month:'long',day:'numeric'});

  let html=`
    <div class="today-date">${dayName}, ${dateStr}</div>
    <div class="today-hero">
      <div class="today-hero-title">${tr('today')}</div>
      <div class="today-hero-sub">${todayT.length+overdue.length} ${L==='fa'?'کار باقی‌مانده':'tasks remaining'}</div>
    </div>`;

  // Counters
  html+=`<div class="counter-row">
    <div class="counter ${overdue.length?'over':''}" data-go="lists:overdue">
      <div class="counter-n">${overdue.length}</div>
      <div class="counter-l">${tr('overdue')}</div>
    </div>
    <div class="counter" data-go="lists:myday">
      <div class="counter-n">${todayT.length}</div>
      <div class="counter-l">${tr('today')}</div>
    </div>
    <div class="counter ok" data-go="lists:done">
      <div class="counter-n">${doneToday.length}</div>
      <div class="counter-l">${tr('done')}</div>
    </div>
  </div>`;

  // Overdue tasks
  if(overdue.length){
    html+=`<div class="sec-label">${tr('overdue')}</div>
      <div class="card-flat">${smartSortTasks(overdue).map(t=>taskRow(t)).join('')}</div>`;
  }

  // Today's tasks
  const focusTasks=todayT.filter(t=>!t.dueDate||t.dueDate===ts);
  if(focusTasks.length){
    html+=`<div class="sec-label">${tr('today')}</div>
      <div class="card-flat">${smartSortTasks(focusTasks).map(t=>taskRow(t)).join('')}</div>`;
  }

  // Done today
  if(doneToday.length){
    html+=`<div class="sec-label">${tr('done')}</div>
      <div class="card-flat">${doneToday.map(t=>taskRow(t)).join('')}</div>`;
  }

  // Upcoming
  if(upcoming.length){
    html+=`<div class="sec-label">${L==='fa'?'آینده':'Upcoming'}</div>
      <div class="card-flat">${smartSortTasks(upcoming).map(t=>taskRow(t)).join('')}</div>`;
  }

  if(!overdue.length&&!focusTasks.length&&!doneToday.length){
    html+=`<div class="empty"><div class="empty-ic">✓</div>
      <div class="empty-tx">${L==='fa'?'همه چیز انجام شده!':'All clear for today!'}</div></div>`;
  }

  return html;
}

/* ══════════════════════════════════════════
   LISTS SCREEN
   ══════════════════════════════════════════ */
function renderLists(){
  if(tasksView==='detail')return renderListDetail();

  const ts=todayStr();
  const allT=activeTasks();
  const lists=active('lists');
  const user=DB.meta;

  const svCounts={
    myday:allT.filter(t=>!t.done&&t.dueDate===ts).length,
    important:allT.filter(t=>!t.done&&t.pinned).length,
    planned:allT.filter(t=>!t.done&&t.dueDate&&t.dueDate>ts).length,
    all:allT.filter(t=>!t.done).length,
  };

  const svDef=[
    {sv:'myday',icon:'☀',color:'#f59e0b',name:tr('myday')},
    {sv:'important',icon:'★',color:'#f43f5e',name:tr('important')},
    {sv:'planned',icon:'◫',color:'#38bdf8',name:tr('planned')},
    {sv:'all',icon:'≡',color:'#6e56f8',name:tr('allTasks')},
  ];

  let html=`
    <div class="lists-hub-header">
      <div class="lists-hub-avatar">${(user.displayName||'?').slice(0,1).toUpperCase()}</div>
      <div style="flex:1">
        <div class="lists-hub-name">${esc(user.displayName||'My Lists')}</div>
        <div style="font-size:12px;color:var(--ink3);margin-top:1px">${esc(user.email||'')}</div>
      </div>
      <button class="lists-hub-search" id="btn-hub-search">🔍</button>
    </div>

    <div style="margin-bottom:4px">
      ${svDef.map(s=>`
        <div class="sv-row" data-sv="${s.sv}">
          <div class="sv-icon">
            <div class="sv-icon-inner" style="background:${s.color}18;color:${s.color}">${s.icon}</div>
          </div>
          <span class="sv-name">${esc(s.name)}</span>
          ${svCounts[s.sv]?`<span class="sv-count">${svCounts[s.sv]}</span>`:''}
        </div>`).join('')}
    </div>

    <div class="hub-sep"></div>
    <div class="hub-sec-label">${L==='fa'?'لیست‌های من':'My Lists'}</div>`;

  if(lists.length){
    html+=`<div style="margin-bottom:4px">
      ${lists.map(l=>{
        const count=allT.filter(t=>t.listId===l.id&&!t.done).length;
        return `<div class="ul-row" data-listid="${l.id}">
          <div class="ul-icon">
            <div class="ul-icon-inner" style="background:${l.color||'#6e56f8'}">${l.icon||'✓'}</div>
          </div>
          <span class="ul-name">${esc(l.name&&(l.name[L]||l.name.en)||l.id)}</span>
          ${count?`<span class="ul-count">${count}</span>`:''}
        </div>`;
      }).join('')}
    </div>`;
  }

  html+=`
    <div class="hub-sep"></div>
    <div class="lists-footer" id="btn-new-list">
      <div class="lf-icon"><div class="lf-plus">＋</div></div>
      <span class="lf-label">${tr('newList')}</span>
    </div>`;

  return html;
}

/* collapsed state for done section in list detail */
let doneCollapsed=true;

function renderListDetail(){
  const ts=todayStr();
  let title='',accentColor='#6e56f8',tasks=activeTasks();

  if(activeSmartView){
    const svMap={myday:tr('myday'),important:tr('important'),planned:tr('planned'),all:tr('allTasks')};
    const svColors={myday:'#f59e0b',important:'#f43f5e',planned:'#38bdf8',all:'#6e56f8'};
    title=svMap[activeSmartView]||'';
    accentColor=svColors[activeSmartView]||'#6e56f8';
    if(activeSmartView==='myday')tasks=tasks.filter(t=>t.dueDate===ts);
    else if(activeSmartView==='important')tasks=tasks.filter(t=>t.pinned);
    else if(activeSmartView==='planned')tasks=tasks.filter(t=>t.dueDate&&t.dueDate>ts);
  } else if(activeListId){
    const l=(DB.entities.lists||{})[activeListId];
    title=l?(l.name&&(l.name[L]||l.name.en)||'List'):'List';
    accentColor=l&&l.color||'#6e56f8';
    tasks=tasks.filter(t=>t.listId===activeListId);
  }

  tasks=smartSortTasks(tasks);
  const openT=tasks.filter(t=>!t.done);
  const doneT=tasks.filter(t=>t.done);
  const openCount=openT.length, doneCount=doneT.length;

  let html=`
    <div class="ld-topbar">
      <button class="ld-back" id="list-back">‹</button>
      <div class="ld-actions">
        ${activeListId?`<button class="ld-action-btn" id="list-menu-btn" aria-label="List options">⋯</button>`:''}
      </div>
    </div>

    <div class="ld-title-area">
      <div class="ld-title" style="color:${accentColor}">${esc(title)}</div>
      <div class="ld-subtitle">${openCount} ${L==='fa'?'باقی‌مانده':'remaining'}</div>
    </div>

    <div style="background:var(--s1);border-radius:var(--r) var(--r) 0 0;overflow:hidden;
      margin:0 0 0;border-top:1px solid var(--b1)" id="task-list-body">
      ${openT.length
        ? openT.map(t=>taskRowFlat(t)).join('')
        : `<div class="done-toggle" style="color:var(--ink3);cursor:default;font-weight:400">${tr('noTasks')}</div>`}
      ${doneCount?`
        <div class="done-toggle" id="done-toggle">
          <span class="done-toggle-arrow${doneCollapsed?'':' open'}">›</span>
          ${tr('done')} (${doneCount})
        </div>
        ${doneCollapsed?'':doneT.map(t=>taskRowFlat(t)).join('')}
      `:''}
    </div>

    ${activeListId?`
    <div class="inline-add">
      <div class="inline-add-chk"><div class="inline-add-dot"></div></div>
      <input id="inline-add-input" placeholder="${tr('addTask')}" autocomplete="off">
    </div>`:''}`;

  return html;
}

function taskRowFlat(t){
  const ts=todayStr();
  const over=t.dueDate&&t.dueDate<ts&&!t.done;
  const pr=t.priority&&t.priority!=='p3'
    ?`<span class="pill ${priClass(t.priority)}">${tr(t.priority==='p1'?'high':'medium')}</span>`:'';
  let meta='';
  if(t.dueDate)meta+=`<span class="chip${over?' over':''}">${over?'⚠ ':''}${shortDate(t.dueDate)}${t.dueTime?' '+t.dueTime:''}</span>`;
  if(t.listId&&activeSmartView){
    const l=(DB.entities.lists||{})[t.listId];
    if(l)meta+=`<span class="chip">${l.icon||''} ${esc(l.name&&(l.name[L]||l.name.en)||'')}</span>`;
  }
  return `<div class="trow-flat ${t.done?'done':''}" data-tid="${t.id}">
    <div class="trow-chk-wrap">
      <div class="chk ${t.done?'on':''}" data-chk="${t.id}"></div>
    </div>
    <div class="trow-content">
      <div class="trow-title">${esc(t.text)}</div>
      ${meta||pr?`<div class="trow-meta-row">${meta}${pr}</div>`:''}
    </div>
    <div class="trow-star-wrap">
      <button class="star ${t.pinned?'on':''}" data-pin="${t.id}">★</button>
    </div>
  </div>`;
}
/* ── Task row renderer ── */
function taskRow(t){
  const ts=todayStr();
  const over=t.dueDate&&t.dueDate<ts&&!t.done;
  const pr=t.priority&&t.priority!=='p3'?`<span class="pill ${priClass(t.priority)}">${tr(t.priority==='p1'?'high':'medium')}</span>`:'';
  let meta='';
  if(t.dueDate)meta+=`<span class="chip${over?' over':''}">${over?'⚠ ':''}${shortDate(t.dueDate)}${t.dueTime?' '+t.dueTime:''}</span>`;
  if(t.listId&&activeSmartView){
    const l=(DB.entities.lists||{})[t.listId];

  return `<div class="trow ${t.done?'done':''}" data-tid="${t.id}">

    </div>

  </div>`;
}

/* ══════════════════════════════════════════
   CALENDAR SCREEN
   ══════════════════════════════════════════ */
function renderCalendar(){
  // Phase 1: month grid with task dots
  const now2=new Date();
  const year=now2.getFullYear(),month=now2.getMonth();
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const ts=todayStr();
  const allT=activeTasks();

  const monthName=new Date(year,month).toLocaleDateString(L==='fa'?'fa-IR':'en-US',{month:'long',year:'numeric'});
  const dayNames=(L==='fa'?['ش','ی','د','س','چ','پ','ج']:['Su','Mo','Tu','We','Th','Fr','Sa']);

  let grid='';
  let day=1;
  // header
  grid+=dayNames.map(d=>`<div style="text-align:center;font-size:11px;font-weight:700;color:var(--ink3);padding:6px 0">${d}</div>`).join('');
  // empty cells
  for(let i=0;i<firstDay;i++)grid+=`<div></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hasTasks=allT.some(t=>t.dueDate===ds&&!t.done);
    const isToday=ds===ts;
    grid+=`<div style="text-align:center;padding:6px 0;position:relative;cursor:pointer" data-day="${ds}">
      <div style="width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto;
        ${isToday?'background:var(--brand);color:#fff;font-weight:700':''}
        font-size:14px">${d}</div>
      ${hasTasks?`<div style="width:5px;height:5px;border-radius:50%;background:var(--brand);margin:2px auto 0"></div>`:'<div style="height:7px"></div>'}
    </div>`;
  }

  // Tasks for today
  const todayTasks=smartSortTasks(allT.filter(t=>t.dueDate===ts&&!t.done));

  return `<div class="pg-head"><div class="pg-title">${tr('calendar')}</div></div>
    <div class="card">
      <div style="font-size:15px;font-weight:700;text-align:center;margin-bottom:12px">${monthName}</div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">${grid}</div>
    </div>
    ${todayTasks.length?`
      <div class="sec-label">${tr('today')}</div>
      <div class="card-flat">${todayTasks.map(t=>taskRow(t)).join('')}</div>`
    :''}`;
}

/* ══════════════════════════════════════════
   BIND EVENTS
   ══════════════════════════════════════════ */
function bindScreen(){
  // Checkboxes
  document.querySelectorAll('[data-chk]').forEach(el=>el.onclick=e=>{
    e.stopPropagation();completeTask(el.dataset.chk);});
  // Star/pin
  document.querySelectorAll('[data-pin]').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const t=DB.entities.tasks[el.dataset.pin];if(!t)return;
    t.pinned=!t.pinned;t.updatedAt=now();saveDB();render();});
  // Task row tap → edit (both .trow and .trow-flat)
  document.querySelectorAll('.trow,.trow-flat').forEach(el=>el.onclick=()=>openTaskEdit(el.dataset.tid));
  // List rows (hub)
  document.querySelectorAll('[data-listid]').forEach(el=>el.onclick=()=>{
    activeListId=el.dataset.listid;activeSmartView=null;tasksView='detail';render();});
  // Smart view rows
  document.querySelectorAll('[data-sv]').forEach(el=>el.onclick=()=>{
    activeSmartView=el.dataset.sv;activeListId=null;tasksView='detail';render();});
  // Counter navigation
  document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>{
    const[sc,sv]=el.dataset.go.split(':');
    if(sc==='lists'){screen='lists';activeSmartView=sv;activeListId=null;tasksView='detail';}
    render();});
  // Back button
  const back=document.getElementById('list-back');
  if(back)back.onclick=()=>{tasksView='browser';activeListId=null;activeSmartView=null;doneCollapsed=true;render();};
  // List menu
  const lmb=document.getElementById('list-menu-btn');
  if(lmb)lmb.onclick=()=>openListMenu(activeListId);
  // New list (hub footer)
  const nlb=document.getElementById('btn-new-list');
  if(nlb)nlb.onclick=()=>openNewListSheet();
  // Hub search button
  const hsb=document.getElementById('btn-hub-search');
  if(hsb)hsb.onclick=()=>{screen='more';render();/* TODO: open search */};
  // New person
  const npb=document.getElementById('btn-new-person');
  if(npb)npb.onclick=()=>openNewPersonSheet();
  // Done toggle (collapsible completed section)
  const dt=document.getElementById('done-toggle');
  if(dt)dt.onclick=()=>{doneCollapsed=!doneCollapsed;render();};
  // Inline add
  const ia=document.getElementById('inline-add-input');
  if(ia)ia.onkeydown=e=>{
    if(e.key==='Enter'&&ia.value.trim()){
      createTask(ia.value.trim(),activeListId);ia.value='';render();
    }};
  // Calendar day
  document.querySelectorAll('[data-day]').forEach(el=>el.onclick=()=>{
    // future: open day detail
  });
  // Person row
  document.querySelectorAll('[data-personid]').forEach(el=>el.onclick=()=>{
    // future: open person detail
  });
  // More actions
  document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>{
    const a=el.dataset.action;
    if(a==='toggle-lang'){DB.meta.lang=L==='en'?'fa':'en';saveDB();render();}
    else if(a==='toggle-theme'){DB.meta.theme=DB.meta.theme==='dark'?'light':'dark';saveDB();render();}
    else if(a==='sign-out'){DB.meta.userId=null;DB.meta.displayName=null;DB.meta.email=null;saveDB();location.reload();}
  });
}

function createTask(text,listId){
  const id=uid();
  DB.entities.tasks[id]={
    id,text,listId:listId||'inbox',
    dueDate:null,dueTime:null,priority:'p3',repeat:null,
    assigneeId:null,creatorId:DB.meta.userId,
    status:'open',pinned:false,done:false,doneAt:null,
    placeId:null,expenseId:null,noteIds:[],tags:[],
    createdAt:now(),updatedAt:now(),archivedAt:null
  };
  saveDB();
}

function completeTask(id){
  const t=DB.entities.tasks[id];if(!t)return;
  t.done=!t.done;
  t.doneAt=t.done?now():null;
  t.updatedAt=now();
  saveDB();render();
}

/* ── Shared action builders ── */
function _sacRow(icon,iconBg,label,action,opts={}){
  const rightHtml=opts.value
    ?`<span style="font-size:13px;color:var(--ink3);font-weight:500">${opts.value}</span><span class="sac-arr">›</span>`
    :`<span class="sac-arr">›</span>`;
  return `<button class="sac${opts.danger?' sac-danger':''}" data-lma="${action}">
    <div class="sac-icon-wrap">
      <div class="sac-icon" style="background:${iconBg}">${icon}</div>
    </div>
    <span class="sac-label">${label}</span>
    <div class="sac-right">${rightHtml}</div>
  </button>`;
}

function openListMenu(listId){
  const l=(DB.entities.lists||{})[listId];if(!l)return;
  const name=l.name&&(l.name[L]||l.name.en)||listId;
  const curSort=l.sortBy||'smart';
  const sortLabels={
    smart:L==='fa'?'هوشمند':'Smart',
    alpha:L==='fa'?'الفبایی':'A–Z',
    date:L==='fa'?'تاریخ':'Due date',
    priority:L==='fa'?'اولویت':'Priority'
  };
  const taskCount=activeTasks().filter(t=>t.listId===listId&&!t.done).length;
  const sugOn=l.suggestions!==false;

  const html=`
    <div class="sheet-header">
      <div class="sheet-list-identity">
        <div class="sheet-list-icon" style="background:${l.color||'#6e56f8'}20;color:${l.color||'#6e56f8'}">${l.icon||'✓'}</div>
        <div>
          <div class="sheet-list-name">${esc(name)}</div>
          <div class="sheet-list-meta">${taskCount} ${L==='fa'?'کار باقی‌مانده':'tasks remaining'}</div>
        </div>
      </div>
    </div>

    <div class="sheet-group">
      ${_sacRow('↕','rgba(56,189,248,.15)',tr('sortBy'),'sort',{value:sortLabels[curSort]||curSort})}
      ${_sacRow('⇅','rgba(110,86,248,.15)',tr('reorder'),'reorder')}
      ${_sacRow('🎨','rgba(245,158,11,.15)',tr('changeTheme'),'theme')}
    </div>

    <div class="sheet-group">
      ${_sacRow('📤','rgba(34,211,160,.15)',tr('share'),'share')}
      ${_sacRow('⧉','rgba(110,86,248,.15)',tr('duplicate'),'duplicate')}
      ${_sacRow('🖨','rgba(96,96,128,.15)',tr('print'),'print')}
      ${_sacRow('💡',sugOn?'rgba(245,158,11,.2)':'rgba(96,96,128,.15)',tr('suggestions'),'suggestions',
        {value:sugOn?(L==='fa'?'روشن':'On'):(L==='fa'?'خاموش':'Off')})}
    </div>

    <div class="sheet-group">
      ${_sacRow('✏️','rgba(110,86,248,.15)',tr('rename'),'rename')}
    </div>

    <div class="sheet-group">
      ${_sacRow('🗑','rgba(244,63,94,.12)',tr('delete'),'delete',{danger:true})}
    </div>

    <button class="sheet-cancel">${tr('cancel')}</button>`;

  openSheet(html);

  // Bind cancel
  document.querySelector('.sheet-cancel').onclick=closeSheet;

  // Bind actions
  document.querySelectorAll('[data-lma]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.lma;
    if(a==='sort'){closeSheet();_openSortSheet(listId,curSort,sortLabels);}
    else if(a==='reorder'){
      l.sortBy='alpha';l.updatedAt=now();saveDB();closeSheet();render();
      toast(L==='fa'?'مرتب‌سازی الفبایی اعمال شد':'Sorted A–Z');}
    else if(a==='theme'){closeSheet();_openThemeSheet(listId);}
    else if(a==='share'){closeSheet();_shareList(listId);}
    else if(a==='duplicate'){closeSheet();_duplicateList(listId);}
    else if(a==='print'){closeSheet();_printList(listId);}
    else if(a==='suggestions'){
      l.suggestions=!sugOn;l.updatedAt=now();saveDB();closeSheet();
      toast(name+' — '+tr('suggestions')+': '+(l.suggestions?(L==='fa'?'روشن':'On'):(L==='fa'?'خاموش':'Off')));}
    else if(a==='rename'){closeSheet();_openRenameSheet(listId);}
    else if(a==='delete'){closeSheet();_deleteList(listId);}
  });
}

function _shareList(listId){
  const l=DB.entities.lists[listId];if(!l)return;
  const name=l.name&&(l.name[L]||l.name.en)||'';
  const tasks=activeTasks().filter(t=>t.listId===listId);
  const text=name+'\n\n'+tasks.map(t=>(t.done?'☑ ':'☐ ')+t.text+(t.dueDate?' ('+t.dueDate+')':'')).join('\n');
  if(navigator.share)navigator.share({title:name,text}).catch(()=>{});
  else navigator.clipboard&&navigator.clipboard.writeText(text)
    .then(()=>toast(L==='fa'?'در کلیپ‌بورد کپی شد':'Copied to clipboard')).catch(()=>{});
}

function _duplicateList(listId){
  const l=DB.entities.lists[listId];if(!l)return;
  const name=l.name&&(l.name[L]||l.name.en)||'';
  const newId=uid();
  DB.entities.lists[newId]=Object.assign({},l,{
    id:newId,name:{en:name+' (copy)',fa:name+' (کپی)'},
    createdAt:now(),updatedAt:now()});
  activeTasks().filter(t=>t.listId===listId).forEach(t=>{
    const nid=uid();
    DB.entities.tasks[nid]=Object.assign({},t,{
      id:nid,listId:newId,done:false,doneAt:null,
      createdAt:now(),updatedAt:now()});
  });
  saveDB();render();toast(L==='fa'?'لیست کپی شد':'List duplicated');
}

function _printList(listId){
  const l=DB.entities.lists[listId];if(!l)return;
  const name=l.name&&(l.name[L]||l.name.en)||'';
  const tasks=activeTasks().filter(t=>t.listId===listId);
  const open=tasks.filter(t=>!t.done),done=tasks.filter(t=>t.done);
  const w=window.open('','_blank');
  if(!w)return;
  w.document.write(`<!DOCTYPE html><html><head><title>${name}</title>
    <style>body{font-family:-apple-system,sans-serif;max-width:600px;margin:48px auto;color:#111;font-size:15px}
    h1{font-size:24px;font-weight:800;margin-bottom:20px}
    ul{list-style:none;padding:0}
    li{display:flex;align-items:flex-start;gap:12px;padding:8px 0;border-bottom:1px solid #f0f0f0}
    li .cb{width:20px;height:20px;border:2px solid #999;border-radius:50%;flex:none;margin-top:1px}
    li.done .cb{background:#333;border-color:#333}
    li.done .tx{text-decoration:line-through;color:#aaa}
    .dt{font-size:12px;color:#999;margin-top:2px}
    h3{margin:24px 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#999}</style>
    </head><body><h1>${name}</h1>
    <ul>${open.map(t=>`<li><div class="cb"></div><div><div class="tx">${t.text}</div>${t.dueDate?`<div class="dt">${t.dueDate}</div>`:''}</div></li>`).join('')}</ul>
    ${done.length?`<h3>Completed</h3><ul>${done.map(t=>`<li class="done"><div class="cb"></div><div class="tx">${t.text}</div></li>`).join('')}</ul>`:''}</body></html>`);
  w.document.close();w.print();
}

      <div style="font-size:14px;color:var(--ink2);padding-bottom:16px;line-height:1.5">

      </div>
    </div>
    <div style="padding:0 14px">
      <div class="btn-row">
        <button class="btn btn-ghost" id="del-cancel">${tr('cancel')}</button>
        <button class="btn btn-danger" id="del-confirm">${L==='fa'?'بله، حذف شود':'Delete'}</button>
      </div>
    </div>

  openSheet(html);
  document.getElementById('del-cancel').onclick=closeSheet;

   SHEET (BOTTOM DRAWER)
   ══════════════════════════════════════════ */
/* ══════════════════════════════════════════
   SHEET ENGINE
   ══════════════════════════════════════════ */
let _sheetStack=[];

function openSheet(html,opts={}){
  const body=document.getElementById('sheet-body');
  const sheet=document.getElementById('sheet');
  const bg=document.getElementById('sheet-bg');
  // Push current content if stacking
  if(opts.stack&&body.innerHTML){_sheetStack.push(body.innerHTML);}
  body.innerHTML=html;
  // Scroll to top on new content
  sheet.scrollTop=0;
  if(!sheet.classList.contains('on')){
    sheet.classList.add('on');
    bg.classList.add('on');
  }
}

function closeSheet(opts={}){
  if(opts.back&&_sheetStack.length){
    const prev=_sheetStack.pop();
    document.getElementById('sheet-body').innerHTML=prev;
    document.getElementById('sheet').scrollTop=0;
    return;
  }
  _sheetStack=[];
  const sheet=document.getElementById('sheet');
  const bg=document.getElementById('sheet-bg');
  sheet.classList.remove('on');
  bg.classList.remove('on');
  // Clear after animation
  setTimeout(()=>{
    if(!sheet.classList.contains('on'))
      document.getElementById('sheet-body').innerHTML='';
  },350);
}

/* ── Chipsel helpers ── */
function bindChipsel(id,defVal){
  const el=document.getElementById(id);if(!el)return;
  el.querySelectorAll('button').forEach(b=>{
    b.classList.toggle('on',b.dataset.v===defVal);
    b.onclick=()=>{el.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');};
  });
}
function chipVal(id){
  const el=document.getElementById(id);if(!el)return null;
  const on=el.querySelector('button.on');return on?on.dataset.v:null;
}

/* ── Toast ── */
function toast(msg,ms=2200){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('on');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),ms);
}
