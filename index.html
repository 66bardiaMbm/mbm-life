<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>MBM Life</title>
<meta name="theme-color" content="#0f0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>
<style>
/* ═══════════════════════════════════
   MBM LIFE — Design System v64
   ═══════════════════════════════════ */
:root{
  --s0:#0f0f14; --s1:#16161e; --s2:#1e1e2a; --s3:#26263a;
  --ink:#f0f0f8; --ink2:#a0a0c0; --ink3:#606080;
  --brand:#6e56f8; --brand2:#9d7bff;
  --brandg:linear-gradient(135deg,var(--brand),var(--brand2));
  --ok:#22d3a0; --warn:#f59e0b; --danger:#f43f5e; --info:#38bdf8;
  --b1:rgba(255,255,255,.07); --b2:rgba(255,255,255,.12);
  --sheet:#1c1c24;
  --sh:0 8px 32px rgba(0,0,0,.5);
  --r:16px; --r2:12px;
}
/* ── Light theme ── active when body lacks .dark ── */
body.light{
  --s0:#f5f6fa; --s1:#ffffff; --s2:#ffffff; --s3:#eceef4;
  --ink:#1a1b26; --ink2:#4a4d66; --ink3:#8a8da8;
  --b1:rgba(0,0,0,.08); --b2:rgba(0,0,0,.14);
  --sheet:#ffffff;
  --sh:0 8px 32px rgba(20,20,40,.12);
}
body.light{background:var(--s0);color:var(--ink)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--s0);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body.rtl{direction:rtl;font-family:Vazirmatn,Tahoma,system-ui,sans-serif}

/* ── App shell ── */
#app{display:flex;flex-direction:column;height:100vh;max-width:480px;
  margin:0 auto;position:relative;overflow:hidden}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;padding:0 0 82px}
#screen::-webkit-scrollbar{display:none}

/* ── Nav bar ── */
#nav{position:absolute;bottom:0;left:0;right:0;height:82px;
  background:var(--s1);border-top:1px solid var(--b1);
  display:flex;align-items:stretch;padding:0 4px;
  padding-bottom:env(safe-area-inset-bottom,0)}
.nv{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;border:none;background:none;
  cursor:pointer;color:var(--ink3);font-size:10px;font-weight:600;
  letter-spacing:.3px;padding:8px 4px;transition:color .15s}
.nv.on{color:var(--brand)}
.nv-ic{font-size:22px;line-height:1;transition:transform .15s}
.nv-lb{font-size:10px;font-weight:600;letter-spacing:.2px;line-height:1}
.nv.on .nv-ic{transform:scale(1.1)}

/* ── FAB ── */
#fab{position:fixed;bottom:calc(82px + 16px + env(safe-area-inset-bottom,0));
  right:20px;width:56px;height:56px;border-radius:18px;
  background:var(--brandg);border:none;color:#fff;font-size:26px;
  cursor:pointer;box-shadow:0 8px 24px rgba(110,86,248,.45);
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s,box-shadow .15s;z-index:40}
#fab:active{transform:scale(.93)}

/* ── Typography helpers ── */
.sec-label{font-size:12px;font-weight:600;color:var(--ink3);
  padding:14px 20px 6px;letter-spacing:.1px}
.empty{text-align:center;padding:48px 24px;color:var(--ink3)}
.empty-ic{font-size:36px;margin-bottom:12px;opacity:.4}
.empty-tx{font-size:14px;line-height:1.6}

/* ── Checkbox ── */
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink3);
  flex:none;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .18s}
.chk.on{background:var(--brand);border-color:var(--brand)}
.chk.on::after{content:'';width:6px;height:10px;border:2.5px solid #fff;
  border-top:none;border-left:none;transform:rotate(42deg) translateY(-1px);display:block}

/* ── Star ── */
.star{width:36px;height:36px;flex:none;background:none;border:none;
  cursor:pointer;color:var(--ink3);font-size:18px;
  display:flex;align-items:center;justify-content:center;
  opacity:.45;transition:all .15s}
.star.on{color:#f59e0b;opacity:1}

/* ── Chips / pills ── */
.chip{display:inline-flex;align-items:center;gap:3px;background:var(--s2);
  border:1px solid var(--b1);border-radius:6px;padding:2px 7px;
  font-size:11px;font-weight:600;color:var(--ink2)}
.chip.over{color:var(--danger);border-color:rgba(244,63,94,.3);
  background:rgba(244,63,94,.08)}
.pill{font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;flex:none}
.pill.p1{background:rgba(244,63,94,.15);color:var(--danger)}
.pill.p2{background:rgba(245,158,11,.15);color:var(--warn)}
.chip-loc{color:var(--brand);border-color:rgba(110,86,248,.3);
  background:rgba(110,86,248,.08);cursor:pointer}
.chip-loc:active{background:rgba(110,86,248,.18)}

/* ── Form elements ── */
.fld{margin-bottom:14px}
.fld label{display:block;font-size:11px;font-weight:700;letter-spacing:.4px;
  text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.finput{width:100%;background:var(--s2);border:1px solid var(--b1);
  border-radius:var(--r2);padding:13px 14px;color:var(--ink);
  font-size:15px;outline:none;transition:border-color .15s;font-family:inherit}
.finput:focus{border-color:var(--brand)}
.finput::placeholder{color:var(--ink3)}
textarea.finput{resize:vertical;min-height:80px}

/* ── Chipsel ── */
.chipsel{display:flex;gap:6px;flex-wrap:wrap}
.chipsel button{background:var(--s2);border:1px solid var(--b1);border-radius:8px;
  padding:7px 13px;color:var(--ink2);font-size:13px;font-weight:600;cursor:pointer}
.chipsel button.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* ── Buttons ── */
.btn{border:none;border-radius:var(--r2);padding:14px;font-size:15px;
  font-weight:700;cursor:pointer;width:100%;transition:opacity .15s;font-family:inherit}
.btn:active{opacity:.8}
.btn-primary{background:var(--brandg);color:#fff}
.btn-ghost{background:var(--s2);color:var(--ink);border:1px solid var(--b1)}
.btn-danger{background:rgba(244,63,94,.15);color:var(--danger);
  border:1px solid rgba(244,63,94,.2)}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn-row .btn{flex:1}
.btn-cancel{background:none;border:none;color:var(--ink2);font-size:15px;
  font-weight:600;cursor:pointer;padding:14px;width:100%;
  text-align:center;margin-top:4px;font-family:inherit}

/* ════════════════════════════
   TODAY SCREEN
   ════════════════════════════ */
.today-head{padding:20px 20px 8px}
.today-date{font-size:13px;color:var(--ink3);font-weight:500;margin-bottom:6px}
.today-title{font-size:30px;font-weight:800;letter-spacing:-.5px}
.today-overdue-pill{display:inline-flex;align-items:center;gap:5px;
  background:rgba(244,63,94,.12);border-radius:6px;padding:3px 9px;
  font-size:12px;font-weight:700;color:var(--danger);margin-top:8px}
.ts-label{font-size:12px;font-weight:600;color:var(--ink3);
  padding:14px 20px 6px}

/* ── Inline add bar ── */
.inline-add{display:flex;align-items:center;padding:0 8px;
  background:var(--s1);border-top:1px solid var(--b1)}
.inline-add-chk{width:52px;height:54px;display:flex;align-items:center;
  justify-content:center;flex:none}
.inline-add-dot{width:22px;height:22px;border-radius:50%;
  border:2px solid var(--ink3);flex:none}
.inline-add input{flex:1;background:none;border:none;outline:none;
  font-size:16px;color:var(--ink);font-family:inherit;padding:16px 0}
.inline-add input::placeholder{color:var(--ink3)}

/* ════════════════════════════
   FLAT TASK ROW (Lists + Today)
   ════════════════════════════ */
.trow-flat{display:flex;align-items:flex-start;padding:0 8px;
  border-bottom:1px solid var(--b1);cursor:pointer;
  transition:background .1s;background:var(--s1)}
.trow-flat:active{background:var(--s2)}
.trow-flat:last-child{border-bottom:none}
.trow-chk-wrap{width:52px;height:56px;display:flex;align-items:center;
  justify-content:center;flex:none}
.trow-content{flex:1;padding:15px 0 14px;min-width:0}
.trow-title{font-size:16px;font-weight:400;line-height:1.35;letter-spacing:-.1px;
  word-break:break-word;overflow-wrap:anywhere}
.trow-meta-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.trow-star-wrap{width:48px;height:56px;display:flex;align-items:center;
  justify-content:center;flex:none}
.trow-flat.done .trow-title{text-decoration:line-through;opacity:.35}

/* Completed section toggle */
.done-toggle{display:flex;align-items:center;gap:10px;padding:12px 16px;
  cursor:pointer;color:var(--ink2);font-size:14px;font-weight:600;
  user-select:none;background:var(--s1)}
.done-toggle-arrow{font-size:11px;transition:transform .2s;
  display:inline-block;opacity:.6}
.done-toggle-arrow.open{transform:rotate(90deg)}

/* ════════════════════════════
   LISTS HUB
   ════════════════════════════ */
.lists-hub-header{display:flex;align-items:center;gap:14px;padding:20px 20px 8px}
.lists-hub-avatar{width:44px;height:44px;border-radius:50%;background:var(--brandg);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:800;color:#fff;flex:none}
.lists-hub-name{font-size:17px;font-weight:700;flex:1}
.lists-hub-search{width:42px;height:42px;flex:none;display:flex;align-items:center;
  justify-content:center;background:none;border:none;color:var(--ink2);cursor:pointer;
  border-radius:12px;-webkit-tap-highlight-color:transparent}
.lists-hub-search:active{background:var(--s3)}

/* Smart view rows */
.sv-row{display:flex;align-items:center;padding:0 16px;
  cursor:pointer;transition:background .1s}
.sv-row:active{background:var(--s2)}
.sv-icon{width:52px;height:52px;display:flex;align-items:center;
  justify-content:center;flex:none}
.sv-icon-inner{width:36px;height:36px;border-radius:10px;display:flex;
  align-items:center;justify-content:center;font-size:19px}
.sv-name{flex:1;font-size:16px;font-weight:400;padding:16px 0;letter-spacing:-.1px}
.sv-count{font-size:14px;font-weight:600;color:var(--ink2);padding-right:4px}

/* Hub dividers */
.hub-sep{height:1px;background:var(--b1);margin:6px 0}
.grp-header{display:flex;align-items:center;gap:6px;padding:10px 16px 6px}
.grp-name{flex:1;font-size:13px;font-weight:700;color:var(--ink3);
  letter-spacing:.3px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp-menu-btn,.grp-collapse-btn{background:none;border:none;color:var(--ink3);
  cursor:pointer;width:30px;height:30px;border-radius:50%;font-size:18px;
  display:flex;align-items:center;justify-content:center;flex:none;-webkit-tap-highlight-color:transparent}
.grp-menu-btn:active,.grp-collapse-btn:active{background:var(--s3)}
.grp-arrow{display:inline-block;transition:transform .18s;font-size:18px}
.grp-arrow.open{transform:rotate(90deg)}
.grp-lists{border-left:2px solid var(--b2);margin-left:22px}
.grp-empty{padding:10px 16px;font-size:13px;color:var(--ink3)}
.lists-footer-row{display:flex;align-items:center;gap:8px}
.lists-footer-row #btn-new-list{flex:1}
.btn-new-group{position:relative;display:flex;align-items:center;justify-content:center;
  width:52px;height:48px;flex:none;background:none;border:none;color:var(--brand);
  cursor:pointer;border-radius:12px;margin-right:10px;-webkit-tap-highlight-color:transparent}
.btn-new-group:active{background:var(--s2)}
.bng-plus{position:absolute;right:6px;top:8px;font-size:12px;font-weight:700}
.grp-pick{display:flex;align-items:center;gap:12px;width:100%;background:none;
  border:none;cursor:pointer;text-align:left;color:var(--ink);padding:10px 4px;
  border-radius:10px;font-family:inherit}
.grp-pick:active{background:var(--s2)}
.grp-pick.on{background:var(--s2)}
.grp-pick .ul-name{flex:1;min-width:0}
.grp-check{color:var(--brand);font-weight:800;width:20px;flex:none;text-align:center}
.grp-pick[data-other]{opacity:.55}
.hub-sec-label{font-size:12px;font-weight:600;color:var(--ink3);padding:10px 20px 4px}

/* User list rows */
.ul-row{display:flex;align-items:center;padding:0 16px;
  cursor:pointer;transition:background .1s}
.ul-row:active{background:var(--s2)}
.ul-icon{width:52px;height:52px;display:flex;align-items:center;
  justify-content:center;flex:none}
.ul-icon-inner{width:34px;height:34px;border-radius:9px;display:flex;
  align-items:center;justify-content:center;font-size:16px;color:#fff;font-weight:700}
.ul-name{flex:1;font-size:16px;font-weight:400;padding:15px 0;
  border-bottom:1px solid var(--b1);letter-spacing:-.1px}
.ul-row:last-child .ul-name{border-bottom:none}
.ul-count{font-size:13px;font-weight:600;color:var(--ink3);padding-right:6px}

/* New list footer */
.lists-footer{display:flex;align-items:center;padding:0 16px;
  margin-top:6px;cursor:pointer}
.lists-footer:active{opacity:.7}
.lf-icon{width:52px;height:52px;display:flex;align-items:center;
  justify-content:center;flex:none}
.lf-plus{width:34px;height:34px;border-radius:9px;border:2px solid var(--brand);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;color:var(--brand);font-weight:300}
.lf-label{font-size:16px;font-weight:400;color:var(--brand);letter-spacing:-.1px}

/* ════════════════════════════
   LIST DETAIL
   ════════════════════════════ */
.ld-bg{position:relative;overflow:hidden;min-height:152px}
.ld-bg-layer{position:absolute;inset:0;z-index:0}
.ld-topbar{display:flex;align-items:center;gap:4px;padding:12px 8px 0;
  position:relative;z-index:2}
.ld-back{width:44px;height:44px;border-radius:50%;background:none;border:none;
  color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;flex:none}
.ld-actions{display:flex;align-items:center;gap:2px;margin-left:auto}
.ld-action-btn{width:44px;height:44px;border-radius:50%;background:none;border:none;
  color:rgba(255,255,255,.8);font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.ld-title-area{padding:2px 20px 18px;position:relative;z-index:2}
.ld-title{font-size:32px;font-weight:800;letter-spacing:-.6px;
  line-height:1.15;color:#fff}
.ld-subtitle{font-size:13px;color:rgba(255,255,255,.7);margin-top:5px;font-weight:500}





/* ════════════════════════════
   PREMIUM SHEET
   ════════════════════════════ */
#sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:450;
  pointer-events:none;
  transition:background .25s,backdrop-filter .25s,-webkit-backdrop-filter .25s;
  backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px)}
#sheet-bg.on{background:rgba(0,0,0,.55);pointer-events:all;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#sheet{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;
  background:var(--sheet);border-radius:28px 28px 0 0;
  border-top:1px solid var(--b1);z-index:451;
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(0.22,1,0.36,1);
  max-height:90vh;overflow-y:auto;overflow-x:hidden;
  padding-bottom:env(safe-area-inset-bottom,0);will-change:transform}
#sheet.on{transform:translateY(0)}
.sheet-handle{width:40px;height:5px;border-radius:3px;background:var(--b2);
  margin:14px auto 0;flex-shrink:0}
.sheet-body{padding:0 0 4px}
.sheet-body h3{font-size:20px;font-weight:800;margin:0 22px 16px;padding-top:16px}

/* Sheet action rows (list menu) */
.sac{display:flex;align-items:center;width:100%;background:none;border:none;
  border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer;
  text-align:left;padding:0;color:var(--ink);
  position:relative;overflow:hidden;transition:background .1s}
.sac:last-child{border-bottom:none}
.sac:active{background:rgba(255,255,255,.06)}
.sac-icon-wrap{width:58px;height:58px;display:flex;align-items:center;
  justify-content:center;flex:none}
.sac-icon{width:26px;height:26px;display:flex;align-items:center;
  justify-content:center;flex:none;opacity:.85}
.sac-icon svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.6;
  fill:none;stroke-linecap:round;stroke-linejoin:round}
.sac-label{flex:1;font-size:17px;font-weight:400;letter-spacing:-.1px;padding:18px 0}
.sac-right{display:flex;align-items:center;gap:6px;
  padding-right:18px;color:var(--ink3);font-size:13px;font-weight:500}
.sac-arr{font-size:16px;opacity:.35}
.sac.sac-danger .sac-label{color:var(--danger)}
.sac.sac-danger .sac-icon{color:var(--danger)}

/* ── Floating anchored context menu (Microsoft To Do style) ── */
#ctxmenu-bg{position:fixed;inset:0;z-index:260;display:none;background:rgba(0,0,0,.45)}
#ctxmenu-bg.on{display:block}
#ctxmenu{position:fixed;z-index:261;display:none;
  min-width:248px;max-width:300px;
  background:var(--s1,#1c1c24);
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
  box-shadow:0 14px 44px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.03) inset;
  padding:6px;overflow:hidden;
  transform-origin:top right;
  transform:scale(.9);opacity:0;
  transition:transform .14s cubic-bezier(.2,.8,.2,1),opacity .14s ease}
#ctxmenu.on{display:block;transform:scale(1);opacity:1}
#ctxmenu .cmi{display:flex;align-items:center;gap:12px;width:100%;
  background:none;border:none;cursor:pointer;text-align:left;
  color:var(--ink);padding:12px 12px;border-radius:9px;
  font-size:15px;font-weight:500;letter-spacing:-.1px}
#ctxmenu .cmi:active{background:rgba(255,255,255,.07)}
#ctxmenu .cmi .cmi-ic{width:22px;height:22px;flex:none;display:flex;
  align-items:center;justify-content:center;opacity:.85}
#ctxmenu .cmi .cmi-ic svg{width:20px;height:20px;stroke:currentColor;
  stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
#ctxmenu .cmi .cmi-lbl{flex:1;min-width:0}
#ctxmenu .cmi .cmi-val{color:var(--ink3);font-size:12.5px;font-weight:500;flex:none}
#ctxmenu .cmi.cmi-danger{color:var(--danger)}
#ctxmenu .cmi.cmi-danger .cmi-ic{color:var(--danger)}
#ctxmenu .cm-sep{height:1px;background:rgba(255,255,255,.07);margin:5px 8px}

/* ── Reorder mode ── */
.reorder-bar{display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;background:var(--brand);color:#fff;font-weight:700;font-size:14px}
.reorder-bar button{background:rgba(255,255,255,.2);border:none;color:#fff;
  font-weight:800;font-size:14px;padding:7px 16px;border-radius:10px;cursor:pointer}
.trow-flat.reordering{padding-left:6px}
.trow-handle{flex:none;width:34px;height:34px;display:flex;align-items:center;
  justify-content:center;color:var(--ink3);font-size:20px;cursor:grab;touch-action:none}
.trow-flat.drag-ghost{opacity:.4}
.trow-flat.drag-active{background:var(--s3);box-shadow:0 8px 24px rgba(0,0,0,.5);
  border-radius:10px;position:relative;z-index:5}

.acct-item{display:flex;align-items:center;gap:14px;width:100%;background:none;
  border:none;cursor:pointer;text-align:left;color:var(--ink);
  padding:13px 18px;font-size:15px;font-weight:600}
.acct-item:active{background:var(--s3)}
.acct-item .acct-ic{width:24px;text-align:center;font-size:18px;flex:none;color:var(--ink2)}
.acct-item .acct-lbl{flex:1}
.acct-soon{font-size:11px;color:var(--ink3);margin-left:auto}

.acct-overlay{position:fixed;inset:0;z-index:400;background:var(--s0);
  opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;

.set-sw.on::after{transform:translateX(18px);background:#fff}

body.rtl .set-sw.on::after{transform:translateX(-18px)}
/* RTL task rows: right-align text/chips, keep checkbox and star in place, prevent overflow */
body.rtl .trow-title{text-align:right;word-break:break-word;overflow-wrap:anywhere}

/* ── Theme picker (To Do style) ── */
.thm-tabs{display:flex;gap:8px;padding:4px 16px 14px}

    schema:SCHEMA,

    entities:{
      tasks:{},     // {id,text,listId,dueDate,dueTime,priority,repeat,
                    //  assigneeId,creatorId,status,pinned,done,doneAt,
                    //  placeId,expenseId,noteIds[],tags[],
                    //  createdAt,updatedAt,archivedAt}
      lists:{},     // {id,name,icon,color,sortBy,shared,memberIds[],
                    //  createdAt,updatedAt,archivedAt}
      appts:{},     // {id,title,date,time,endTime,location,notes,
                    //  createdAt,updatedAt,archivedAt}
      people:{},    // {id,name,avatar,email,phone,role,
                    //  taskIds[],noteIds[],
                    //  createdAt,updatedAt,archivedAt}
      events:{},    // {id,title,date,time,duration,placeId,personIds[],taskIds[],
                    //  createdAt,updatedAt,archivedAt}

                    //  createdAt,updatedAt,archivedAt}
    }
  };
}

/* ── Seed: default inbox list ── */
function seedDB(db){
  const now=new Date().toISOString();
  db.entities.lists['inbox']={
    id:'inbox',name:{en:'Tasks',fa:'کارها'},icon:'✓',color:'#6e56f8',
    sortBy:'smart',shared:false,memberIds:[],
    createdAt:now,updatedAt:now,archivedAt:null
  };
  return db;
}

/* ── Persistence ── */
function loadDB(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw)return seedDB(blankDB());
    const d=JSON.parse(raw);
    if(!d||!d.entities)return seedDB(blankDB());
    // ensure all entity collections exist
    ['tasks','lists','people','events','expenses','notes','places']
      .forEach(e=>{if(!d.entities[e])d.entities[e]={};});
    if(!d.meta)d.meta={};
    if(!d.meta.viewSort)d.meta.viewSort={};
    if(!d.meta.viewOrder)d.meta.viewOrder={};
    if(d.meta.addOnTop===undefined)d.meta.addOnTop=true;
    if(d.meta.starTop===undefined)d.meta.starTop=true;
    if(d.meta.soundOn===undefined)d.meta.soundOn=true;
    if(d.meta.confirmDel===undefined)d.meta.confirmDel=true;
    if(d.meta.pushEnabled===undefined)d.meta.pushEnabled=false;
    if(d.meta.notifPermGranted===undefined)d.meta.notifPermGranted=false;
    if(d.meta.notifPrefs===undefined)d.meta.notifPrefs={taskReminders:true,dueToday:true,sharedActivity:true};
    if(d.meta.accent===undefined)d.meta.accent=null;
    if(d.meta.showDueMyDay===undefined)d.meta.showDueMyDay=true;
    if(d.meta.recogniseDates===undefined)d.meta.recogniseDates=true;
    if(d.meta.removeDates===undefined)d.meta.removeDates=false;
    if(d.meta.weekStart===undefined)d.meta.weekStart='system';
    if(d.meta.autoHideSmart===undefined)d.meta.autoHideSmart=false;
    if(!d.meta.smartShow||typeof d.meta.smartShow!=='object')d.meta.smartShow={};
    ['myday','important','planned','assigned','all'].forEach(k=>{if(d.meta.smartShow[k]===undefined)d.meta.smartShow[k]=true;});
    if(!Array.isArray(d.meta.groups))d.meta.groups=[];
    if(!Object.keys(d.entities.lists).length)seedDB(d);
    return d;
  }catch(e){return seedDB(blankDB());}
}
function saveDB(){
  DB.meta._savedAt=new Date().toISOString();
  try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}
  if(typeof syncPush==='function')syncPush();
}

let DB=loadDB();

/* ── Helpers ── */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

function todayStr(){return new Date().toISOString().slice(0,10);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function shortDate(d){
  if(!d)return '';
  const t=todayStr();
  if(d===t)return L==='fa'?'امروز':'Today';
  const dt=new Date(d),now2=new Date();
  const diff=Math.round((dt-now2)/86400000);
  if(diff===-1)return L==='fa'?'دیروز':'Yesterday';
  if(diff===1)return L==='fa'?'فردا':'Tomorrow';
  return dt.toLocaleDateString(L==='fa'?'fa-IR':'en-US',{month:'short',day:'numeric'});
}
function priClass(p){return p==='p1'?'p1':p==='p2'?'p2':'p3';}

/* ── Active entity queries ── */
function active(type){
  return Object.values(DB.entities[type]||{}).filter(e=>!e.archivedAt);

function activeTasks(){return active('tasks');}

/* ── Per-view sort & manual order architecture ──
   viewKey: 'list:<id>' for real lists, 'smart:<sv>' for smart views.
   DB.meta.viewSort[viewKey]  = 'smart'|'alpha'|'date'|'priority'|'manual'
   DB.meta.viewOrder[viewKey] = [taskId, taskId, ...] (manual order)
*/
function viewKeyFor(){
  if(activeListId)return 'list:'+activeListId;
  if(activeSmartView)return 'smart:'+activeSmartView;
  return 'today';
}
function getViewSort(viewKey){
  return (DB.meta.viewSort&&DB.meta.viewSort[viewKey])||'smart';
}
function setViewSort(viewKey,mode){
  if(!DB.meta.viewSort)DB.meta.viewSort={};
  DB.meta.viewSort[viewKey]=mode;
  saveDB();
}
function getViewOrder(viewKey){
  return (DB.meta.viewOrder&&DB.meta.viewOrder[viewKey])||[];
}
function setViewOrder(viewKey,ids){
  if(!DB.meta.viewOrder)DB.meta.viewOrder={};
  DB.meta.viewOrder[viewKey]=ids;
  saveDB();
}

let _seqTop=(function(){
  let mx=0;
  try{for(const id in DB.entities.tasks){const s=DB.entities.tasks[id].seq;if(typeof s==='number'&&s>mx)mx=s;}}catch(e){}
  return mx;
})();
function _nextSeq(){_seqTop+=1;return _seqTop;}
function _cmpSeq(a,b){
  const sa=(typeof a.seq==='number')?a.seq:0;
  const sb=(typeof b.seq==='number')?b.seq:0;
  // addOnTop → newest (higher seq) first; else oldest first
  return DB.meta.addOnTop!==false?(sb-sa):(sa-sb);
}
function _cmpSmart(a,b){
  if(DB.meta.starTop!==false && a.pinned!==b.pinned)return a.pinned?-1:1;
  const ts=todayStr();
  const ao=!!(a.dueDate&&a.dueDate<ts&&!a.done);
  const bo=!!(b.dueDate&&b.dueDate<ts&&!b.done);
  if(ao!==bo)return ao?-1:1;
  if(a.dueDate&&b.dueDate&&a.dueDate!==b.dueDate)return a.dueDate<b.dueDate?-1:1;
  if(a.dueDate&&!b.dueDate)return -1;if(b.dueDate&&!a.dueDate)return 1;
  const po={p1:0,p2:1,p3:2};
  const pr=(po[a.priority]||1)-(po[b.priority]||1);
  if(pr!==0)return pr;
  return _cmpSeq(a,b);
}
function _cmpAlpha(a,b){return (a.text||'').localeCompare(b.text||'');}
function _cmpDate(a,b){
  if(a.dueDate&&b.dueDate)return a.dueDate<b.dueDate?-1:(a.dueDate>b.dueDate?1:0);
  if(a.dueDate)return -1;if(b.dueDate)return 1;return 0;
}
function _cmpPriority(a,b){
  const po={p1:0,p2:1,p3:2};
  return (po[a.priority]||1)-(po[b.priority]||1);
}

// Sort a task array according to the view's selected mode.
function sortTasksForView(tasks,viewKey){
  const mode=getViewSort(viewKey);
  if(mode==='manual'){
    const order=getViewOrder(viewKey);
    const idx=id=>{const i=order.indexOf(id);return i===-1?9999:i;};
    return [...tasks].sort((a,b)=>{
      if(a.done!==b.done)return a.done?1:-1;
      const d=idx(a.id)-idx(b.id);
      if(d!==0)return d;
      return _cmpSmart(a,b); // stable fallback for items not yet ordered
    });
  }
  let cmp=_cmpSmart;
  if(mode==='alpha')cmp=_cmpAlpha;
  else if(mode==='date')cmp=_cmpDate;
  else if(mode==='priority')cmp=_cmpPriority;
  return [...tasks].sort((a,b)=>{
    if(a.done!==b.done)return a.done?1:-1;
    return cmp(a,b);
  });
}

// Backward-compatible helper used elsewhere (Today/search) → smart order.
function smartSortTasks(tasks){
  return [...tasks].sort(_cmpSmart);
}

/* ── Render engine ── */
function _showFatalError(err){
  const el=document.getElementById('screen');
  if(!el)return;
  const msg=(err&&(err.stack||err.message))||String(err);
  el.innerHTML=`<div style="padding:40px 20px;font-family:system-ui">
    <div style="font-size:40px">⚠️</div>
    <div style="font-size:18px;font-weight:800;margin:12px 0;color:#fff">Something went wrong</div>
    <div style="font-size:13px;color:#f88;background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.3);border-radius:10px;padding:12px;white-space:pre-wrap;word-break:break-word;max-height:240px;overflow:auto;text-align:left">${(msg||'').replace(/[<>]/g,'')}</div>
    <button onclick="location.reload()" style="margin-top:16px;background:var(--brand,#6e56f8);border:none;color:#fff;font-weight:700;padding:12px 20px;border-radius:10px;font-size:14px">Reload</button>
  </div>`;
}

function render(){

function _renderInner(){
  applyTheme();
  applyLang();
  const el=document.getElementById('screen');
  if(screen==='today')el.innerHTML=renderToday();
  else if(screen==='lists')el.innerHTML=renderLists();
  else if(screen==='appts')el.innerHTML=renderAppts();
  else if(screen==='search'){openSearch();screen='lists';el.innerHTML=renderLists();}
  else if(screen==='more')el.innerHTML=renderMore();
  else if(screen==='profile')el.innerHTML=renderProfile();
  bindScreen();
}

function _resolvedTheme(){
  const t=DB.meta.theme||'dark';
  if(t==='system'){
    return (window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
  }
  return t==='light'?'light':'dark';
}
function applyTheme(){
  const eff=_resolvedTheme();
  document.body.classList.toggle('dark',eff==='dark');
  document.body.classList.toggle('light',eff==='light');
  // Custom accent colour (falls back to default brand).
  const acc=DB.meta.accent;
  const root=document.documentElement.style;
  if(acc){
    root.setProperty('--brand',acc);
    root.setProperty('--brand2',_lighten(acc,26));
  }else{
    root.removeProperty('--brand');
    root.removeProperty('--brand2');
  }
  // Status-bar colour follows the theme.
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute('content',eff==='light'?'#f5f6fa':'#0f0f14');
}
// Lighten a hex colour by mixing toward white (amt 0-100).
function _lighten(hex,amt){
  const m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  if(!m)return hex;
  const f=p=>{const v=parseInt(p,16);return Math.round(v+(255-v)*(amt/100));};
  const h=x=>x.toString(16).padStart(2,'0');
  return '#'+h(f(m[1]))+h(f(m[2]))+h(f(m[3]));
}
// Re-apply when the OS theme changes and user is on "System".
if(window.matchMedia){
  try{window.matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{
    if((DB.meta.theme||'dark')==='system'){applyTheme();if(typeof render==='function')render();}
  });}catch(e){}
}
function applyLang(){
  L=DB.meta.lang||'en';
  document.body.classList.toggle('rtl',L==='fa');
  document.documentElement.lang=L;
}

function renderToday(){
  const ts=todayStr();
  const allT=activeTasks();
  const overdue=allT.filter(t=>!t.done&&t.dueDate&&t.dueDate<ts);
  const todayT=allT.filter(t=>!t.done&&(t.dueDate===ts||!t.dueDate));
  const doneToday=allT.filter(t=>t.done&&t.doneAt&&t.doneAt.slice(0,10)===ts);
  const upcoming=allT.filter(t=>!t.done&&t.dueDate&&t.dueDate>ts);
  // Today's appointments
  const todayAppts=Object.values(DB.entities.appts||{})
    .filter(a=>!a.archivedAt&&a.date===ts)
    .sort((a,b)=>(a.time||'')>(b.time||'')?1:-1);

  const dayName=new Date().toLocaleDateString(L==='fa'?'fa-IR':'en-US',{weekday:'long'});
  const dateStr=new Date().toLocaleDateString(L==='fa'?'fa-IR':'en-US',{month:'long',day:'numeric'});

  let html=`<div class="today-head">
    <div class="today-date">${dayName}, ${dateStr}</div>
    <div class="today-title">${tr('today')}</div>
    ${overdue.length?`<div class="today-overdue-pill">⚠ ${overdue.length} ${tr('overdue')}</div>`:''}
  </div>`;

  // Today's appointments
  if(todayAppts.length){
    html+=`<div class="ts-label">◷ ${tr('appts')}</div>
    <div style="background:var(--s1);border-top:1px solid var(--b1)">
      ${todayAppts.map(a=>`<div class="ul-row" data-apptid="${a.id}" style="padding:0 16px;cursor:pointer">
        <div class="ul-icon"><div style="width:34px;height:34px;border-radius:9px;background:var(--brand)20;color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:18px">◷</div></div>
        <span class="ul-name">${esc(a.title)}</span>
        <span class="ul-count">${a.time||''}</span>
      </div>`).join('')}
    </div>`;
  }

  // Overdue — first, no label, red checkbox tint
  if(overdue.length){
    html+=`<div style="background:var(--s1);border-top:1px solid var(--b1)">
      ${smartSortTasks(overdue).map(t=>taskRowFlat(t,true)).join('')}
    </div>`;
  }

  // Today's tasks — main focus
  const focusTasks=todayT.filter(t=>!overdue.includes(t));
  if(focusTasks.length){
    if(overdue.length)html+=`<div class="ts-label">${L==='fa'?'امروز':'Today'}</div>`;
    html+=`<div style="background:var(--s1);border-top:1px solid var(--b1)">
      ${smartSortTasks(focusTasks).map(t=>taskRowFlat(t)).join('')}
    </div>`;
  }

  // Done today — collapsed by default
  if(doneToday.length){
    html+=`<div class="done-toggle" id="done-toggle" style="padding-left:20px">
      <span class="done-toggle-arrow${doneCollapsed?'':' open'}">›</span>
      ${tr('done')} (${doneToday.length})
    </div>
    ${doneCollapsed?'':
      `<div style="background:var(--s1);border-top:1px solid var(--b1)">
        ${doneToday.map(t=>taskRowFlat(t)).join('')}
      </div>`}`;
  }

  // Upcoming — minimal, just 3
  if(upcoming.length){
    html+=`<div class="ts-label">${L==='fa'?'آینده نزدیک':'Coming up'}</div>
    <div style="background:var(--s1);border-top:1px solid var(--b1);opacity:.75">
      ${smartSortTasks(upcoming).map(t=>taskRowFlat(t)).join('')}
    </div>`;
  }

  if(!overdue.length&&!focusTasks.length&&!doneToday.length){
    html+=`<div class="empty" style="padding-top:60px">
      <div class="empty-ic" style="font-size:32px">✓</div>
      <div class="empty-tx">${L==='fa'?'همه چیز انجام شده!':'All clear for today!'}</div>
    </div>`;
  }

  // Inline add at bottom of today
  html+=`<div class="inline-add" style="margin-top:12px;border-radius:14px;margin:12px 16px 0;border:1px solid var(--b1)">
    <div class="inline-add-chk"><div class="inline-add-dot"></div></div>
    <input id="today-add-input" placeholder="${tr('addTask')}" autocomplete="off">
  </div>`;

  return html;
}

function taskRowFlat(t,isOverdue){
  const ts=todayStr();
  const over=t.dueDate&&t.dueDate<ts&&!t.done;
  const pr=t.priority==='p1'?`<span class="pill p1">${tr('high')}</span>`:'';
  let meta='';
  // In smart views or Today, show list name for context
  if(activeSmartView||screen==='today'){
    const l=(DB.entities.lists||{})[t.listId];
    if(l)meta+=`<span class="chip">${esc(l.name&&(l.name[L]||l.name.en)||'')}</span>`;
  }
  if(t.dueDate&&!over)meta+=`<span class="chip">${shortDate(t.dueDate)}${t.dueTime?' · '+t.dueTime:''}</span>`;
  if(over)meta+=`<span class="chip over">⚠ ${shortDate(t.dueDate)}</span>`;
  if(t.location)meta+=`<span class="chip chip-loc" data-map="${encodeURIComponent(t.location)}" role="button">📍 ${esc(t.location.split(',')[0])}</span>`;
  // overdue row: subtle left border
  const overStyle=isOverdue?'border-left:2px solid var(--danger);':'';
  return `<div class="trow-flat ${t.done?'done':''}" data-tid="${t.id}" style="${overStyle}">

      <div class="chk ${t.done?'on':''}" data-chk="${t.id}"></div>

      ${meta||pr?`<div class="trow-meta-row">${meta}${pr}</div>`:''}
    </div>
    <div class="trow-star-wrap">
      <button class="star ${t.pinned?'on':''}" data-pin="${t.id}">★</button>
    </div>
  </div>`;
}

function closeCtxMenu(){
  const m=document.getElementById('ctxmenu');
  const bg=document.getElementById('ctxmenu-bg');
  if(m)m.classList.remove('on');
  if(bg){bg.classList.remove('on');bg.style.display='none';}
  if(m)setTimeout(()=>{if(m&&!m.classList.contains('on'))m.style.display='none';},160);
}

function _showCtxMenu(innerHTML,anchorEl,bindFn){
  const menu=document.getElementById('ctxmenu');
  const bg=document.getElementById('ctxmenu-bg');
  if(!menu||!bg)return;
  menu.innerHTML=innerHTML;
  menu.style.display='block';
  menu.style.visibility='hidden';
  menu.classList.remove('on');
  const pad=8;
  const vw=window.innerWidth, vh=window.innerHeight;
  const mw=menu.offsetWidth||260, mh=menu.offsetHeight||320;
  let top=pad+44, left=vw-mw-pad;
  if(anchorEl&&anchorEl.getBoundingClientRect){
    const r=anchorEl.getBoundingClientRect();
    top=r.bottom+6;
    left=r.right-mw;
    if(left<pad)left=pad;
    if(left+mw>vw-pad)left=vw-mw-pad;
    if(top+mh>vh-pad){top=r.top-mh-6;if(top<pad)top=pad;}
  }
  menu.style.top=top+'px';
  menu.style.left=left+'px';
  menu.style.visibility='visible';
  bg.style.display='block';
  bg.classList.add('on');
  requestAnimationFrame(()=>menu.classList.add('on'));
  bg.onclick=closeCtxMenu;
  if(bindFn)bindFn(menu);
}

  const ts=todayStr();

function enterReorder(){
  const vk=viewKeyFor();

  let tasks=activeTasks();
  const ts=todayStr();

  else if(activeSmartView==='important')tasks=tasks.filter(t=>t.pinned);

  else if(activeListId)tasks=tasks.filter(t=>t.listId===activeListId);
  const current=sortTasksForView(tasks.filter(t=>!t.done),vk);
  setViewOrder(vk,current.map(t=>t.id));
  setViewSort(vk,'manual');
  reorderMode=true;render();

function exitReorder(){reorderMode=false;render();}

function bindReorder(){
  const back=document.getElementById('list-back');
  if(back)back.onclick=()=>exitReorder();
  const doneBtn=document.getElementById('reorder-done');
  if(doneBtn)doneBtn.onclick=()=>exitReorder();
  const listEl=document.getElementById('reorder-list');
  if(!listEl)return;

  let dragEl=null, startY=0;
  function rowsArr(){return Array.from(listEl.querySelectorAll('[data-reorder]'));}

  listEl.querySelectorAll('[data-handle]').forEach(handle=>{
    handle.addEventListener('pointerdown',e=>{
      e.preventDefault();
      dragEl=handle.closest('[data-reorder]');
      if(!dragEl)return;
      const r=dragEl.getBoundingClientRect();
      startY=e.clientY;
      dragEl.classList.add('drag-active');
      dragEl.style.width=r.width+'px';
      try{handle.setPointerCapture(e.pointerId);}catch(_){}
    });
    handle.addEventListener('pointermove',e=>{
      if(!dragEl)return;
      e.preventDefault();
      const dy=e.clientY-startY;
      dragEl.style.transform='translateY('+dy+'px)';
      const others=rowsArr().filter(r=>r!==dragEl);
      for(const other of others){
        const rect=other.getBoundingClientRect();
        const mid=rect.top+rect.height/2;
        const dragFollowsOther=other.compareDocumentPosition(dragEl)&Node.DOCUMENT_POSITION_FOLLOWING;
        const dragPrecedesOther=other.compareDocumentPosition(dragEl)&Node.DOCUMENT_POSITION_PRECEDING;
        if(e.clientY<mid && dragFollowsOther){
          listEl.insertBefore(dragEl,other);
          startY=e.clientY;dragEl.style.transform='translateY(0px)';break;
        }
        if(e.clientY>mid && dragPrecedesOther){
          listEl.insertBefore(dragEl,other.nextSibling);
          startY=e.clientY;dragEl.style.transform='translateY(0px)';break;
        }
      }
    });
    const endDrag=()=>{
      if(!dragEl)return;
      dragEl.classList.remove('drag-active');
      dragEl.style.transform='';
      dragEl.style.width='';
      const ids=rowsArr().map(row=>row.dataset.tid);
      setViewOrder(viewKeyFor(),ids);
      dragEl=null;
    };
    handle.addEventListener('pointerup',endDrag);
    handle.addEventListener('pointercancel',endDrag);
  });
}

function _weekStartIdx(){
  // Returns 0=Sun..6=Sat as the first column of the calendar grid.
  const w=DB.meta.weekStart||'system';
  if(w==='sun')return 0;
  if(w==='mon')return 1;
  if(w==='sat')return 6;
  // system: infer from locale (most Intl locales: Sun for en-US, Sat for fa/ar, Mon for EU)
  return L==='fa'?6:0;
}
let _apptMonth=null; // {y,m} currently shown; null = current month
function _apptMonthObj(){
  if(_apptMonth)return _apptMonth;
  const n=new Date();return {y:n.getFullYear(),m:n.getMonth()};
}
function renderApptCalendar(all){
  const {y,m}=_apptMonthObj();
  const ts=todayStr();
  const first=new Date(y,m,1);
  const daysInMonth=new Date(y,m+1,0).getDate();
  const startIdx=_weekStartIdx();
  // Day-of-week of the 1st, shifted so the grid starts on the chosen weekday.
  const lead=((first.getDay()-startIdx)+7)%7;
  // Which dates have appointments (YYYY-MM-DD set for this month).
  const marks={};
  all.forEach(a=>{const dt=a.date;if(dt&&dt.slice(0,7)===`${y}-${String(m+1).padStart(2,'0')}`)marks[dt]=true;});
  const monthName=first.toLocaleDateString(L==='fa'?'fa-IR':'en',{month:'long',year:'numeric'});
  // Weekday header labels, rotated to weekStart.
  const dowBase=L==='fa'?['ی','د','س','چ','پ','ج','ش']:['S','M','T','W','T','F','S'];
  // dowBase is indexed 0=Sun..6=Sat for en; build header from startIdx.
  const dow=[];for(let i=0;i<7;i++)dow.push(dowBase[(startIdx+i)%7]);
  let cells='';
  for(let i=0;i<lead;i++)cells+=`<div class="cal-cell cal-empty"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=ds===ts;
    const has=marks[ds];
    cells+=`<div class="cal-cell${isToday?' cal-today':''}" data-calday="${ds}">
      <span>${d}</span>${has?`<i class="cal-dot"></i>`:''}</div>`;
  }
  return `<div class="appt-cal-wrap">
    <div class="cal-nav">
      <button class="cal-navbtn" data-calnav="-1" aria-label="Prev">&#8249;</button>
      <div class="cal-month">${monthName}</div>
      <button class="cal-navbtn" data-calnav="1" aria-label="Next">&#8250;</button>
    </div>
    <div class="cal-dow">${dow.map(x=>`<div>${x}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
  </div>`;
}

function renderAppts(){
  const ts=todayStr();
  const all=Object.values(DB.entities.appts||{})
    .filter(a=>!a.archivedAt)
    .sort((a,b)=>{
      if(a.date!==b.date)return a.date<b.date?-1:1;
      return (a.time||'')< (b.time||'')?-1:1;
    });

  const upcoming=all.filter(a=>a.date>=ts);
  const past=all.filter(a=>a.date<ts);

  let html=`<div class="pg-head" style="display:flex;align-items:center;gap:6px;padding:20px 20px 8px">
    <button class="ld-back" id="appts-back" style="width:40px;height:40px;flex:none">&#8249;</button>
    <div style="flex:1;font-size:28px;font-weight:800;letter-spacing:-.5px">${tr('appts')}</div>
    <button class="hbtn" id="btn-new-appt" style="width:40px;height:40px;border-radius:12px;background:var(--s2);border:1px solid var(--b1);color:var(--ink);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center">＋</button>
  </div>`;

  html+=renderApptCalendar(all);

  if(!all.length){
    html+=`<div class="empty"><div class="empty-ic">◷</div>
      <div class="empty-tx">${tr('noAppts')}</div></div>`;
  } else {
    if(upcoming.length){
      html+=`<div class="hub-sec-label">${L==='fa'?'آینده':'Upcoming'}</div>
      <div style="background:var(--s1);border-radius:var(--r);overflow:hidden;border:1px solid var(--b1);margin:0 0 10px">
        ${upcoming.map(a=>apptRow(a)).join('')}
      </div>`;
    }
    if(past.length){
      html+=`<div class="hub-sec-label">${L==='fa'?'گذشته':'Past'}</div>
      <div style="background:var(--s1);border-radius:var(--r);overflow:hidden;border:1px solid var(--b1);margin:0 0 10px;opacity:.65">

    }
  }
  return html;
}

  if(!q.trim()){
    el.innerHTML=`<div class="srch-empty-state">
      <div class="srch-empty-ic">
        <svg width="76" height="76" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line></svg>
      </div>

    </div>`;return;}
  const ql=q.toLowerCase();
  const tasks=activeTasks().filter(t=>
    t.text.toLowerCase().includes(ql)||
    (t.notes||'').toLowerCase().includes(ql)||
    (t.location||'').toLowerCase().includes(ql));
  const lists=active('lists').filter(l=>{const n=l.name&&(l.name[L]||l.name.en)||'';return n.toLowerCase().includes(ql);});

    (a.title||'').toLowerCase().includes(ql)||
    (a.location||'').toLowerCase().includes(ql)||
    (a.notes||'').toLowerCase().includes(ql)));
  if(!tasks.length&&!lists.length&&!appts.length){
    el.innerHTML=`<div class="srch-empty">${tr('noResults')}</div>`;return;}
  const ts=todayStr();
  let html='';
  if(appts.length){
    html+=`<div class="hub-sec-label">◷ ${tr('appts')}</div>
    <div style="background:var(--s1);border-radius:var(--r);margin:0 0 8px;overflow:hidden;border:1px solid var(--b1)">
      ${appts.map(a=>`<div class="ul-row" data-srch-appt="${a.id}" style="cursor:pointer">
        <div class="ul-icon"><div style="width:34px;height:34px;border-radius:9px;background:rgba(110,86,248,.15);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:18px">◷</div></div>

        </div>

      </div>`).join('')}

  if(lists.length){
    html+=`<div class="hub-sec-label">${tr('lists')}</div>
    <div style="background:var(--s1);border-radius:var(--r);margin:0 0 8px;overflow:hidden;border:1px solid var(--b1)">
      ${lists.map(l=>`<div class="ul-row" data-srch-list="${l.id}">
        <div class="ul-icon"><div class="ul-icon-inner" style="background:${l.color||'#6e56f8'}">${l.icon||'✓'}</div></div>
        <span class="ul-name">${esc(l.name&&(l.name[L]||l.name.en)||l.id)}</span>
      </div>`).join('')}

  if(tasks.length){

    <div style="background:var(--s1);border-radius:var(--r);margin:0 0 8px;overflow:hidden;border:1px solid var(--b1)">

let _sheetStack=[];

function openSheet(html,opts={}){
  const body=document.getElementById('sheet-body');
  const sheet=document.getElementById('sheet');
  const bg=document.getElementById('sheet-bg');
  // Push current content if stacking
  if(opts.stack&&body.innerHTML){_sheetStack.push(body.innerHTML);}
  body.innerHTML=html;
  // Scroll to top on new content
  sheet.scrollTop=0;
  if(!sheet.classList.contains('on')){
    sheet.classList.add('on');
    bg.classList.add('on');
  }
}

function closeSheet(opts={}){
  if(opts.back&&_sheetStack.length){
    const prev=_sheetStack.pop();
    document.getElementById('sheet-body').innerHTML=prev;
    document.getElementById('sheet').scrollTop=0;
    return;
  }
  _sheetStack=[];
  const sheet=document.getElementById('sheet');
  const bg=document.getElementById('sheet-bg');
  sheet.classList.remove('on');
  bg.classList.remove('on');
  // Clear after animation
  setTimeout(()=>{
    if(!sheet.classList.contains('on'))
      document.getElementById('sheet-body').innerHTML='';
  },350);
}

/* ── Natural-language date/time recognition (To Do style) ──
   Returns {date,time,cleanText}. date/time may be null.
   Respects DB.meta.recogniseDates and DB.meta.removeDates. */
function recogniseDateTime(raw){
  const out={date:null,time:null,cleanText:raw};
  if(DB.meta.recogniseDates===false)return out;
  let s=raw;
  const spans=[]; // [start,end] of matched substrings to optionally strip
  const ts=todayStr();
  const base=new Date(ts+'T00:00:00');
  const isFa=/[\u0600-\u06FF]/.test(s);

  // Weekday name → next occurrence
  const dowEn={sunday:0,monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6,
               sun:0,mon:1,tue:2,tues:2,wed:3,thu:4,thur:4,thurs:4,fri:5,sat:6};
  const dowFa={'یکشنبه':0,'دوشنبه':1,'سه‌شنبه':2,'سه شنبه':2,'چهارشنبه':3,'پنجشنبه':4,'پنج‌شنبه':4,'جمعه':5,'شنبه':6};

  function setDate(d){if(!out.date)out.date=d;}

  // today / tomorrow / day-after
  const rel=[
    {re:/\b(today)\b/i,d:0},{re:/\b(tomorrow|tmrw)\b/i,d:1},
    {re:/\b(day after tomorrow)\b/i,d:2},
    {re:/(امروز)/,d:0},{re:/(فردا)/,d:1},{re:/(پس ?فردا)/,d:2},
  ];
  for(const r of rel){const m=s.match(r.re);if(m){const dd=new Date(base);dd.setDate(dd.getDate()+r.d);setDate(dd.toISOString().slice(0,10));spans.push([m.index,m.index+m[0].length]);break;}}

  // "in N days" / "N روز دیگه"
  let m=s.match(/\bin\s+(\d{1,3})\s+days?\b/i)||s.match(/(\d{1,3})\s*روز\s*(?:دیگه|بعد)/);
  if(m){const n=parseInt(m[1],10);const dd=new Date(base);dd.setDate(dd.getDate()+n);setDate(dd.toISOString().slice(0,10));spans.push([m.index,m.index+m[0].length]);}

  // "next week" / "هفته بعد"
  m=s.match(/\bnext week\b/i)||s.match(/هفته\s*(?:بعد|دیگه)/);
  if(m&&!out.date){const dd=new Date(base);dd.setDate(dd.getDate()+7);setDate(dd.toISOString().slice(0,10));spans.push([m.index,m.index+m[0].length]);}

  // weekday names (en)
  if(!out.date){
    for(const name in dowEn){
      const re=new RegExp('\\b'+name+'\\b','i');const mm=s.match(re);
      if(mm){setDate(_nextWeekday(base,dowEn[name]));spans.push([mm.index,mm.index+mm[0].length]);break;}
    }
  }
  // weekday names (fa)
  if(!out.date){
    for(const name in dowFa){
      const idx=s.indexOf(name);
      if(idx>=0){setDate(_nextWeekday(base,dowFa[name]));spans.push([idx,idx+name.length]);break;}
    }
  }

  // explicit date dd/mm or yyyy-mm-dd
  m=s.match(/\b(\d{4})-(\d{2})-(\d{2})\b/);
  if(m){setDate(m[0]);spans.push([m.index,m.index+m[0].length]);}
  else{
    m=s.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);
    if(m){let dd=+m[1],mo=+m[2],yr=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):base.getFullYear();
      const jsd=new Date(yr,mo-1,dd);
      if(!isNaN(jsd)){setDate(jsd.toISOString().slice(0,10));spans.push([m.index,m.index+m[0].length]);}}
  }

  // time: 3pm / 3:30pm / 15:30 / ساعت ۳
  m=s.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i);
  if(m){let h=+m[1]%12;if(/pm/i.test(m[3]))h+=12;const mi=m[2]?m[2]:'00';out.time=String(h).padStart(2,'0')+':'+mi;spans.push([m.index,m.index+m[0].length]);}
  else{
    m=s.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);
    if(m){out.time=String(+m[1]).padStart(2,'0')+':'+m[2];spans.push([m.index,m.index+m[0].length]);}
  }

  // Strip recognised spans if requested
  if(DB.meta.removeDates&&spans.length){
    // remove from end to keep indices valid
    spans.sort((a,b)=>b[0]-a[0]);
    let t=s;
    for(const[st,en]of spans)t=t.slice(0,st)+t.slice(en);
    out.cleanText=t.replace(/\s{2,}/g,' ').replace(/\s+([,.،])/g,'$1').trim();
    if(!out.cleanText)out.cleanText=raw; // never leave an empty title
  }
  return out;
}
function _nextWeekday(base,target){
  const d=new Date(base);
  let diff=(target-d.getDay()+7)%7;
  if(diff===0)diff=7; // "monday" said on a monday → next monday
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}

/* ── Repeat (recurrence) helpers ──
   t.repeat can be:
     null / 'none'  → no repeat
     legacy string  → 'daily'|'weekly'|'monthly'|'yearly' (migrated on read)
     object         → {freq:'daily'|'weekly'|'monthly'|'yearly', interval:N, days:[0-6]}
*/
function normalizeRepeat(rep){
  if(!rep||rep==='none')return null;
  if(typeof rep==='string')return {freq:rep,interval:1,days:[]};
  return {freq:rep.freq,interval:rep.interval||1,days:Array.isArray(rep.days)?rep.days:[]};
}
function repeatIsOn(rep){const n=normalizeRepeat(rep);return !!(n&&n.freq);}

function _addDays(dateStr,n){
  const d=new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}

// Filter planned tasks by the selected time bucket (like To Do).
function filterPlanned(tasks){
  const ts=todayStr();
  const tomorrow=_addDays(ts,1);
  const weekEnd=_addDays(ts,7);
  return tasks.filter(t=>{
    if(!t.dueDate)return false;
    switch(plannedFilter){
      case 'overdue': return t.dueDate<ts;
      case 'today': return t.dueDate===ts;
      case 'tomorrow': return t.dueDate===tomorrow;
      case 'week': return t.dueDate>=ts && t.dueDate<=weekEnd;
      case 'later': return t.dueDate>weekEnd;
      case 'all':
      default: return true;
    }
  });
}
function plannedFilterLabel(){
  const ts=todayStr();
  const d=new Date(ts+'T00:00:00');
  const wd=L==='fa'?['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه']:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const tw=new Date(_addDays(ts,1)+'T00:00:00');
  const labels={
    overdue:L==='fa'?'گذشته':'Overdue',
    today:(L==='fa'?'امروز':'Today')+' ('+wd[d.getDay()]+')',
    tomorrow:(L==='fa'?'فردا':'Tomorrow')+' ('+wd[tw.getDay()]+')',
    week:L==='fa'?'این هفته':'This week',
    later:L==='fa'?'بعداً':'Later',
    all:L==='fa'?'همه':'All planned'
  };
  return labels[plannedFilter]||labels.all;
}
function _addMonths(dateStr,n){
  const d=new Date(dateStr+'T00:00:00');
  const day=d.getDate();
  d.setMonth(d.getMonth()+n);
  // guard month overflow (e.g. Jan 31 +1 month)
  if(d.getDate()<day)d.setDate(0);
  return d.toISOString().slice(0,10);
}
// Compute the next due date after a given date, per the repeat rule.
function nextRepeatDate(dateStr,rep){
  const n=normalizeRepeat(rep);
  if(!n||!dateStr)return null;
  const iv=Math.max(1,n.interval||1);
  if(n.freq==='daily')return _addDays(dateStr,iv);
  if(n.freq==='weekly'){
    if(n.days&&n.days.length){
      // find next selected weekday strictly after dateStr
      let cursor=dateStr;
      for(let i=0;i<7*iv+7;i++){
        cursor=_addDays(cursor,1);
        const wd=new Date(cursor+'T00:00:00').getDay();
        if(n.days.includes(wd)){
          // for interval>1, weekly day-set still advances to next matching day;
          // interval primarily affects plain weekly. Keep simple & predictable.
          return cursor;
        }
      }
      return _addDays(dateStr,7*iv);
    }
    return _addDays(dateStr,7*iv);
  }
  if(n.freq==='monthly')return _addMonths(dateStr,iv);
  if(n.freq==='yearly')return _addMonths(dateStr,12*iv);
  return null;
}

function repeatSummary(rep){
  const n=normalizeRepeat(rep);
  if(!n)return L==='fa'?'هرگز':'Never';
  const iv=n.interval||1;
  const dayNames=L==='fa'?['ی','د','س','چ','پ','ج','ش']:['Su','Mo','Tu','We','Th','Fr','Sa'];
  if(n.freq==='daily')return iv===1?(L==='fa'?'روزانه':'Daily'):(L==='fa'?`هر ${iv} روز`:`Every ${iv} days`);
  if(n.freq==='weekly'){
    let base=iv===1?(L==='fa'?'هفتگی':'Weekly'):(L==='fa'?`هر ${iv} هفته`:`Every ${iv} weeks`);
    if(n.days&&n.days.length)base+=' · '+n.days.slice().sort().map(d=>dayNames[d]).join(L==='fa'?'،':',');
    return base;
  }
  if(n.freq==='monthly')return iv===1?(L==='fa'?'ماهانه':'Monthly'):(L==='fa'?`هر ${iv} ماه`:`Every ${iv} months`);
  if(n.freq==='yearly')return iv===1?(L==='fa'?'سالانه':'Yearly'):(L==='fa'?`هر ${iv} سال`:`Every ${iv} years`);
  return L==='fa'?'هرگز':'Never';
}

  function rerender(){document.getElementById('sheet-body').innerHTML=body();bind();}

function completeTask(id){
  const t=DB.entities.tasks[id];if(!t)return;
  const wasOpen=!t.done;
  // If completing a recurring task that has a due date, spawn the next occurrence.
  if(wasOpen&&repeatIsOn(t.repeat)&&t.dueDate){
    const next=nextRepeatDate(t.dueDate,t.repeat);
    if(next){
      const nid=uid();
      DB.entities.tasks[nid]=Object.assign({},t,{
        id:nid,dueDate:next,done:false,doneAt:null,
        createdAt:now(),updatedAt:now()
      });
    }
  }
  t.done=!t.done;
  t.doneAt=t.done?now():null;
  t.updatedAt=now();
  if(t.done)playCompletionSound();
  saveDB();render();
}
// Short pleasant chime via WebAudio (no asset needed). Respects soundOn setting.
let _audioCtx=null;
function playCompletionSound(){
  if(DB.meta.soundOn===false)return;
  try{
    _audioCtx=_audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const ctx=_audioCtx;
    if(ctx.state==='suspended')ctx.resume();
    const t0=ctx.currentTime;
    [ [880,0],[1320,0.09] ].forEach(([f,dt])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.value=f;
      o.connect(g);g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001,t0+dt);
      g.gain.exponentialRampToValueAtTime(0.22,t0+dt+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+dt+0.22);
      o.start(t0+dt);o.stop(t0+dt+0.24);
    });
  }catch(e){}
}

// Reusable voice-to-text for any input + mic button pair.
let _voiceRecog=null,_voiceActiveBtn=null;
function attachVoiceInput(micId,inputId,onText){
  const micBtn=document.getElementById(micId);
  const inp=document.getElementById(inputId);
  if(!micBtn||!inp)return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  micBtn.onclick=()=>{
    if(!SR){
      toast(L==='fa'
        ?'جستجوی صوتی در این مرورگر/اپ پشتیبانی نمی‌شود'
        :'Voice input not supported in this browser/app');
      return;
    }
    // toggle off if already recording on this button
    if(_voiceActiveBtn===micBtn&&_voiceRecog){try{_voiceRecog.stop();}catch(_){}return;}
    // stop any other active recognition
    if(_voiceRecog){try{_voiceRecog.stop();}catch(_){}}
    try{
      const rec=new SR();
      _voiceRecog=rec;_voiceActiveBtn=micBtn;
      rec.lang=(L==='fa')?'fa-IR':'en-US';
      rec.interimResults=true;
      rec.maxAlternatives=1;
      rec.onstart=()=>{micBtn.classList.add('recording');toast(L==='fa'?'بگویید...':'Listening...');};
      rec.onresult=(e)=>{
        let txt='';
        for(let i=0;i<e.results.length;i++)txt+=e.results[i][0].transcript;
        inp.value=txt;
        if(typeof onText==='function')onText(txt);
      };
      rec.onerror=(e)=>{
        micBtn.classList.remove('recording');
        const err=e.error;
        if(err==='not-allowed'||err==='service-not-allowed')
          toast(L==='fa'?'دسترسی میکروفون رد شد. از تنظیمات اجازه دهید':'Microphone blocked. Allow it in settings');
        else if(err==='no-speech')toast(L==='fa'?'صدایی شنیده نشد':'No speech detected');
        else if(err==='audio-capture')toast(L==='fa'?'میکروفونی یافت نشد':'No microphone found');
        else if(err!=='aborted')toast(L==='fa'?'خطای میکروفون':'Microphone error');
      };
      rec.onend=()=>{micBtn.classList.remove('recording');if(_voiceActiveBtn===micBtn){_voiceRecog=null;_voiceActiveBtn=null;}};
      rec.start();
    }catch(err){
      micBtn.classList.remove('recording');
      toast(L==='fa'?'میکروفون در دسترس نیست':'Microphone unavailable');
    }
  };
}

/* ── Google Sign-In (popup only — no redirect) ── */
function authError(msg){
  const el=document.getElementById('auth-error');
  if(el){el.textContent=msg;el.style.display='block';}
}
function authClearError(){
  const el=document.getElementById('auth-error');
  if(el){el.textContent='';el.style.display='none';}
}
function signInWithGoogle(){
  if(!FB.ready){authError(L==='fa'?'سرویس ورود در دسترس نیست':'Sign-in service unavailable');return;}
  authClearError();
  const btn=document.getElementById('auth-google');
  if(btn){btn.disabled=true;btn.style.opacity='.6';}
  const provider=new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({prompt:'select_account'});
  FB.auth.signInWithPopup(provider).then(result=>{
    /* success handled by onAuthStateChanged */
  }).catch(e=>{
    if(btn){btn.disabled=false;btn.style.opacity='1';}
    const code=e&&e.code?e.code:'';
    if(code==='auth/popup-blocked'){
      authError(L==='fa'?'پنجره ورود توسط مرورگر مسدود شد. اجازه باز شدن پنجره را بدهید و دوباره تلاش کنید.':'Sign-in popup was blocked by the browser. Allow popups and try again.');
      return;
    }
    if(code==='auth/popup-closed-by-user'||code==='auth/cancelled-popup-request'){
      authError(L==='fa'?'پنجره ورود بسته شد. دوباره تلاش کنید.':'Sign-in window closed. Please try again.');
      return;
    }
    if(code==='auth/network-request-failed'){
      authError(L==='fa'?'خطای شبکه. اتصال اینترنت را بررسی کنید.':'Network error. Check your connection.');
      return;
    }
    if(code==='auth/operation-not-supported-in-this-environment'){
      authError(L==='fa'?'ورود در این مرورگر پشتیبانی نمی‌شود. مرورگر دیگری امتحان کنید.':'Sign-in is not supported in this browser. Try another browser.');
      return;
    }
    authError((L==='fa'?'ورود ناموفق بود: ':'Sign-in failed: ')+(e&&e.message?e.message:code||'unknown'));
    console.warn('Sign-in error:',e);
  });
}

/* ── Firestore listeners ── */
function startListeners(){
  if(!FB.ready||!FB.user)return;
  stopListeners();
  const ws=wsId(FB.user.uid);
  const db=FB.db;

  const sync=(col,entity)=>db.collection('workspaces').doc(ws).collection(col)
    .onSnapshot(snap=>{
      snap.docChanges().forEach(ch=>{
        const d=ch.doc.data();
        if(ch.type==='removed')delete DB.entities[entity][ch.doc.id];
        else DB.entities[entity][ch.doc.id]=d;
      });
      localStorage.setItem(KEY,JSON.stringify(DB));
      render();
    },()=>{});

  const u1=sync('tasks','tasks');
  const u2=sync('lists','lists');
  const u3=sync('appts','appts');
  _syncUnsubs=[u1,u2,u3];
}

function stopListeners(){
  _syncUnsubs.forEach(u=>{try{u();}catch(e){}});
  _syncUnsubs=[];
}

function syncPush(){
  if(!FB.ready||!FB.user)return;
  const ws=wsId(FB.user.uid);
  const db=FB.db;
  const batch=db.batch();
  const col=(name)=>db.collection('workspaces').doc(ws).collection(name);
  Object.values(DB.entities.tasks||{}).forEach(t=>batch.set(col('tasks').doc(t.id),t));
  Object.values(DB.entities.lists||{}).forEach(l=>batch.set(col('lists').doc(l.id),l));
  Object.values(DB.entities.appts||{}).forEach(a=>batch.set(col('appts').doc(a.id),a));
  batch.commit().catch(()=>{});
}

function pushProfile(){

    photo:DB.meta.photo||null,

function pullProfile(){
  if(!FB.ready||!FB.user)return;
  const ws=wsId(FB.user.uid);
  FB.db.collection('workspaces').doc(ws).collection('profile').doc('main')
    .onSnapshot(snap=>{
      if(!snap.exists)return;
      const d=snap.data()||{};
      let changed=false;
      if('photo' in d && d.photo!==DB.meta.photo){DB.meta.photo=d.photo||null;changed=true;}
      if('avatar' in d && d.avatar!==DB.meta.avatar){DB.meta.avatar=d.avatar||null;changed=true;}

      if(changed){
        try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}
        render();
      }
    },()=>{});
}

/* ══════════════════════════════════════════
   PUSH NOTIFICATIONS (FCM)
   Production architecture:
   - Client obtains an FCM registration token and stores it under
     workspaces/{ws}/devices/{token} with metadata + tz offset.
   - A scheduled Cloud Function scans tasks/appts each minute and sends
     push messages to that workspace's device tokens when a reminder is due.
   - Foreground messages are shown via the Notification API directly.
   ══════════════════════════════════════════ */
let _fcmToken=null;
const REMINDER_LEAD_MIN=0; // reminders fire at the task's exact due time

// True if the browser can even show notifications (independent of FCM).
function notifCapable(){
  return ('Notification' in window) && ('serviceWorker' in navigator);
}
function notifSupported(){
  return !!(FB.messaging && 'Notification' in window && 'serviceWorker' in navigator);
}
function notifPermission(){
  return ('Notification' in window)?Notification.permission:'unsupported';
}

// Register the dedicated messaging service worker (separate scope/file required by FCM).
async function registerMessagingSW(){
  if(!('serviceWorker' in navigator))return null;
  try{
    return await navigator.serviceWorker.register('/firebase-messaging-sw.js');
  }catch(e){
    console.warn('Messaging SW registration failed:',e);
    return null;
  }
}

// Ask the OS/browser for notification permission. MUST be called directly from
// a user gesture (button click) with no awaits before it, or Android/iOS will
// silently skip the system dialog. Returns the resulting permission string.
async function requestNotifPermission(){
  if(!('Notification' in window))return 'unsupported';
  // Notification.requestPermission supports both promise and legacy callback.
  try{
    const r=Notification.requestPermission(function(){});
    // If it returned a promise, await it; otherwise read the updated value.
    if(r&&typeof r.then==='function')return await r;
    return Notification.permission;
  }catch(e){
    return await new Promise(res=>{
      try{Notification.requestPermission(res);}catch(_){res(Notification.permission);}
    });
  }
}

// Enable flow. Permission is requested FIRST (so the Android dialog always
// shows), independently of whether FCM/VAPID are ready. Token retrieval only
// happens afterwards and only if it's configured.
async function enablePushNotifications(){
  if(!notifCapable()){
    toast(L==='fa'?'این دستگاه از اعلان‌ها پشتیبانی نمی‌کند':'This device does not support notifications');
    return false;
  }

  // 1) Always ask the OS first — this is what shows the Samsung/Android dialog.
  let perm=notifPermission();
  if(perm!=='granted'){
    perm=await requestNotifPermission();
  }
  if(perm==='denied'){
    toast(L==='fa'?'اجازه اعلان رد شد. از تنظیمات مرورگر آن را آزاد کنید.':'Notifications blocked. Re-enable in browser settings.');
    return false;
  }
  if(perm!=='granted'){
    toast(L==='fa'?'اجازه اعلان داده نشد':'Notification permission not granted');
    return false;
  }

  // Permission granted. Mark local state so the toggle reflects reality even
  // if the push-token step can't complete yet.
  DB.meta.notifPermGranted=true;

  // 2) Now try to register for FCM push (needs messaging support + VAPID key).
  if(!FB.messaging){
    saveDB();
    toast(L==='fa'?'اجازه داده شد، ولی Push روی این مرورگر پشتیبانی نمی‌شود':'Allowed, but push isn\u2019t supported on this browser');
    return true;
  }
  if(FCM_VAPID_KEY.startsWith('REPLACE_')){
    saveDB();
    console.warn('FCM VAPID key not configured — permission granted but no token fetched.');
    toast(L==='fa'?'اجازه داده شد. کلید Push هنوز تنظیم نشده.':'Allowed. Push key not configured yet.');
    return true;
  }

  try{
    const swReg=await registerMessagingSW();
    const token=await FB.messaging.getToken({vapidKey:FCM_VAPID_KEY,serviceWorkerRegistration:swReg||undefined});
    if(!token){
      saveDB();
      toast(L==='fa'?'اجازه داده شد، ولی توکن دریافت نشد':'Allowed, but couldn\u2019t get push token');
      return true;
    }
    _fcmToken=token;
    await storeDeviceToken(token);
    DB.meta.pushEnabled=true;saveDB();
    attachForegroundHandler();
    toast(L==='fa'?'اعلان‌ها فعال شد ✓':'Notifications enabled ✓');
    return true;
  }catch(e){
    console.warn('getToken failed:',e);
    saveDB();
    toast(L==='fa'?'اجازه داده شد، ولی ثبت Push ناموفق بود':'Allowed, but push registration failed');
    return true;
  }
}

// Persist token in Firestore so the Cloud Function can target this device.
async function storeDeviceToken(token){
  if(!FB.ready||!FB.user||!token)return;
  const ws=wsId(FB.user.uid);
  const tzOffsetMin=-new Date().getTimezoneOffset(); // minutes east of UTC
  await FB.db.collection('workspaces').doc(ws).collection('devices').doc(token).set({
    token,
    platform:navigator.userAgent||'unknown',
    tzOffsetMin,
    lang:DB.meta.lang||'en',
    updatedAt:firebase.firestore.FieldValue.serverTimestamp()
  },{merge:true}).catch(e=>console.warn('storeDeviceToken:',e));
}

// Remove token (called on sign-out or when user disables).
async function removeDeviceToken(){
  try{
    if(_fcmToken&&FB.messaging&&FB.messaging.deleteToken)await FB.messaging.deleteToken();
    if(FB.ready&&FB.user&&_fcmToken){
      const ws=wsId(FB.user.uid);
      await FB.db.collection('workspaces').doc(ws).collection('devices').doc(_fcmToken).delete().catch(()=>{});
    }
  }catch(e){console.warn('removeDeviceToken:',e);}
  _fcmToken=null;DB.meta.pushEnabled=false;DB.meta.notifPermGranted=false;saveDB();
}

// Foreground messages don't trigger the SW; show them manually.
let _fgHandlerAttached=false;
function attachForegroundHandler(){
  if(_fgHandlerAttached||!FB.messaging)return;
  _fgHandlerAttached=true;
  FB.messaging.onMessage(payload=>{
    const n=(payload&&payload.notification)||{};
    const title=n.title||'MBM Life';
    const body=n.body||'';
    try{
      if(Notification.permission==='granted'){
        new Notification(title,{body,icon:'/icon-192.png',tag:(payload.data&&payload.data.tag)||undefined});
      }else{
        toast(title+(body?' — '+body:''));
      }
    }catch(e){toast(title);}
  });
}

// Re-sync token on app start if the user previously enabled push.
async function refreshPushOnStart(){
  if(!notifSupported())return;
  if(DB.meta.pushEnabled&&notifPermission()==='granted'&&!FCM_VAPID_KEY.startsWith('REPLACE_')){
    try{
      const swReg=await registerMessagingSW();
      const token=await FB.messaging.getToken({vapidKey:FCM_VAPID_KEY,serviceWorkerRegistration:swReg||undefined});
      if(token){_fcmToken=token;await storeDeviceToken(token);attachForegroundHandler();}
    }catch(e){console.warn('refreshPushOnStart:',e);}
  }
}

/* ── Profile photo: compress, set, choose avatar, remove ── */
function compressImage(file,cb){
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const max=256;
      let w=img.width,h=img.height;
      if(w>h){if(w>max){h=Math.round(h*max/w);w=max;}}
      else{if(h>max){w=Math.round(w*max/h);h=max;}}
      const cv=document.createElement('canvas');
      cv.width=w;cv.height=h;
      const ctx=cv.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      let q=0.7,out=cv.toDataURL('image/jpeg',q);
      // Keep well under Firestore 1MB doc limit; target < ~120KB
      while(out.length>120000&&q>0.4){q-=0.1;out=cv.toDataURL('image/jpeg',q);}
      cb(out);
    };
    img.onerror=()=>cb(null);
    img.src=e.target.result;
  };
  reader.onerror=()=>cb(null);
  reader.readAsDataURL(file);
}
function setPhotoFromFile(file){
  if(!file)return;
  compressImage(file,dataUrl=>{
    if(!dataUrl){toast(L==='fa'?'خطا در پردازش عکس':'Could not process image');return;}
    DB.meta.photo=dataUrl;
    DB.meta.avatar=null;
    saveDB();
    pushProfile();
    closeSheet();
    render();
  });
}

  DB.meta.avatar=id;
  DB.meta.photo=null;

}
function removeProfilePhoto(){

}

function openNotificationsSheet(){
  const perm=notifPermission();
  const capable=notifCapable();
  const granted=perm==='granted';
  // "on" reflects reality: permission granted (token may still be pending if
  // VAPID isn't configured yet, but the user has enabled notifications).
  const on=granted && (!!DB.meta.pushEnabled || DB.meta.notifPermGranted===true);
  if(DB.meta.notifPrefs===undefined)DB.meta.notifPrefs={taskReminders:true,dueToday:true,sharedActivity:true};
  const p=DB.meta.notifPrefs;
  let statusLine='';
  if(!capable)statusLine=L==='fa'?'این دستگاه از اعلان‌ها پشتیبانی نمی‌کند.':'This device does not support notifications.';
  else if(perm==='denied')statusLine=L==='fa'?'اجازه اعلان در مرورگر مسدود شده. از تنظیمات مرورگر آن را آزاد کنید.':'Notifications are blocked in the browser. Re-enable them in browser settings.';
  else if(!on)statusLine=L==='fa'?'برای دریافت یادآورها اعلان‌ها را فعال کنید.':'Enable notifications to receive reminders.';
  else statusLine=L==='fa'?'اعلان‌ها فعال است.':'Notifications are on.';

  const prefRow=(key,label)=>`
    <div class="set-trow">
      <span class="set-trow-label">${label}</span>
      <div class="set-sw ${p[key]!==false?'on':''}" data-notif="${key}" role="switch"></div>
    </div>`;

  openSheet(`
    <div style="padding:8px 16px 4px;font-size:17px;font-weight:800">${tr('notifications')}</div>
    <div style="padding:0 18px 8px;font-size:13px;color:var(--ink3)">${statusLine}</div>
    <div style="padding:4px 14px 8px">
      <button class="btn ${on?'btn-ghost':'btn-primary'}" id="notif-enable" style="width:100%"
        ${(!capable||perm==='denied')?'disabled style="width:100%;opacity:.5"':''}>
        ${on?(L==='fa'?'اعلان‌ها فعال است ✓':'Notifications enabled ✓'):(L==='fa'?'فعال‌سازی اعلان‌ها':'Enable notifications')}
      </button>
    </div>
    ${on?`
    <div class="hub-sec-label">${L==='fa'?'یادآورها':'Reminders'}</div>
    <div class="set-group" style="margin:0 14px 10px">
      ${prefRow('taskReminders',L==='fa'?'یادآور زمان کار':'Task time reminders')}
      ${prefRow('dueToday',L==='fa'?'یادآور کارهای امروز':"'Due today' summary")}
      ${prefRow('sharedActivity',L==='fa'?'فعالیت لیست مشترک':'Shared list activity')}
    </div>
    <div style="padding:0 14px 8px">
      <button class="sheet-cancel" id="notif-disable" style="margin:0;border-radius:var(--r);color:var(--danger)">${L==='fa'?'غیرفعال‌کردن اعلان‌ها':'Turn off notifications'}</button>
    </div>`:''}
    <button class="sheet-cancel">${L==='fa'?'بستن':'Close'}</button>`);

  document.querySelectorAll('.sheet-cancel').forEach(b=>{if(!b.id)b.onclick=()=>closeSheet();});
  const en=document.getElementById('notif-enable');
  if(en&&!on)en.onclick=()=>{
    // Kick off the OS permission request synchronously inside the gesture,
    // then finish enabling. Do not await anything before this call.
    enablePushNotifications().then(ok=>{closeSheet();if(ok)openNotificationsSheet();});
  };
  const dis=document.getElementById('notif-disable');
  if(dis)dis.onclick=async()=>{await removeDeviceToken();closeSheet();openNotificationsSheet();};
  document.querySelectorAll('[data-notif]').forEach(el=>el.onclick=()=>{
    const k=el.dataset.notif;
    if(!DB.meta.notifPrefs)DB.meta.notifPrefs={};
    DB.meta.notifPrefs[k]=(DB.meta.notifPrefs[k]===false);
    el.classList.toggle('on',DB.meta.notifPrefs[k]!==false);
    saveDB();
    // Persist prefs to the device doc so the Cloud Function respects them.
    if(FB.ready&&FB.user&&_fcmToken){
      const ws=wsId(FB.user.uid);
      FB.db.collection('workspaces').doc(ws).collection('devices').doc(_fcmToken)
        .set({prefs:DB.meta.notifPrefs},{merge:true}).catch(()=>{});
    }
  });
}
